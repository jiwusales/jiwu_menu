<script>
// 初始化設定
document.documentElement.style.setProperty('--theme-color', CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color', CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent = CONFIG.TOP_BAR_TEXT;

let allItems = [], allCategories = [], allTypes = [], selectedTypes = [], selectedRole = null;
let selectedStockFilters = [];
// 貨況勾選項目：key 對應 getStockInfo() 回傳的 tagKey，label 是勾選欄位顯示的文字
const STOCK_FILTER_OPTIONS = [
  { key: "現貨", label: "現貨" },
  { key: "預訂", label: "預訂" },
  { key: "SOLD OUT", label: "補貨登記" }
];
let cart = JSON.parse(localStorage.getItem('jiwu_cart')) || [];

// 側邊選單開關
function toggleMenu(isOpen) {
  const menu = document.getElementById('side-menu');
  const overlay = document.getElementById('menu-overlay');
  if (isOpen) {
    menu.classList.add('open');
    overlay.style.display = 'block';
  } else {
    menu.classList.remove('open');
    overlay.style.display = 'none';
  }
}

// 載入試算表資料（安全轉換字串型態）
function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1`;
  fetch(url).then(r => r.text()).then(t => {
    try {
      const data = JSON.parse(t.substr(47).slice(0,-2));

      // 依標題名稱找出每個欄位在試算表中的實際位置
      const HEADER_NAMES = { ip: "IP", role: "角色", type: "種類", name: "名稱", originalPrice: "原價", price: "售價", colStock: "庫存", colShop: "店面", colNonStock: "非現", status: "狀態", sn: "貨號", img: "圖片", url: "商品網址", size: "尺寸", note: "備註" };
      const colLabels = (data.table.cols || []).map(c => String(c.label || "").trim());
      const COL = {};
      Object.keys(HEADER_NAMES).forEach(key => {
        COL[key] = colLabels.indexOf(HEADER_NAMES[key]);
      });

      const getV = (r, idx) => {
        if (!r.c || !r.c[idx]) return "";
        const cell = r.c[idx];
        const val = cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || "");
        return String(val).trim();
      };
      const rawItems = data.table.rows.map(r => ({
        ip: getV(r, COL.ip),
        role: getV(r, COL.role) || "其他角色",
        type: getV(r, COL.type) || "其他",
        name: getV(r, COL.name),
        originalPrice: getV(r, COL.originalPrice),
        price: getV(r, COL.price),
        colStock: getV(r, COL.colStock),
        colShop: getV(r, COL.colShop),
        colNonStock: getV(r, COL.colNonStock),
        status: getV(r, COL.status),
        sn: getV(r, COL.sn),
        img: getV(r, COL.img) || "https://i.postimg.cc/bv5xRs04/image.png",
        url: getV(r, COL.url),
        size: getV(r, COL.size),
        note: getV(r, COL.note)
      }));

      // 取得同 IP 名稱底下第一列的備註欄，作為頁面最上方的 banner 圖片網址
      const ipRows = CONFIG.IP_NAME ? rawItems.filter(i => i.ip === CONFIG.IP_NAME) : rawItems;
      const bannerUrl = ipRows.length > 0 ? ipRows[0].note : "";
      renderBanner(bannerUrl);

      allItems = rawItems.filter(item => {
        if (CONFIG.IP_NAME && item.ip && item.ip !== CONFIG.IP_NAME) return false;
        const stockVal = String(item.colStock).trim().toLowerCase();
        return stockVal !== 'x' && stockVal !== 'ｘ';
      });

      allCategories = [...new Set(allItems.map(i => i.role))];
      allTypes = [...new Set(allItems.map(i => i.type))];
      
      renderSideMenu();
      renderRoleNav();
      renderFilters();
      renderItems();
      updateCartUI();
    } catch (e) { document.getElementById('items-wrapper').innerHTML = "載入失敗。"; }
  });
}

// 渲染頁面最上方的 banner 圖片（網址取自同 IP 名稱第一列的備註欄）
function renderBanner(url) {
  const wrapper = document.getElementById('banner-wrapper');
  if (!wrapper) return;
  const trimmed = (url || "").trim();
  wrapper.innerHTML = trimmed ? `<img src="${trimmed}" alt="banner">` : "";
}

function renderSideMenu() {
  const menuContainer = document.getElementById('side-menu-items');
  const links = [
    { name: "吉伊卡哇", url: "https://jiwusales.github.io/jiwu_menu/CHWBM.html", img: "https://i.postimg.cc/MHGy2vVz/12-2025xia-ri-1.png" },
    { name: "吉伊卡哇樂園", url: "https://jiwusales.github.io/jiwu_menu/CParkBM.html", img: "https://i.postimg.cc/50PqVSdK/ckwp-icon.png" },
    { name: "Nagano白熊", url: "https://jiwusales.github.io/jiwu_menu/NGNBM.html", img: "https://i.postimg.cc/hP8v81NH/icon019.png" }
  ];
  
  menuContainer.innerHTML = links.map(link => `
    <a href="${link.url}" class="menu-item">
      <img src="${link.img}"> ${link.name}
    </a>
  `).join('');
}

// 購物車邏輯
function saveCart() { localStorage.setItem('jiwu_cart', JSON.stringify(cart)); }

function addToCart(e, item, tagText, tagBg, tagColor) {
  e.stopPropagation();
  const itemIp = (item.ip && String(item.ip).trim()) ? String(item.ip).trim() : (CONFIG.IP_NAME || "");
  cart.push({ ...item, ip: itemIp, groupName: itemIp || CONFIG.SHEET_NAME, currentStatus: tagText || "", tagBg: tagBg, tagColor: tagColor });
  saveCart();
  updateCartUI();
  const btn = e.target;
  btn.style.background = "#fdd365";
  setTimeout(() => { btn.style.background = "#ddd"; }, 50); 
}

function clearCart() {
  if (confirm("確定要清空購物車嗎？")) { cart = []; saveCart(); updateCartUI(); }
}

function toggleCart(isOpen) {
  const panel = document.getElementById('cart-panel');
  const bg = document.getElementById('cart-overlay-bg');
  if(isOpen) { panel.classList.add('open'); bg.style.display = 'block'; }
  else { panel.classList.remove('open'); bg.style.display = 'none'; }
}

function getDisplayPrice(price) {
  const p = String(price || "").trim();
  if (p.indexOf('-') !== -1) return "組合出售";
  if (p === "") return "詢問花花";
  if (/^[0-9]+$/.test(p)) return `$${p}`;
  return p;
}

function updateCartUI() {
  const list = document.getElementById('cart-list');
  const badge = document.getElementById('cart-badge');
  const totalEl = document.getElementById('cart-total');
  list.innerHTML = "";
  let total = 0;
  let hasInquiry = false;

  cart.forEach((item, index) => {
    const isNumeric = /^[0-9]+$/.test(String(item.price || "").trim());
    const priceVal = isNumeric ? parseInt(item.price) : 0;
    if (!isNumeric) hasInquiry = true;
    total += priceVal;

    const div = document.createElement('div');
    div.className = 'cart-item';
    const tagHtml = item.currentStatus ? `<div class="cart-tag" style="background-color:${item.tagBg}; color:${item.tagColor || 'white'};">${item.currentStatus}</div>` : "";
    
    div.innerHTML = `
      <img src="${item.img}">
      <div class="cart-item-info">
        ${tagHtml}
        <div style="font-weight:bold; margin-bottom:2px;">${item.name}</div>
        <div style="color:#e44d26; font-weight:bold; margin-top:2px;">${getDisplayPrice(item.price)}</div>
      </div>
      <span style="cursor:pointer; color:#ccc; padding:5px;" onclick="removeFromCart(${index})">✕</span>
    `;
    list.appendChild(div);
  });
  badge.textContent = cart.length;
  badge.style.display = cart.length > 0 ? "flex" : "none";
  totalEl.textContent = `$${total}${hasInquiry ? " + 詢問報價" : ""}`;
}

function removeFromCart(index) {
  cart.splice(index, 1); saveCart(); updateCartUI();
  if(document.getElementById('checkout-modal').style.display === "flex") renderCheckoutSummary();
}

function generateLineMessage() {
  let msg = "你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n";
  let total = 0;
  let hasInquiry = false;

  const groupedCart = {};
  const groupOrder = [];
  cart.forEach(item => {
    const gName = (item.ip && String(item.ip).trim())
      ? String(item.ip).trim()
      : (CONFIG.IP_NAME || "商品");
    if (!groupedCart[gName]) {
      groupedCart[gName] = [];
      groupOrder.push(gName);
    }
    groupedCart[gName].push(item);
  });

  let index = 1;
  groupOrder.forEach(gName => {
    msg += `\n【${gName}】\n`;
    groupedCart[gName].forEach(item => {
      const priceRaw = String(item.price || "").trim();
      let priceText = "";
      let priceVal = 0;

      if (/^[0-9]+$/.test(priceRaw)) {
        priceVal = parseInt(priceRaw);
        priceText = `$${priceRaw}`;
      } else if (priceRaw.indexOf('-') !== -1) {
        priceText = "組合出售";
        hasInquiry = true;
      } else if (priceRaw === "") {
        priceText = "詢問花花";
        hasInquiry = true;
      } else {
        priceText = priceRaw;
        hasInquiry = true;
      }
      total += priceVal;

      const statusText = item.currentStatus ? `(${item.currentStatus})` : "";
      msg += `${index}.${statusText}${item.name} ${priceText}\n`;
      index++;
    });
  });

  msg += `\n總金額：$${total}${hasInquiry ? " + 詢問報價" : ""}`;

  return msg;
}

function handleCheckoutEntry() {
  if (cart.length === 0) return alert("購物車是空的唷！");
  const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobileDevice) {
    const msg = generateLineMessage();
    window.location.href = CONFIG.LINE_MSG_URL + encodeURIComponent(msg);
    setTimeout(() => { 
      cart = []; saveCart(); updateCartUI(); toggleCart(false); 
    }, 1500);
  } else {
    openCheckoutModal();
  }
}

function openCheckoutModal() {
  toggleCart(false);
  document.getElementById('step-1').style.display = "block";
  document.getElementById('step-2').style.display = "none";
  renderCheckoutSummary();
  document.getElementById('checkout-modal').style.display = "flex";
}

function renderCheckoutSummary() {
  const summaryList = document.getElementById('modal-summary-list');
  const totalEl = document.getElementById('modal-total-price');
  summaryList.innerHTML = "";
  let total = 0;
  let hasInquiry = false;

  cart.forEach((item) => {
    const isNumeric = /^[0-9]+$/.test(String(item.price || "").trim());
    const priceVal = isNumeric ? parseInt(item.price) : 0;
    if (!isNumeric) hasInquiry = true;
    total += priceVal;

    const div = document.createElement('div');
    div.className = 'cart-item';
    const tagHtml = item.currentStatus ? `<div class="cart-tag" style="background-color:${item.tagBg}; color:${item.tagColor || 'white'};">${item.currentStatus}</div>` : "";
    div.innerHTML = `
      <img src="${item.img}">
      <div class="cart-item-info">
        ${tagHtml}
        <div style="font-weight:bold; margin-bottom:2px;">${item.name}</div>
        <div style="color:#e44d26; font-weight:bold; margin-top:2px;">${getDisplayPrice(item.price)}</div>
      </div>
    `;
    summaryList.appendChild(div);
  });
  totalEl.textContent = `$${total}${hasInquiry ? " + 詢問報價" : ""}`;
}

function closeModal() { document.getElementById('checkout-modal').style.display = "none"; }

async function handleFinalCheckout() {
  const lineName = document.getElementById('user-line').value.trim();
  const igAcc = document.getElementById('user-ig').value.trim();
  
  if (!lineName) {
    alert("請輸入LINE名稱方便核對ι(｀･-･´)/");
    return;
  }

  const btn = document.getElementById('send-btn');
  btn.disabled = true; 
  btn.textContent = "傳送中 ᓫ(๑º꒳º๑)ꜝꜝ";

  try {
    const cartData = cart.map(item => {
      return {
        ip: item.ip || CONFIG.IP_NAME || "", 
        role: item.role,      
        type: item.type,      
        name: item.name,              
        originalPrice: item.originalPrice,
        price: item.price,    
        colStock: item.colStock,
        colShop: item.colShop,
        colNonStock: item.colNonStock,
        status: item.status,
        sn: item.sn,          
        img: item.img,
        url: item.url,
        size: item.size,
        note: item.note
      };
    });

    const postData = { 
      source: "電腦",          
      lineName: lineName,   
      igAccount: igAcc,     
      cartItems: cartData 
    };

    await fetch(CONFIG.DEPLOY_URL, { 
      method: 'POST', 
      mode: 'no-cors', 
      body: JSON.stringify(postData) 
    });
  } catch (e) {
    console.error("GAS 傳送失敗", e);
  }

  cart = []; 
  saveCart(); 
  updateCartUI();
  
  document.getElementById('step-1').style.display = "none";
  document.getElementById('step-2').style.display = "block";
}

// 渲染導覽與篩選
function renderRoleNav() {
  const nav = document.getElementById('dynamic-nav');
  nav.innerHTML = allCategories.map(cat => {
    const isSelected = selectedRole === cat;
    return `<a class="${isSelected ? 'active-role' : ''}" onclick="toggleRole('${cat}')">${cat}</a>`;
  }).join('');
}

function toggleRole(cat) { 
  selectedRole = (selectedRole === cat) ? null : cat; 
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderRoleNav(); 
  renderItems(); 
}

function renderFilters() {
  const filterBar = document.getElementById('filter-bar');
  const typeHtml = allTypes.map(t => {
    const isActive = selectedTypes.includes(t);
    return `<label class="filter-item ${isActive ? 'active' : ''}"><input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleType('${t}')">${t}</label>`;
  }).join('');

  // 只顯示目前商品清單裡實際存在的貨況（例如沒有任何商品是「-」，就不顯示「補貨登記」勾選項）
  const availableStockKeys = new Set(allItems.map(i => getStockInfo(i).tagKey).filter(Boolean));
  const stockHtml = STOCK_FILTER_OPTIONS.filter(opt => availableStockKeys.has(opt.key)).map(opt => {
    const isActive = selectedStockFilters.includes(opt.key);
    return `<label class="filter-item ${isActive ? 'active' : ''}"><input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleStockFilter('${opt.key}')">${opt.label}</label>`;
  }).join('');

  filterBar.innerHTML = stockHtml + typeHtml;
}

function toggleType(type) {
  if (selectedTypes.includes(type)) { selectedTypes = selectedTypes.filter(t => t !== type); }
  else { selectedTypes.push(type); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderFilters(); renderItems();
}

function toggleStockFilter(key) {
  if (selectedStockFilters.includes(key)) { selectedStockFilters = selectedStockFilters.filter(k => k !== key); }
  else { selectedStockFilters.push(key); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderFilters(); renderItems();
}

// 渲染商品卡片
function renderItems() {
  const container = document.getElementById('items-wrapper');
  container.innerHTML = "";
  const isFilterMode = selectedTypes.length > 0 || selectedStockFilters.length > 0;
  let filteredItems = selectedTypes.length > 0 ? allItems.filter(i => selectedTypes.includes(i.type)) : allItems;
  if (selectedStockFilters.length > 0) {
    filteredItems = filteredItems.filter(i => selectedStockFilters.includes(getStockInfo(i).tagKey));
  }
  if (selectedRole) { filteredItems = filteredItems.filter(i => i.role === selectedRole); }
  
  if (filteredItems.length === 0) {
    container.innerHTML = "<div style='padding: 40px; color: #999;'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";
    return;
  }

  if (!isFilterMode && !selectedRole) {
    allCategories.forEach(cat => {
      const catItems = filteredItems.filter(i => i.role === cat);
      if (catItems.length === 0) return;
      const div = document.createElement('div');
      div.className = 'type-divider'; div.id = cat; div.textContent = cat;
      container.appendChild(div);
      const grid = document.createElement('div');
      grid.className = 'group-grid';
      catItems.forEach(item => grid.appendChild(createCard(item)));
      container.appendChild(grid);
    });
  } else {
    const grid = document.createElement('div');
    grid.className = 'group-grid';
    grid.style.paddingTop = "10px";
    filteredItems.forEach(item => grid.appendChild(createCard(item)));
    container.appendChild(grid);
  }
}

// 依商品的庫存/店面/非現/欄位資料，計算這個商品目前的貨況狀態
// 回傳 { tagKey, tagText, tagBg, tagColor, tagClass }，tagKey 是給篩選/顯示設定用的識別字串
function getStockInfo(item) {
  let tagKey = "", tagText = "", tagBg = "#fab460", tagColor = "white", tagClass = "";

  const stockNum = parseFloat(item.colStock) || 0;
  const shopNum = parseFloat(item.colShop) || 0;
  const nonStockNum = parseFloat(item.colNonStock) || 0;
  const nonStockRaw = String(item.colNonStock).toLowerCase();

  if (item.colStock === "-") {
    tagKey = "SOLD OUT";
    tagText = "S☹LD OUT"; tagBg = "#3a3a3a"; tagColor = "#ffffff"; tagClass = "sold-out";
  }
  else if (stockNum > 0 || shopNum > 0) {
    tagKey = "現貨";
    tagText = "現貨"; tagBg = "#FFF4BD"; tagColor = "#333";
  }
  else if (nonStockNum > 0 && nonStockRaw.endsWith('v')) {
    tagKey = "受注";
    tagText = "受注"; tagBg = "#B1DEC1";
  }
  else if (nonStockNum > 0) {
    tagKey = "路上";
    tagText = "路上"; tagBg = "#6C95B0";
  }
  else if (item.colStock === "0" && item.colShop === "") {
    tagKey = "預訂";
    tagText = "預訂"; tagBg = "#C197D2";
  }

  return { tagKey, tagText, tagBg, tagColor, tagClass };
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  
  const borderCol = CONFIG.ROLE_BORDER_COLORS[item.role] || CONFIG.THEME_COLOR;
  card.style.borderColor = borderCol;

  const { tagKey, tagText, tagBg, tagColor, tagClass } = getStockInfo(item);
  if (tagKey === "SOLD OUT") card.classList.add('is-sold-out'); // 灰階效果不受標籤顯示設定影響，只要是售完狀態就套用

  // 依照 CONFIG.VISIBLE_STOCK_TAGS 決定這個標籤是否要顯示
  const shouldShowTag = tagKey && CONFIG.VISIBLE_STOCK_TAGS.includes(tagKey);
  const displayTagText = shouldShowTag ? tagText : "";

  let finalTagClass = tagClass ? tagClass : (displayTagText.length >= 2 ? "vertical" : "");
  let tagHtml = displayTagText ? `<div class="stock-tag ${finalTagClass}" style="background-color:${tagBg}; color:${tagColor};">${displayTagText}</div>` : "";
  let addBtnHtml = `<div class="add-btn-tag" onclick="addToCart(event, ${JSON.stringify(item).replace(/"/g, '&quot;')}, '${displayTagText}', '${tagBg}', '${tagColor}')">＋</div>`;
  let sizeHtml = item.size ? `<div class="size">${item.size}</div>` : `<div class="size"></div>`;
  
  card.innerHTML = `${tagHtml}${addBtnHtml}<img src="${item.img}"><div class="name">${formatName(item.name)}</div><div class="price">${getDisplayPrice(item.price)}</div>${sizeHtml}`;
  card.onclick = () => zoomCard(card);
  return card;
}

function formatName(n) {
  if (!n) return n;
  // 如果名稱中有空白鍵，直接在空白處換行
  if (n.indexOf(' ') !== -1) return n.split(' ').join('<br>');
  return n.length > 9 ? n.slice(0, 9) + "<br>" + n.slice(9) : n;
}

function zoomCard(c) {
  const ov = document.createElement('div'); ov.className = 'card-overlay';
  const clone = c.cloneNode(true); ov.appendChild(clone);
  ov.onclick = () => ov.remove(); document.body.appendChild(ov);
}

// 懸浮購物車拖動邏輯
(function initDraggableCart() {
  const el = document.getElementById('cart-trigger');
  let isDragging = false;
  let startX, startY, initialX, initialY;
  const dragStart = (e) => {
    isDragging = false; el.style.transition = 'none';
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
    startX = clientX; startY = clientY;
    const rect = el.getBoundingClientRect();
    initialX = rect.left; initialY = rect.top;
    document.addEventListener('mousemove', dragMove); document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('mouseup', dragEnd); document.addEventListener('touchend', dragEnd);
  };
  const dragMove = (e) => {
    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    const dx = clientX - startX, dy = clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      isDragging = true; if (e.cancelable) e.preventDefault();
      el.style.left = (initialX + dx) + 'px'; el.style.top = (initialY + dy) + 'px';
      el.style.right = 'auto'; el.style.bottom = 'auto';
    }
  };
  const dragEnd = () => {
    document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
    if (isDragging) {
      el.style.transition = 'left 0.3s ease, right 0.3s ease, top 0.3s ease';
      const rect = el.getBoundingClientRect(), screenWidth = window.innerWidth;
      if (rect.left + rect.width / 2 < screenWidth / 2) el.style.left = '10px';
      else el.style.left = (screenWidth - rect.width - 10) + 'px';
      if (rect.top < 50) el.style.top = '50px';
      if (rect.top > window.innerHeight - 60) el.style.top = (window.innerHeight - 60) + 'px';
    }
  };
  el.addEventListener('click', (e) => { if (isDragging) e.preventDefault(); else toggleCart(true); });
  el.addEventListener('mousedown', dragStart);
  el.addEventListener('touchstart', dragStart, { passive: false });
})();

// 頁面初始化
window.onload = loadData;
</script>
