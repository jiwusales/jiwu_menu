<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JIWU訂購專用</title>

  <link rel="icon" href="https://i.postimg.cc/3R7nNT0k/icon.png" type="image/png" />

  <script>
    /* =========================================================
     *  分頁與 頁面 控制設定區（自用版）
     * ========================================================= */
    const CONFIG = {
      THEME_COLOR: "#ffffff",
      ACTIVE_COLOR: "#f5b080",
      SHEET_ID: "10Q4EOGZPMsu9WOyabxZjU8j6QNuGduM8L-h_mZ10ypQ", // 跟原本開團頁面同一份試算表
      SHEET_NAME: "尚未上架",                                   // 請確認試算表裡有這個分頁，欄位標題需跟原分頁一致
      TOP_BAR_TEXT: "訂購專用",
      FAVICON: "https://i.postimg.cc/3R7nNT0k/icon.png",

      // 允許自動加入購物車的商城網域白名單
      AUTO_CART_DOMAINS: ["chiikawamarket.jp", "www.chiikawamarket.jp"]
    };
  </script>

  <style>
    :root {
      --theme-color: #ffffff;
      --active-color: #f5b080;
      --nav-bg: #f9f9f9;
      --text-color: #333333;
    }

    body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; color: var(--text-color); text-align: center; overflow-x: hidden; }

    .top-bar {
      background: var(--theme-color);
      color: #fff;
      padding: 10px 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-fixed { position: fixed; top: 40px; width: 100%; background: var(--nav-bg); z-index: 998; border-bottom: 1px solid #eee; }
    .nav-bar-wrapper { display: flex; align-items: center; padding: 0 5px; box-sizing: border-box; height: 38px; }

    .scroll-container { flex: 1; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .scroll-container::-webkit-scrollbar { display: none; }
    .nav-bar { display: inline-block; padding: 8px 0; font-size: 10pt; }
    .nav-bar a { color: var(--text-color); text-decoration: none; padding: 6px 0; display: inline-block; transition: 0.2s; cursor: pointer; }
    .nav-bar a.active-role { font-weight: bold; color: var(--active-color); }
    .nav-bar a::after { content: "｜"; color: #aaa; margin: 0 2px; font-weight: normal; }
    .nav-bar a:last-child::after { content: ""; }

    .nav-arrow { width: 24px; font-size: 16px; cursor: pointer; flex-shrink: 0; user-select: none; color: #bbb; display: flex; justify-content: center; align-items: center; }

    #card-container { padding: 78px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
    .group-grid { display: grid; grid-template-columns: repeat(4, 1fr); justify-content: start; gap: 6px; }
    @media (min-width: 480px) { .group-grid { grid-template-columns: repeat(auto-fill, 120px); } }

    .card { border: 2px solid var(--theme-color); border-radius: 8px; background: #fff; text-align: center; cursor: pointer; overflow: hidden; transition: 0.2s; position: relative; }
    .card.is-sold-out { filter: grayscale(100%); border-color: #999 !important; }
    .card.no-auto { border-color: #e57373 !important; }
    .no-auto-badge { position: absolute; top: 0; left: 0; width: 55px; height: 16px; background: #e57373; color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; border-radius: 0 0 8px 0; z-index: 10; }

    .add-btn-tag { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: #ddd; color: #fff; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 10; box-sizing: border-box; cursor: pointer; pointer-events: auto; }

    .card img { height: 90px; width: auto; max-width: 90%; display: block; margin: 5px auto 0px; object-fit: contain; pointer-events: none; }
    .card .name { margin: 1px auto; font-size: 9px; font-weight: bold; line-height: 1.2; padding: 0 2px; }
    .card .price { font-size: 10px; margin: 1px auto 1px; color: #F5B080; }
    .card .sn { font-size: 8px; margin: 0 auto 5px; color: #888888; }

    #cart-trigger {
      position: fixed; top: 88px; right: 15px; width: 45px; height: 45px;
      background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 999; opacity: 0.9; cursor: pointer;
    }
    #cart-trigger img { width: 28px; height: 28px; pointer-events: none; }
    #cart-badge { position: absolute; top: -2px; right: -2px; background: #ff4d4f; color: white; font-size: 10px; border-radius: 50%; width: 18px; height: 18px; display: none; align-items: center; justify-content: center; font-weight: bold; }

    #cart-panel { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 1001; transition: 0.3s ease; display: flex; flex-direction: column; }
    #cart-panel.open { right: 0; }
    #cart-overlay-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; }

    .cart-header { padding: 12px 15px; background: var(--theme-color); color: white; font-weight: bold; font-size: 16px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .cart-list { flex: 1; overflow-y: auto; padding: 10px; text-align: left; }
    .cart-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; font-size: 12px; }
    .cart-item img { width: 45px; height: 45px; object-fit: contain; border-radius: 4px; }
    .cart-item-info { flex: 1; }
    .cart-item-sn { font-size: 10px; color: #999; }
    .cart-item-warn { font-size: 10px; color: #e57373; font-weight: bold; }

    .cart-footer { padding: 15px 15px 25px; border-top: 1px solid #eee; background: #fafafa; }
    .text-clear { display: block; text-align: left; color: #aaa; font-size: 13px; text-decoration: underline; cursor: pointer; margin-bottom: 12px; font-weight: normal; }
    .btn-checkout { background: #4caf50; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-checkout:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
 <div class="top-bar">
    <span id="top-msg">載入中...</span>
  </div>

  <div class="header-fixed">
    <div class="nav-bar-wrapper">
      <div class="nav-arrow" onclick="document.getElementById('group-scroll').scrollBy(-150,0)">❮</div>
      <div class="scroll-container" id="group-scroll"><div class="nav-bar" id="dynamic-nav"></div></div>
      <div class="nav-arrow" onclick="document.getElementById('group-scroll').scrollBy(150,0)">❯</div>
    </div>
  </div>

  <div id="card-container">
    <div id="items-wrapper"></div>
  </div>

  <div id="cart-trigger" onclick="toggleCart(true)">
    <img src="https://images.icon-icons.com/2098/PNG/512/shopping_cart_icon_128753.png" alt="cart">
    <div id="cart-badge">0</div>
  </div>

  <div id="cart-overlay-bg" onclick="toggleCart(false)"></div>
  <div id="cart-panel">
    <div class="cart-header">
      <span>代購清單</span>
      <span style="cursor:pointer; font-size: 20px;" onclick="toggleCart(false)">✕</span>
    </div>
    <div class="cart-list" id="cart-list"></div>
    <div class="cart-footer">
      <span class="text-clear" onclick="clearCart()">清空清單</span>
      <button class="btn-checkout" id="checkout-btn" onclick="handleAutoCartCheckout()">前往商城購物車</button>
    </div>
  </div>

<script>
document.documentElement.style.setProperty('--theme-color', CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color', CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent = CONFIG.TOP_BAR_TEXT;

let allItems = [], allGroups = [], selectedGroup = null;
let cart = JSON.parse(localStorage.getItem('jiwu_self_cart')) || [];

function getUrlGroup() {
  return new URLSearchParams(location.search).get('group') || '';
}

function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1`;
  fetch(url).then(r => r.text()).then(t => {
    try {
      const data = JSON.parse(t.substr(47).slice(0,-2));
      const HEADER_NAMES = { group: "團名", role: "角色", name: "名稱", price: "售價", stock: "庫存", sn: "貨號", img: "圖片", url: "商品網址" };
      const colLabels = (data.table.cols || []).map(c => String(c.label || "").trim());
      const COL = {};
      Object.keys(HEADER_NAMES).forEach(key => { COL[key] = colLabels.indexOf(HEADER_NAMES[key]); });

      const getV = (r, idx) => {
        if (idx === -1 || !r.c || !r.c[idx]) return "";
        const cell = r.c[idx];
        const val = cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || "");
        return String(val).trim();
      };

      let lastGroup = "";
      const rawItems = data.table.rows.map(r => {
        const rawGroup = getV(r, COL.group);
        if (rawGroup !== "") lastGroup = rawGroup;
        return {
          group: lastGroup,
          role: getV(r, COL.role) || " ",
          name: getV(r, COL.name),
          price: getV(r, COL.price),
          stock: getV(r, COL.stock),
          sn: getV(r, COL.sn),
          img: getV(r, COL.img) || "https://i.postimg.cc/bv5xRs04/image.png",
          url: getV(r, COL.url)
        };
      });

      allItems = rawItems.filter(item => {
        if (!item.group || !item.name) return false;
        const stockVal = String(item.stock).trim().toLowerCase();
        return stockVal !== 'x' && stockVal !== 'ｘ';
      });

      allGroups = [...new Set(allItems.map(i => i.group))];
      const urlGroup = getUrlGroup();
      selectedGroup = allGroups.includes(urlGroup) ? urlGroup : allGroups[0];

      renderGroupNav();
      renderItems();
      updateCartUI();
    } catch (e) {
      document.getElementById('items-wrapper').innerHTML = "載入失敗，請確認試算表分頁名稱與欄位標題是否正確。";
    }
  });
}

function renderGroupNav() {
  const nav = document.getElementById('dynamic-nav');
  nav.innerHTML = allGroups.map(g => {
    const isSelected = selectedGroup === g;
    const safeName = g.replace(/'/g, "\\'");
    return `<a class="${isSelected ? 'active-role' : ''}" onclick="selectGroup('${safeName}')">${g}</a>`;
  }).join('');
}

function selectGroup(name) {
  if (!allGroups.includes(name) || name === selectedGroup) return;
  selectedGroup = name;
  renderGroupNav();
  renderItems();
}

function renderItems() {
  const container = document.getElementById('items-wrapper');
  container.innerHTML = "";
  const groupItems = allItems.filter(i => i.group === selectedGroup);
  if (groupItems.length === 0) {
    container.innerHTML = "<div style='padding: 40px; color: #999;'>這個分類目前沒有商品</div>";
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'group-grid';
  groupItems.forEach(item => grid.appendChild(createCard(item)));
  container.appendChild(grid);
}

function isAutoCartEligible(item) {
  if (!item || !item.sn || !item.url) return false;
  try {
    const host = new URL(item.url).hostname;
    return CONFIG.AUTO_CART_DOMAINS.includes(host);
  } catch (e) {
    return false;
  }
}

function createCard(item) {
  const card = document.createElement('div');
  const eligible = isAutoCartEligible(item);
  card.className = 'card' + (eligible ? '' : ' no-auto');

  const warnHtml = eligible ? '' : `<div class="no-auto-badge">缺貨號/網址</div>`;
  const addBtnHtml = `<div class="add-btn-tag" onclick="addToCart(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})">＋</div>`;
  const priceText = item.price ? `$${item.price}` : "";

  card.innerHTML = `${warnHtml}${addBtnHtml}<img src="${item.img}"><div class="name">${item.name}</div><div class="price">${priceText}</div><div class="sn">${item.sn || ''}</div>`;
  return card;
}

function saveCart() { localStorage.setItem('jiwu_self_cart', JSON.stringify(cart)); }

function addToCart(e, item) {
  e.stopPropagation();
  cart.push({ ...item });
  saveCart();
  updateCartUI();
  const btn = e.target;
  btn.style.background = "#fdd365";
  setTimeout(() => btn.style.background = "#ddd", 150);
}

function removeFromCart(index) {
  cart.splice(index, 1); saveCart(); updateCartUI();
}

function clearCart() {
  if (confirm("確定要清空代購清單嗎？")) { cart = []; saveCart(); updateCartUI(); }
}

function toggleCart(isOpen) {
  const panel = document.getElementById('cart-panel');
  const bg = document.getElementById('cart-overlay-bg');
  if (isOpen) { panel.classList.add('open'); bg.style.display = 'block'; }
  else { panel.classList.remove('open'); bg.style.display = 'none'; }
}

function updateCartUI() {
  const list = document.getElementById('cart-list');
  const badge = document.getElementById('cart-badge');
  list.innerHTML = "";

  cart.forEach((item, index) => {
    const eligible = isAutoCartEligible(item);
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <img src="${item.img}">
      <div class="cart-item-info">
        <div style="font-weight:bold;">${item.name}</div>
        <div class="cart-item-sn">貨號：${item.sn || '（無）'}</div>
        ${eligible ? '' : '<div class="cart-item-warn">⚠ 缺貨號或網址，需手動加入</div>'}
      </div>
      <span style="cursor:pointer; color:#ccc; padding:5px;" onclick="removeFromCart(${index})">✕</span>
    `;
    list.appendChild(div);
  });

  badge.textContent = cart.length;
  badge.style.display = cart.length > 0 ? "flex" : "none";
}

async function fetchVariantId(item) {
  const cleanUrl = item.url.trim().replace(/\/$/, "").split("?")[0];
  const jsUrl = `${cleanUrl}.js`;
  const res = await fetch(jsUrl, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.variants || !data.variants.length) throw new Error("查無款式資料");
  return data.variants[0].id;
}

async function handleAutoCartCheckout() {
  if (!cart.length) return alert("代購清單是空的唷！");

  const btn = document.getElementById('checkout-btn');
  btn.disabled = true;
  btn.textContent = "查詢商品中，請稍候...";

  const succeeded = [];
  const failed = [];

  await Promise.all(cart.map(async (item) => {
    if (!isAutoCartEligible(item)) {
      failed.push(`${item.name}（缺貨號或網址）`);
      return;
    }
    try {
      const variantId = await fetchVariantId(item);
      succeeded.push(`${variantId}:1`);
    } catch (e) {
      failed.push(`${item.name}（查詢失敗）`);
    }
  }));

  btn.disabled = false;
  btn.textContent = "前往商城購物車";

  if (succeeded.length === 0) {
    alert("很抱歉，商品查詢全部失敗，請確認貨號/網址是否正確，或稍後再試。");
    return;
  }

  if (failed.length > 0) {
    alert(`以下商品無法自動加入，請手動處理：\n${failed.join("\n")}\n\n其餘商品將自動開啟購物車頁面。`);
  }

  const cartUrl = `https://chiikawamarket.jp/cart/${succeeded.join(",")}`;
  window.open(cartUrl, "_blank");
}

window.onload = loadData;
</script>
</body>
</html>
