<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JIWU團務進度表</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/icon_9a717cff.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://images.weserv.nl" crossorigin>
<link rel="dns-prefetch" href="//images.weserv.nl">
<style>
:root{color-scheme:light;--ink:#344b3c;--muted:#777;--paper:#fafafb;--line:#e1e5ed;--soft:#ededee;--active:#9e8268}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:none;margin:auto;padding:0 32px 48px}.siteHeader{height:72px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:#fff;padding:0 32px;margin:0 calc(32px * -1) 22px}.siteTitle{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;color:#444}.siteTitle img{width:34px;height:34px;object-fit:contain}.save{border:0;border-radius:9px;background:var(--active);color:#fff;font-weight:800;padding:9px 15px;letter-spacing:.05em}.save[disabled]{opacity:.5}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filter,.status{border:0;border-radius:9px;background:var(--soft);color:#64666a;font-weight:700;padding:9px 14px;min-width:70px}.filter[aria-selected="true"],.status.selected{background:var(--active);color:#fff}.hint{font-size:13px;color:#73786a;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.tile{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:0;text-align:center;touch-action:manipulation}.tile.dragging{opacity:.5;outline:2px dashed var(--active);outline-offset:3px}.tile img,.blank{display:block;width:100%;aspect-ratio:1080/400;object-fit:cover;background:#eef1f7}.tile strong{display:block;min-height:44px;padding:9px 7px 3px;font-size:12px;line-height:1.35;overflow:hidden}.tile small{display:block;min-height:29px;padding:0 7px 9px;color:#7d746d;font-size:12px}.complete{margin:36px 0 18px;padding-top:22px;border-top:1px solid var(--line);color:var(--active);font-size:18px}.empty,.loading{padding:42px 0;text-align:center;color:var(--muted)}.login{position:fixed;inset:0;display:grid;place-items:center;background:#f4f1ec;z-index:10}.loginCard{width:min(360px,calc(100% - 32px));padding:30px;border-radius:18px;background:#fff;box-shadow:0 10px 30px #372e2520}.loginCard img{display:block;width:130px;margin:0 auto 16px}.loginCard input,.edit input,.edit textarea{width:100%;margin:10px 0;border:1px solid #ccd1d8;border-radius:9px;padding:10px;background:#fff}.loginCard label{font-size:13px;color:#666}.loginCard .save{width:100%;margin-top:14px}.error{min-height:20px;color:#c34b4b;font-size:13px}.dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:18px;padding:24px;box-shadow:0 16px 50px #0004}.dialog::backdrop{background:#0006}.dialogHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialogHead h2{margin:0;font-size:20px;color:#111}.light{border:0;border-radius:8px;background:#ededee;color:#666;padding:8px 12px;font-weight:700}.statuses{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:18px 0}.status{min-width:0;padding:8px 3px;font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.edit label{display:block;font-weight:700;font-size:14px}.edit textarea{resize:vertical;min-height:96px}.notice{position:fixed;right:20px;bottom:20px;border-radius:10px;background:#344b3c;color:#fff;padding:10px 14px;box-shadow:0 6px 18px #0002;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.notice.show{opacity:1;transform:none}@media(max-width:650px){.shell{padding:0 14px 36px}.siteHeader{height:60px;padding:0 14px;margin:0 -14px 16px}.siteTitle{font-size:18px}.siteTitle img{width:28px;height:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{gap:6px}.filter{min-width:0;padding:8px 11px;font-size:13px}.statuses{grid-template-columns:repeat(4,minmax(0,1fr));}.pair{grid-template-columns:1fr}.dialog{padding:18px}.hint{line-height:1.5}}
</style>
<style>
.siteTitle{font-family:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Hiragino Sans",sans-serif;font-weight:400}
.tile strong{display:flex;align-items:flex-end;justify-content:center;text-align:center}
.loading{grid-column:1/-1;width:100%;text-align:center}
.filters .filter{flex:1 1 120px;min-width:0}
.syncInfo{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:24px;margin:-5px 0 12px;color:#888;font-size:12px}.syncInfo button{border:0;background:transparent;color:#9e8268;padding:4px;cursor:pointer}.skeleton{height:180px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(#eef1f7 0 60%,#fff 60%);}.skeleton:after{content:"";display:block;margin:125px auto 0;width:65%;height:12px;border-radius:6px;background:#eee}
</style>
</head>
<body>
<main class="shell" id="app">
  <header class="siteHeader"><div class="siteTitle"><img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/icon_9a717cff.png" alt="">JIWU團務進度表</div></header>
  <nav class="filters" id="filters" aria-label="IP 分類"></nav>
  <div class="syncInfo" role="status"><span id="syncText">首次同步資料中…</span><button type="button" id="syncRetry" onclick="load()" hidden>重試</button></div>
  <section class="grid" id="activeGrid" aria-label="團務資料"><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></section><section id="completeSection" hidden><h2 class="complete">開團考古區</h2><div class="grid" id="completeGrid"></div></section>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbydO3PzBMzM-kkYqhq-sJOsp6eJOKhpR2PJYV9_NvyfzIBMn6n4il8Mz4_iQj2EWgg5/exec';
const FALLBACK='https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260927162319_04b00fa2.png';
const CATEGORY_ORDER=['吉伊卡哇&白熊','寶可夢','三麗鷗','海綿寶寶','綜合IP','鬼滅之刃','呪術廻戦','鏈鋸人','坂本日常','銀魂','薰香','冰之城牆&相反','綜合動漫'];
let data={entries:[],categories:[]},filter='全部';
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function safeURL(value){try{const url=new URL(value);return /^https?:$/.test(url.protocol)?url.href:''}catch(_){return ''}}
function thumbnail(value){return 'https://images.weserv.nl/?url='+encodeURIComponent(value)+'&w=640&q=75&output=webp'}
const CACHE_KEY='jiwu_public_group_work_v1:'+API_URL;
let loading=false,hasData=false,lastSuccess=0;
function validData(value){return !!value&&Array.isArray(value.entries)&&Array.isArray(value.categories)&&value.entries.every(entry=>entry&&typeof entry==='object'&&typeof entry.name==='string');}
function syncInfo(message,retry=false){document.getElementById('syncText').textContent=message;document.getElementById('syncRetry').hidden=!retry;}
function restoreCache(){
 try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!validData(cached?.data))return false;data=cached.data;hasData=true;render();syncInfo('顯示上次資料，背景更新中…');return true;}catch(_){return false;}
}
async function request(action,params={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
 try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...params}),signal:controller.signal});if(!response.ok)throw new Error('連線失敗（'+response.status+'）');const result=await response.json();if(!result.ok)throw new Error(result.error||'讀取失敗');return result;}
 catch(error){if(error.name==='AbortError')throw new Error('連線逾時，請稍後重試');throw error;}finally{clearTimeout(timer);}
}
async function load(){
 if(loading)return;loading=true;syncInfo(hasData?'顯示上次資料，背景更新中…':'首次同步資料中…');
 try{const next=await request('publicGroupWork');if(!validData(next))throw new Error('團務資料格式不正確');const changed=!hasData||JSON.stringify(next.entries)!==JSON.stringify(data.entries)||JSON.stringify(next.categories)!==JSON.stringify(data.categories);data=next;hasData=true;lastSuccess=Date.now();if(changed)render();try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:lastSuccess,data}));}catch(_){}syncInfo('已同步 '+new Date(lastSuccess).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));}
 catch(error){if(hasData)syncInfo('更新失敗，保留上次資料：'+error.message,true);else{document.getElementById('activeGrid').innerHTML='<p class="empty">暫時無法取得團務資料，請點「重試」。</p>';syncInfo(error.message,true);}}
 finally{loading=false;}
}
function compare(a,b){const ao=Number(a.workOrder),bo=Number(b.workOrder),ha=Number.isFinite(ao)&&ao>0,hb=Number.isFinite(bo)&&bo>0;if(ha||hb){if(ha&&hb)return ao-bo;return ha?-1:1}const date=x=>{const m=String(x.name||'').match(/^(\d{2})(\d{2})/);return m?Number(m[1])*32+Number(m[2]):-1};return date(b)-date(a)}
function shown(){return data.entries.filter(entry=>filter==='全部'||entry.category===filter).sort(compare)}
function render(){const available=new Set((data.categories||[]).filter(Boolean)),categories=['全部',...CATEGORY_ORDER.filter(category=>available.has(category))];if(!categories.includes(filter))filter='全部';document.getElementById('filters').innerHTML=categories.map(x=>`<button class="filter" aria-selected="${x===filter}" onclick="setFilter('${esc(x)}')">${esc(x)}</button>`).join('');const entries=shown(),active=entries.filter(x=>x.status!=='下班！'),complete=entries.filter(x=>x.status==='下班！');document.getElementById('activeGrid').innerHTML=cards(active)||'<p class="empty">目前沒有符合的團務資料。</p>';document.getElementById('completeGrid').innerHTML=cards(complete);document.getElementById('completeSection').hidden=!complete.length}
function cards(entries){return entries.map(entry=>{const image=safeURL(entry.image)||FALLBACK;return `<article class="tile"><img src="${esc(thumbnail(image))}" data-fallback="${esc(image)}" onerror="if(this.src!==this.dataset.fallback)this.src=this.dataset.fallback" alt="" loading="lazy" decoding="async"><strong>${esc(entry.name)}</strong><small>${esc(entry.status)}${entry.arrival?'｜抵台約'+esc(entry.arrival):''}</small></article>`}).join('')}
function setFilter(value){filter=value;render()}
restoreCache();
load();
setInterval(()=>{if(!document.hidden)load();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSuccess>15000)load();});
</script>
</body>
</html>
