      IP_NAME: "人魚島",                                       // 當前 IP 名稱
      THEME_COLOR: "#2ec7d1",                                  // 主要色系
      ACTIVE_COLOR: "#f5b080",                                 // 高亮 / 啟用色系

      SHEET_NAME: "商品庫存",                                   // 分頁名稱

      FAVICON: "https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/icon_9a717cff.png",
      LINE_ID: "@jiwusales", 
      LINE_LINK: "https://line.me/R/ti/p/@tei8245t",
      LINE_MSG_URL: "https://line.me/R/oaMessage/@tei8245t/?",

      // 這個頁面要顯示哪些貨況標籤？把不想顯示的名稱刪掉即可（順序不影響顯示邏輯）
      // 可用選項："現貨"、"SOLD OUT"、"受注"、"路上"、"預訂"
      VISIBLE_STOCK_TAGS: ["現貨", "SOLD OUT", "路上"],

      // 同 IP 下不同角色的商品卡邊框顏色對照表 (未設定的角色會預設使用 THEME_COLOR)
      ROLE_BORDER_COLORS: {
        "吉伊": "#d77485",
        "小八": "#6293b8",
        "兔兔": "#f9be3c",
        "小桃": "#838BC2",
        "師傅": "#CCAFA5",
        "栗子": "#94C973",
        "獅薩": "#FBAA60",
        "古本": "#eb9e97",
        "綜合角色": "#989FC0",
        "全角色": "#E24C60",
        "其他角色": "#45818e"
      }
    };
    // 商品資料先下載，不等待選單、QR 圖與其他頁面圖片。
    const catalogDataRequest = fetch(`${CONFIG.DEPLOY_URL}?format=gviz&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`)
      .then(response => { if (!response.ok) throw new Error('商品資料載入失敗'); return response.text(); });
    // 初始化前若網路失敗，保留原始錯誤交由 loadData 顯示。
    catalogDataRequest.catch(() => {});
  </script>

<script>
// 初始化設定
document.documentElement.style.setProperty('--theme-color', CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color', CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent = CONFIG.TOP_BAR_TEXT;

let allItems = [], allCategories = [], allTypes = [], selectedTypes = [], selectedRole = null;
let selectedStockFilters = [];
// 貨況勾選項目：key 對應 getStockInfo() 回傳的 tagKey，label 是勾選欄位顯示的文字
// 「路上」已經在 getStockInfo() 裡直接併入「現貨」的 key，所以這裡不用另外列
const STOCK_FILTER_OPTIONS = [
  { key: "現貨", label: "現貨" },
  { key: "預訂", label: "預訂" },
  { key: "SOLD OUT", label: "補貨登記" }
];
let cart = JSON.parse(localStorage.getItem('jiwu_cart')) || [];
function getCartSourceName(item){
  return String(
    item.groupName ||
    item.ipName ||
    item.ip ||
    item.group ||
    (typeof selectedGroup !== "undefined" ? selectedGroup : "") ||
    CONFIG.IP_NAME ||
    ""
  ).trim() || "商品";
}
// 側邊選單開關
function toggleMenu(isOpen) {
  const menu = document.getElementById('side-menu');
  const overlay = document.getElementById('menu-overlay');
  if (isOpen) {
    menu.classList.add('open');
    overlay.style.display = 'block';
  } else {
    menu.classList.remove('open');
    overlay.style.display = 'none';
  }
}

// 載入試算表資料（安全轉換字串型態）
function loadData() {
  return catalogDataRequest.then(t => {
    try {
      const data = JSON.parse(t.substr(47).slice(0,-2));

      // 依標題名稱找出每個欄位在試算表中的實際位置
      const HEADER_NAMES = { ip: "IP", role: "角色", type: "種類", name: "名稱", originalPrice: "原價", price: "售價", colStock: "庫存", colShop: "店面", colNonStock: "非現", status: "狀態", sn: "貨號", img: "圖片", url: "商品網址", size: "尺寸",format:"格式", note: "首圖" };
      const colLabels = (data.table.cols || []).map(c => String(c.label || "").trim());
      const COL = {};
      Object.keys(HEADER_NAMES).forEach(key => {
        COL[key] = colLabels.indexOf(HEADER_NAMES[key]);
      });

      const getV = (r, idx) => {
        if (!r.c || !r.c[idx]) return "";
        const cell = r.c[idx];
        const val = cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || "");
        return String(val).trim();
      };
      const rawItems = data.table.rows.map(r => ({
        ip: getV(r, COL.ip),
        role: getV(r, COL.role) || " ",
        type: getV(r, COL.type) || "其他",
        name: getV(r, COL.name),
        originalPrice: getV(r, COL.originalPrice),
        price: getV(r, COL.price),
        colStock: getV(r, COL.colStock),
        colShop: getV(r, COL.colShop),
        colNonStock: getV(r, COL.colNonStock),
        status: getV(r, COL.status),
        sn: getV(r, COL.sn),
        img: getV(r, COL.img) || "https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png",
        url: getV(r, COL.url),
        size: getV(r, COL.size),format:getV(r, COL.format),
        note: getV(r, COL.note)
      }));

      // 取得同 IP 名稱底下第一列的備註欄，作為頁面最上方的 banner 圖片網址
      const ipRows = CONFIG.IP_NAME ? rawItems.filter(i => i.ip === CONFIG.IP_NAME) : rawItems;
      const bannerUrl = ipRows.length > 0 ? ipRows[0].note : "";
      renderBanner(bannerUrl);

      allItems = rawItems.filter(item => {
        // 空白列與首圖設定列不產生商品卡片。
        if (!String(item.name || "").trim()) return false;
        if (CONFIG.IP_NAME && item.ip && item.ip !== CONFIG.IP_NAME) return false;
        const stockVal = String(item.colStock).trim().toLowerCase();
        return stockVal !== 'x' && stockVal !== 'ｘ';
      });

      allCategories = [...new Set(allItems.map(i => i.role))];
      allTypes = [...new Set(allItems.map(i => i.type))];
      
      renderSideMenu();
      renderRoleNav();
      renderFilters();
      renderItems();
      updateCartUI();

// Returns complete physical groups only; [] means ambiguous/nonphysical text.
// Axis-internal spaces are not option separators (H400 × W390 × D180 is one group).
function jiwuPhysicalSizeGroups(sizeValue) {
  const text=String(sizeValue??'').normalize('NFKC').trim();if(!text)return [];
  const axes='(?:長|寬|肩|袖|高|深|厚|着丈|身幅|身巾|肩幅|袖丈)',amount='\\d+(?:\\.\\d+)?',unit='(?:cm|mm|公分)?';
  const axisToken=new RegExp('('+axes+')\\s*[:：]?\\s*'+amount+'\\s*'+unit,'gi');
  const xBody='(?:[HWD]?\\s*'+amount+'\\s*'+unit+'\\s*[x×]\\s*){1,2}[HWD]?\\s*'+amount+'\\s*'+unit;
  const singleX=new RegExp('^'+xBody+'$','i'),singleScalar=new RegExp('^'+amount+'\\s*(?:cm|mm|公分)$','i');
  const one=value=>singleX.test(value)||singleScalar.test(value);
  if(text.includes('/')){const parts=text.split('/').map(value=>value.trim());if(parts.every(Boolean)){const groups=parts.flatMap(value=>jiwuPhysicalSizeGroups(value));if(groups.length===parts.length)return groups;}return [];}
  if(one(text))return [text];
  const tokens=[...text.matchAll(axisToken)];
  if(tokens.length&&tokens.map(token=>token[0]).join('').replace(/\s+/g,'')===text.replace(/\s+/g,'')){
    const first=tokens[0][1],groups=[],seen=new Set();let current='';
    for(const token of tokens){const axis=token[1];if(axis===first&&current){groups.push(current);current='';seen.clear();}if(seen.has(axis))return [];seen.add(axis);current+=token[0].replace(/\s+/g,'');}
    if(current)groups.push(current);return groups;
  }
  const groupPattern=new RegExp('^(?:'+xBody+'|'+amount+'\\s*(?:cm|mm|公分))(?=$|\\s)','i');
  const groups=[];let rest=text;
  while(rest){const match=rest.match(groupPattern);if(!match)return [];groups.push(match[0].trim());rest=rest.slice(match[0].length).trim();}
  return groups;
}

// Shared conservative projection; never changes name/role/SKU/ID/price.
// inferFormat=false permits a client explicitly sending format:'' to clear it.
function jiwuSplitProductSpec(sizeValue, formatValue, inferFormat = true) {
  const normalizeFormat=value=>String(value??'').normalize('NFKC').trim().replace(/\bBOX\s+([1-9]\d*(?:入|款)?)(?=$|[\s/])/gi,'BOX$1').replace(/(單抽|单抽|抱盒)\s+([1-9]\d*(?:入|款))(?=$|[\s/])/g,'$1$2').replace(/[\s/]+/g,' ').trim();
  const originalSize=String(sizeValue??'').trim(),explicitFormat=normalizeFormat(formatValue);
  const normalized=originalSize.normalize('NFKC'),parts=normalized.split('/').map(value=>value.trim()),optionParts=normalizeFormat(originalSize).split(' ');
  const clothing=value=>/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|F|FREE|SML)$/i.test(value);
  const option=value=>clothing(value)||/^(?:(?:單抽|单抽|抱盒)(?:\s*[1-9]\d*(?:入|款))?|BOX(?:\s*[1-9]\d*(?:入|款)?)?|針式|针式|夾式|夹式|針|针|夾|夹)$/i.test(value);
  if(optionParts.length&&optionParts.every(value=>value&&option(value))){
    return {format:explicitFormat||(inferFormat?optionParts.join(' '):''),size:''};
  }
  let labels=0;while(labels<parts.length&&clothing(parts[labels]))labels++;
  const measures=jiwuPhysicalSizeGroups(parts.slice(labels).join('/'));
  if(labels>0&&measures.length===labels){
    return {format:explicitFormat||(inferFormat?parts.slice(0,labels).join(' '):''),size:measures.join(' ')};
  }
  const physicalGroups=jiwuPhysicalSizeGroups(originalSize);
  return {format:explicitFormat,size:physicalGroups.length?physicalGroups.join(' '):originalSize};
}

// Display projection only. Existing carts and pending order payloads are never rewritten.
function jiwuSpecEscape(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function jiwuFormatOptions(value){return String(value??'').split(/[\/／、,，;；\s]+/).map(value=>value.trim()).filter(Boolean);}
function parseItemVariant(item){
  const spec=jiwuSplitProductSpec(item?.size,item?.format);
  if(spec.format){
    const sizes=jiwuFormatOptions(spec.format);
    return {size:sizes[0]||'',sizes,color:'',colorCode:'',realSize:spec.size};
  }
  if(typeof parseVariant==='function'){
    const variant=parseVariant(item?.size);
    // An unambiguous physical measurement is not a colour option.
    const raw=String(item?.size??'').trim();
    if(!variant.sizes?.length&&!variant.colorCode&&variant.color===raw&&/^(?:(?:[HWD長寬高深厚肩袖Φφ]|\d)[\s\S]*\d[\s\S]*(?:cm|mm|公分|毫米|[x×])|(?:長|寬|高|深|厚|肩|袖)\s*\d)/i.test(raw))
      return {...variant,color:'',realSize:raw};
    return variant;
  }
  return {size:'',sizes:[],color:'',colorCode:'',realSize:spec.size};
}
function jiwuCatalogSpecHtml(items){
  const rows=Array.isArray(items)?items:[items];
  const formats=[...new Set(rows.flatMap(item=>parseItemVariant(item).sizes||[]))];
  return '<div class="size">'+(formats.length?'<span class="product-format">'+jiwuSpecEscape(formats.join(' '))+'</span>':'')+'</div>';
}

function jiwuCartFormatSuffix(item){
  const values=[item?.selectedSize,item?.selectedColor].map(value=>String(value??'').trim()).filter(Boolean);
  return values.length?' '+values.join('/'):'';
}
function jiwuActualSizeForOption(variant,option){
  if(typeof getVariantRealSize==='function')return getVariantRealSize(variant,option);
  const sizes=variant.sizes||[],measurements=jiwuPhysicalSizeGroups(variant.realSize);
  if(sizes.length>1&&measurements.length===sizes.length){const index=sizes.indexOf(option);return index>=0?measurements[index]:'';}
  return variant.realSize||'';
}
function jiwuSelectCatalogFormat(e,item,add){
  const variant=parseItemVariant(item),options=variant.sizes||[];
  if(String(item.selectedSize||'').trim()||!options.length)return false;
  const chosen=option=>{
    const actualSize=jiwuActualSizeForOption(variant,option);
    add({...item,selectedSize:option,actualSize});
  };
  if(options.length===1){chosen(options[0]);return true;}
  if(e)e.stopPropagation();
  const overlay=document.createElement('div'),panel=document.createElement('div'),title=document.createElement('strong');
  overlay.className='jiwu-format-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','選擇格式');
  overlay.style.cssText='position:fixed;inset:0;z-index:10001;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px';
  panel.style.cssText='background:white;border-radius:12px;padding:20px;max-width:360px;width:100%;display:flex;gap:10px;flex-wrap:wrap';
  title.textContent='選擇格式';title.style.cssText='display:block;width:100%;margin-bottom:6px';panel.appendChild(title);
  options.forEach(option=>{const button=document.createElement('button');button.type='button';button.textContent=option;button.className='variant-option';button.style.cssText='padding:8px 12px;border:1px solid #ddd;border-radius:7px;background:white;color:#444';button.onclick=()=>{overlay.remove();chosen(option);};panel.appendChild(button);});
  const close=document.createElement('button');close.type='button';close.textContent='取消';close.style.cssText='padding:8px 12px';close.onclick=()=>overlay.remove();panel.appendChild(close);
  overlay.onclick=event=>{if(event.target===overlay)overlay.remove();};overlay.appendChild(panel);document.body.appendChild(overlay);return true;
}

function generateLineMessage() {
  let msg="你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n",total=0,hasInquiry=false;
  const groupedCart={},groupOrder=[];

  cart.forEach(item=>{
    const gName=onlineSalesGroupName(getCartSourceName(item));
    if(!groupedCart[gName]){
      groupedCart[gName]=[];
      groupOrder.push(gName);
    }
    groupedCart[gName].push(item);
  });

  let index=1;
  groupOrder.forEach(gName=>{
    msg+=`\n【${gName}】\n`;
    groupedCart[gName].forEach(item=>{
      const p=String(item.price||"").trim();
      let priceText="",priceVal=0;

      if(/^[0-9]+$/.test(p)){
        priceVal=parseInt(p);
        priceText=`$${p}`;
      }else if(p.includes("-")){
        priceText="組合出售";
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }else if(!p){
        priceText="詢問花花";
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }else{
        priceText=p;
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }

      if(!isCartRestockItem(item))total+=priceVal;

      let statusText="";
if(isCartRestockItem(item)) statusText="(補貨登記)";
else if(item.currentStatus==="最後一個") statusText="(現貨)";
else if(item.currentStatus) statusText=`(${item.currentStatus})`;

      const hiddenRoles=["三小隻","其他角色","綜合角色", "全角色"];
      const roleText=item.role&&!hiddenRoles.includes(item.role)?` ${item.role}`:"";

      msg+=`${index}.${statusText}${item.name}${jiwuCartFormatSuffix(item)}${roleText} ${priceText}\n`;
      index++;
    });
  });

  msg+=`\n總金額：$${total}${hasInquiry?" + 詢問報價":""}`;
  return appendDeliveryMessage(msg);
}

// 依商品的庫存/店面/非現/欄位資料，計算這個商品目前的貨況狀態
// 回傳 { tagKey, tagText, tagBg, tagColor, tagClass }，tagKey 是給篩選/顯示設定用的識別字串
function getStockInfo(item) {
  let tagKey = "", tagText = "", tagBg = "#fab460", tagColor = "white", tagClass = "";

  const stockNum = parseFloat(item.colStock) || 0;
  const shopNum = parseFloat(item.colShop) || 0;
  const nonStockNum = parseFloat(item.colNonStock) || 0;
  const nonStockRaw = String(item.colNonStock).toLowerCase();

  if (item.colStock === "-") {
    tagKey = "SOLD OUT";
    tagText = "S☹LD OUT";
    tagBg = "#3a3a3a";
    tagColor = "#ffffff";
    tagClass = "sold-out";
  }
  else if (stockNum === 1) {
    tagKey = "現貨";
    tagText = "最後一個";
    tagBg = "#E24C60";
    tagColor = "#ffffff";
  }
  else if (stockNum > 0 || shopNum > 0) {
    tagKey = "現貨";
    tagText = "現貨";
    tagBg = "#FFF4BD";
    tagColor = "#333";
  }
  else if (nonStockNum > 0 && nonStockRaw.endsWith('v')) {
    tagKey = "受注";
    tagText = "受注";
    tagBg = "#B1DEC1";
  }
  else if (nonStockNum > 0) {
    tagKey = "現貨";
    tagText = "路上";
    tagBg = "#6C95B0";
  }
  else if (stockNum === 0 && (String(item.colShop ?? "").trim() === "" || Number(item.colShop) === 0)) {
    tagKey = "預訂";
    tagText = "預訂";
    tagBg = "#C197D2";
  }
  return { tagKey, tagText, tagBg, tagColor, tagClass };
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  
  const borderCol = CONFIG.ROLE_BORDER_COLORS[item.role] || CONFIG.THEME_COLOR;
  card.style.borderColor = borderCol;

  const { tagKey, tagText, tagBg, tagColor, tagClass } = getStockInfo(item);
  if (tagKey === "SOLD OUT") card.classList.add('is-sold-out'); // 灰階效果不受標籤顯示設定影響，只要是售完狀態就套用

  // 依照 CONFIG.VISIBLE_STOCK_TAGS 決定這個標籤是否要顯示
  const shouldShowTag = tagKey && CONFIG.VISIBLE_STOCK_TAGS.includes(tagKey);
  const displayTagText = shouldShowTag ? tagText : "";

  let finalTagClass = tagClass ? tagClass : (displayTagText.length >= 2 ? "vertical" : "");
  let tagHtml = displayTagText ? `<div class="stock-tag ${finalTagClass}" style="background-color:${tagBg}; color:${tagColor};">${displayTagText}</div>` : "";
  let addBtnHtml = `<div class="add-btn-tag" onclick="addToCart(event, ${JSON.stringify(item).replace(/"/g, '&quot;')}, '${displayTagText}', '${tagBg}', '${tagColor}')">＋</div>`;
  const sizeHtml=jiwuCatalogSpecHtml(item);
  
  card.innerHTML = `${tagHtml}${addBtnHtml}<img src="${item.img}"><div class="name">${formatName(item.name)}</div><div class="price">${getDisplayPrice(item.price)}</div>${sizeHtml}`;
  card.onclick = () => zoomCard(card);
  return card;
}

function formatName(n) {
  if (!n) return n;
  // 如果名稱中有空白鍵，直接在空白處換行
  if (n.indexOf(' ') !== -1) return n.split(' ').join('<br>');
  return n.length > 9 ? n.slice(0, 9) + "<br>" + n.slice(9) : n;
}

function zoomCard(c) {
  const ov = document.createElement('div'); ov.className = 'card-overlay';
  const clone = c.cloneNode(true); ov.appendChild(clone);
  ov.onclick = () => ov.remove(); document.body.appendChild(ov);
}

// 懸浮購物車拖動邏輯
(function initDraggableCart() {
  const el = document.getElementById('cart-trigger');
  let isDragging = false;
  let startX, startY, initialX, initialY;
  const dragStart = (e) => {
    isDragging = false; el.style.transition = 'none';
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
    startX = clientX; startY = clientY;
    const rect = el.getBoundingClientRect();
    initialX = rect.left; initialY = rect.top;
    document.addEventListener('mousemove', dragMove); document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('mouseup', dragEnd); document.addEventListener('touchend', dragEnd);
  };
  const dragMove = (e) => {
    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    const dx = clientX - startX, dy = clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      isDragging = true; if (e.cancelable) e.preventDefault();
      el.style.left = (initialX + dx) + 'px'; el.style.top = (initialY + dy) + 'px';
      el.style.right = 'auto'; el.style.bottom = 'auto';
    }
  };
  const dragEnd = () => {
    document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
    if (isDragging) {
      el.style.transition = 'left 0.3s ease, right 0.3s ease, top 0.3s ease';
      const rect = el.getBoundingClientRect(), screenWidth = window.innerWidth;
      if (rect.left + rect.width / 2 < screenWidth / 2) el.style.left = '10px';
      else el.style.left = (screenWidth - rect.width - 10) + 'px';
      if (rect.top < 50) el.style.top = '50px';
      if (rect.top > window.innerHeight - 60) el.style.top = (window.innerHeight - 60) + 'px';
    }
  };
  el.addEventListener('click', (e) => { if (isDragging) e.preventDefault(); else toggleCart(true); });
  el.addEventListener('mousedown', dragStart);
  el.addEventListener('touchstart', dragStart, { passive: false });
})();

// 頁面初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadData, { once: true });
} else {
  loadData();
}
</script>
