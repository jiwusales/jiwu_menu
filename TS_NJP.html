<script>
document.documentElement.style.setProperty('--theme-color',CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color',CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent=CONFIG.TOP_BAR_TEXT;

let allItems=[],allGroups=[],selectedGroup=null,groupSettings={};

const STOCK_STYLES={
  "現貨":{bg:"#FFF4BD",color:"#333",tagClass:""},
  "SOLD OUT":{bg:"#3a3a3a",color:"#fff",tagClass:"sold-out"},
  "受注":{bg:"#B1DEC1",color:"#fff",tagClass:""},
  "路上":{bg:"#6C95B0",color:"#fff",tagClass:""},
  "預訂":{bg:"#C197D2",color:"#fff",tagClass:""}
};

/* 這個頁面專用購物車，不跟其他頁共用 */
const CART_KEY='jiwu_jingpin_cart';

let cart=[];
try{
  cart=JSON.parse(localStorage.getItem(CART_KEY))||[];
}catch(e){
  cart=[];
}

function saveCart(){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

function getCartSourceName(item){
  return String(
    item.groupName||
    item.ipName||
    item.ip||
    item.group||
    selectedGroup||
    ""
  ).trim()||"商品";
}

function getUrlGroup(){
  return new URLSearchParams(location.search).get('group')||'';
}

function loadData(){

  const url=
    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1`;

  fetch(url)
  .then(r=>r.text())
  .then(t=>{

    try{

      const data=JSON.parse(t.substr(47).slice(0,-2));

      const HEADER_NAMES={
        group:"團名",
        role:"角色",
        name:"名稱",
        originalPrice:"原價",
        price:"售價",
        stock:"庫存",
        status:"狀態",
        sn:"貨號",
        img:"圖片",
        url:"商品網址",
        size:"尺寸",
        note:"備註",
        banner:"首圖",
        color:"主色系"
      };

      const labels=(data.table.cols||[])
        .map(c=>String(c.label||"").trim());

      const COL={};

      Object.keys(HEADER_NAMES).forEach(k=>{
        COL[k]=labels.indexOf(HEADER_NAMES[k]);
      });

      const getV=(r,i)=>{

        if(i===-1||!r.c||!r.c[i]) return "";

        const c=r.c[i];

        const v=
          c.v!==null&&c.v!==undefined
            ?c.v
            :(c.f||"");

        return String(v).trim();
      };

      let lastGroup="";
      let lastBanner="";
      let lastColor="";
      let lastNote="";

      groupSettings={};

      const rawItems=data.table.rows.map(r=>{

        const rawGroup=getV(r,COL.group);

        if(rawGroup!==""){

          lastGroup=rawGroup;

          lastBanner=
            getV(r,COL.banner)||
            lastBanner;

          lastColor=
            getV(r,COL.color)||
            lastColor;

          lastNote=
            getV(r,COL.note)||
            lastNote;

          groupSettings[lastGroup]={
            banner:lastBanner,
            color:lastColor,
            note:lastNote
          };
        }

        return{
          group:lastGroup,
          role:getV(r,COL.role)||" ",
          name:getV(r,COL.name),
          originalPrice:getV(r,COL.originalPrice),
          price:getV(r,COL.price),
          stock:getV(r,COL.stock),
          status:getV(r,COL.status),
          sn:getV(r,COL.sn),
          img:getV(r,COL.img)||"https://i.postimg.cc/bv5xRs04/image.png",
          url:getV(r,COL.url),
          size:getV(r,COL.size)
        };
      });

      allItems=rawItems.filter(item=>{

        if(
          !item.group||
          !String(item.name).trim()
        ) return false;

        const s=
          String(item.stock)
          .trim()
          .toLowerCase();

        return s!=='x'&&s!=='ｘ';
      });

      allGroups=[
        ...new Set(
          allItems.map(i=>i.group)
        )
      ];

      const urlGroup=getUrlGroup();

      selectedGroup=
        allGroups.includes(urlGroup)
          ?urlGroup
          :allGroups[0];

      if(
        !urlGroup&&
        selectedGroup
      ){

        const u=new URL(location.href);

        u.searchParams.set(
          'group',
          selectedGroup
        );

        history.replaceState(
          {},
          '',
          u.pathname+
          '?'+
          u.searchParams.toString()
        );
      }

      renderGroupNav();
      applyGroupSettings(selectedGroup);
      renderItems();
      updateCartUI();

    }catch(e){

      console.error(e);

      document.getElementById(
        'items-wrapper'
      ).innerHTML='載入失敗。';
    }

  })
  .catch(e=>{

    console.error(e);

    document.getElementById(
      'items-wrapper'
    ).innerHTML='載入失敗。';
  });
}

window.addEventListener('popstate',()=>{

  const g=getUrlGroup();

  if(
    allGroups.includes(g)&&
    g!==selectedGroup
  ){

    selectedGroup=g;

    renderGroupNav();
    applyGroupSettings(g);
    renderItems();

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });
  }
});

function renderBanner(url){

  const w=
    document.getElementById(
      'banner-wrapper'
    );

  if(!w) return;

  const t=(url||'').trim();

  w.innerHTML=
    t
      ?`<img src="${t}" alt="banner">`
      :'';
}

function applyGroupSettings(groupName){

  const s=
    groupSettings[groupName]||
    {};

  let color=
    s.color&&s.color.trim()
      ?s.color.trim()
      :CONFIG.THEME_COLOR;

  if(
    color&&
    !color.startsWith('#')
  ){
    color='#'+color;
  }

  document.documentElement.style.setProperty(
    '--theme-color',
    color
  );

  CONFIG.THEME_COLOR=color;

  const top=
    document.getElementById(
      'top-msg'
    );

  if(top){

    top.textContent=
      s.note&&s.note.trim()
        ?s.note.trim()
        :CONFIG.TOP_BAR_TEXT;
  }

  renderBanner(
    s.banner||''
  );
}

/* 加入購物車 */
function addToCart(
  e,
  item,
  tagText,
  tagBg,
  tagColor
){

  e.stopPropagation();

  if(
    /^n$/i.test(
      String(
        item.price||''
      ).trim()
    )
  ) return;

  const source=
    item.group&&
    String(item.group).trim()
      ?String(item.group).trim()
      :selectedGroup;

  cart.push({
    ...item,
    ip:source,
    ipName:source,
    group:source,
    groupName:source,
    currentStatus:tagText||'',
    tagBg,
    tagColor
  });

  saveCart();
  updateCartUI();

  const btn=e.target;

  btn.style.background=
    '#fdd365';

  setTimeout(()=>{
    btn.style.background='#ddd';
  },50);
}

function clearCart(){

  if(
    confirm(
      '確定要清空購物車嗎？'
    )
  ){

    cart=[];
    saveCart();
    updateCartUI();
  }
}

function toggleCart(open){

  const p=
    document.getElementById(
      'cart-panel'
    );

  const bg=
    document.getElementById(
      'cart-overlay-bg'
    );

  if(open){

    p.classList.add('open');
    bg.style.display='block';

  }else{

    p.classList.remove('open');
    bg.style.display='none';
  }
}

function getDisplayPrice(price){

  const p=
    String(price||'')
    .trim();

  if(
    p.includes('-')
  ) return '參考圖示';

  if(
    p===''
  ) return '詢問花花';

  if(
    /^[0-9]+$/.test(p)
  ) return `$${p}`;

  return p;
}

function updateCartUI(){

  const list=
    document.getElementById(
      'cart-list'
    );

  const badge=
    document.getElementById(
      'cart-badge'
    );

  const totalEl=
    document.getElementById(
      'cart-total'
    );

  list.innerHTML='';

  let total=0;
  let hasInquiry=false;

  cart.forEach(
    (item,index)=>{

      const numeric=
        /^[0-9]+$/.test(
          String(
            item.price||''
          ).trim()
        );

      const price=
        numeric
          ?parseInt(item.price)
          :0;

      if(!numeric)
        hasInquiry=true;

      total+=price;

      const div=
        document.createElement(
          'div'
        );

      div.className='cart-item';

      const tag=
        item.currentStatus
          ?`<div class="cart-tag" style="background-color:${item.tagBg};color:${item.tagColor||'white'}">${item.currentStatus}</div>`
          :'';

      div.innerHTML=`
        <img src="${item.img}">
        <div class="cart-item-info">
          ${tag}
          <div style="font-weight:bold;margin-bottom:2px">${item.name}</div>
          <div style="color:#e44d26;font-weight:bold;margin-top:2px">${getDisplayPrice(item.price)}</div>
        </div>
        <span style="cursor:pointer;color:#ccc;padding:5px" onclick="removeFromCart(${index})">✕</span>
      `;

      list.appendChild(div);
    }
  );

  badge.textContent=
    cart.length;

  badge.style.display=
    cart.length
      ?'flex'
      :'none';

  totalEl.textContent=
    `$${total}${hasInquiry?' + 詢問報價':''}`;
}

function removeFromCart(index){

  cart.splice(index,1);

  saveCart();
  updateCartUI();

  if(
    document.getElementById(
      'checkout-modal'
    ).style.display==='flex'
  ){
    renderCheckoutSummary();
  }
}

/* 手機版 LINE 訊息：
   SOLD OUT → 補貨登記
   其他全部 → 預訂 */
function generateLineMessage(){

  let msg=
    '你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n';

  let total=0;
  let hasInquiry=false;
  let index=1;

  const grouped={};
  const order=[];

  cart.forEach(item=>{

    const g=
      getCartSourceName(item);

    if(!grouped[g]){
      grouped[g]=[];
      order.push(g);
    }

    grouped[g].push(item);
  });

  order.forEach(g=>{

    msg+=`\n【${g}】\n`;

    grouped[g].forEach(item=>{

      const raw=
        String(
          item.price||''
        ).trim();

      let priceText='';
      let priceVal=0;

      if(
        /^[0-9]+$/.test(raw)
      ){

        priceVal=
          parseInt(raw);

        priceText=
          `$${raw}`;

      }else if(
        raw.includes('-')
      ){

        priceText=
          '參考圖示';

        hasInquiry=true;

      }else if(
        raw===''
      ){

        priceText=
          '詢問花花';

        hasInquiry=true;

      }else{

        priceText=raw;
        hasInquiry=true;
      }

      total+=priceVal;

      const statusText=
        item.currentStatus==='S☹LD OUT'
          ?'(補貨登記)'
          :'(預訂)';

      const hidden=[
        "三小隻",
        "其他角色",
        "綜合角色",
        "水族",
        "動物",
        "食物"
      ];

      const roleText=
        item.role&&
        !hidden.includes(item.role)
          ?` ${item.role}`
          :'';

      msg+=
        `${index}. ${statusText} ${item.name}${roleText} ${priceText}\n`;

      index++;
    });
  });

  return(
    msg+
    `\n總金額：$${total}${hasInquiry?' + 詢問報價':''}`
  );
}

function handleCheckoutEntry(){

  if(!cart.length){

    alert(
      '購物車是空的唷！'
    );

    return;
  }

  const mobile=
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
    .test(
      navigator.userAgent
    );

  if(mobile){

    window.location.href=
      CONFIG.LINE_MSG_URL+
      encodeURIComponent(
        generateLineMessage()
      );

    setTimeout(()=>{

      cart=[];
      saveCart();
      updateCartUI();
      toggleCart(false);

    },1500);

  }else{

    openCheckoutModal();
  }
}

function openCheckoutModal(){

  toggleCart(false);

  document.getElementById(
    'step-1'
  ).style.display='block';

  document.getElementById(
    'step-2'
  ).style.display='none';

  renderCheckoutSummary();

  document.getElementById(
    'checkout-modal'
  ).style.display='flex';
}

function renderCheckoutSummary(){

  const list=
    document.getElementById(
      'modal-summary-list'
    );

  const totalEl=
    document.getElementById(
      'modal-total-price'
    );

  list.innerHTML='';

  let total=0;
  let hasInquiry=false;

  cart.forEach(item=>{

    const numeric=
      /^[0-9]+$/.test(
        String(
          item.price||''
        ).trim()
      );

    const price=
      numeric
        ?parseInt(item.price)
        :0;

    if(!numeric)
      hasInquiry=true;

    total+=price;

    const div=
      document.createElement(
        'div'
      );

    div.className=
      'cart-item';

    const tag=
      item.currentStatus
        ?`<div class="cart-tag" style="background-color:${item.tagBg};color:${item.tagColor||'white'}">${item.currentStatus}</div>`
        :'';

    div.innerHTML=`
      <img src="${item.img}">
      <div class="cart-item-info">
        ${tag}
        <div style="font-weight:bold;margin-bottom:2px">${item.name}</div>
        <div style="color:#e44d26;font-weight:bold;margin-top:2px">${getDisplayPrice(item.price)}</div>
      </div>
    `;

    list.appendChild(div);
  });

  totalEl.textContent=
    `$${total}${hasInquiry?' + 詢問報價':''}`;
}

function closeModal(){

  document.getElementById(
    'checkout-modal'
  ).style.display='none';
}

async function handleFinalCheckout(){

  const lineName=
    document.getElementById(
      'user-line'
    ).value.trim();

  const igAcc=
    document.getElementById(
      'user-ig'
    ).value.trim();

  if(!lineName){

    alert(
      '請輸入LINE名稱方便核對ι(｀･-･´)/'
    );

    return;
  }

  const btn=
    document.getElementById(
      'send-btn'
    );

  btn.disabled=true;

  btn.textContent=
    '傳送中 ᓫ(๑º꒳º๑)ꜝꜝ';

  try{

    const cartData=
      cart.map(item=>{

        const source=
          getCartSourceName(item);

        return{
          ...item,
          ip:source,
          ipName:source,
          group:source,
          groupName:source
        };
      });

    await fetch(
      CONFIG.DEPLOY_URL,
      {
        method:'POST',
        mode:'no-cors',
        body:JSON.stringify({
          source:'電腦',
          lineName,
          igAccount:igAcc,
          cartItems:cartData
        })
      }
    );

  }catch(e){

    console.error(
      'GAS 傳送失敗',
      e
    );
  }

  cart=[];

  saveCart();
  updateCartUI();

  document.getElementById(
    'step-1'
  ).style.display='none';

  document.getElementById(
    'step-2'
  ).style.display='block';
}

function renderGroupNav(){

  const nav=
    document.getElementById(
      'dynamic-nav'
    );

  nav.innerHTML=
    allGroups.map(g=>{

      const selected=
        selectedGroup===g;

      const safe=
        g.replace(
          /'/g,
          "\\'"
        );

      return(
        `<a class="${selected?'active-role':''}" onclick="selectGroup('${safe}')">${g}</a>`
      );
    }).join('');
}

function selectGroup(name){

  if(
    !allGroups.includes(name)||
    name===selectedGroup
  ) return;

  selectedGroup=name;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  renderGroupNav();
  applyGroupSettings(name);
  renderItems();

  const u=
    new URL(
      location.href
    );

  u.searchParams.set(
    'group',
    name
  );

  history.pushState(
    {},
    '',
    u.pathname+
    '?'+
    u.searchParams.toString()
  );
}

/* 庫存標籤 */
function getStockInfo(item){

  const raw=
    String(
      item.stock||''
    ).trim();

  const num=
    Number(raw);

  /* 1 → 最後一個 */
  if(
    raw!==''&&
    Number.isFinite(num)&&
    num===1
  ){

    return{
      tagKey:'現貨',
      tagText:'最後一個',
      tagBg:'#E24C60',
      tagColor:'#fff',
      tagClass:''
    };
  }

  /* 2～5 → 剩餘X個 */
  if(
    raw!==''&&
    Number.isFinite(num)&&
    num>=2&&
    num<=5
  ){

    return{
      tagKey:'現貨',
      tagText:`剩餘${num}個`,
      tagBg:STOCK_STYLES['現貨'].bg,
      tagColor:STOCK_STYLES['現貨'].color,
      tagClass:''
    };
  }

  /* 超過5 → 還有餘量 */
  if(
    raw!==''&&
    Number.isFinite(num)&&
    num>5
  ){

    return{
      tagKey:'現貨',
      tagText:'還有餘量',
      tagBg:STOCK_STYLES['現貨'].bg,
      tagColor:STOCK_STYLES['現貨'].color,
      tagClass:''
    };
  }

  const key=
    String(
      item.status||''
    ).trim();

  const style=
    STOCK_STYLES[key];

  if(!style){

    return{
      tagKey:'',
      tagText:'',
      tagBg:'#fab460',
      tagColor:'white',
      tagClass:''
    };
  }

  return{
    tagKey:key,
    tagText:key,
    tagBg:style.bg,
    tagColor:style.color,
    tagClass:style.tagClass
  };
}

function renderItems(){

  const c=
    document.getElementById(
      'items-wrapper'
    );

  c.innerHTML='';

  const items=
    allItems.filter(
      i=>
        i.group===
        selectedGroup
    );

  if(!items.length){

    c.innerHTML=
      "<div style='padding:40px;color:#999'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";

    return;
  }

  const grid=
    document.createElement(
      'div'
    );

  grid.className=
    'group-grid';

  items.forEach(item=>{
    grid.appendChild(
      createCard(item)
    );
  });

  c.appendChild(grid);
}

function createCard(item){

  const card=
    document.createElement(
      'div'
    );

  card.className=
    'card';

  const stockVal=
    String(
      item.stock||''
    ).trim();

  const soldout=
    stockVal==='-';

  const noSale=
    String(
      item.price||''
    ).trim()==='0';

  let tagKey;
  let tagText;
  let tagBg;
  let tagColor;
  let tagClass;

  if(soldout){

    const s=
      STOCK_STYLES[
        'SOLD OUT'
      ];

    tagKey='SOLD OUT';
    tagText='S☹LD OUT';
    tagBg=s.bg;
    tagColor=s.color;
    tagClass=s.tagClass;

  }else{

    ({
      tagKey,
      tagText,
      tagBg,
      tagColor,
      tagClass
    }=getStockInfo(item));
  }

  if(
    tagKey==='SOLD OUT'
  ){
    card.classList.add(
      'is-sold-out'
    );
  }

  const show=
    tagKey&&
    CONFIG.VISIBLE_STOCK_TAGS.includes(
      tagKey
    );

  const displayTagText=
    show
      ?tagText
      :'';

  const finalTagClass=
    tagClass||
    (
      displayTagText.length>=2
        ?'vertical'
        :''
    );

  const tagHtml=
    displayTagText
      ?`<div class="stock-tag ${finalTagClass}" style="background-color:${tagBg};color:${tagColor}">${displayTagText}</div>`
      :'';

  const priceHtml=
    noSale
      ?''
      :`<div class="price">${getDisplayPrice(item.price)}</div>`;

  const sizeHtml=
    `<div class="size">${item.size||''}</div>`;

  const hidden=[
    "三小隻",
    "其他角色",
    "綜合角色",
    "水族",
    "動物",
    "食物"
  ];

  const role=
    String(
      item.role||''
    ).trim();

  const displayName=
    item.name+
    (
      role&&
      !hidden.includes(role)
        ?` ${role}`
        :''
    );

  card.innerHTML=
    `${tagHtml}`+
    `${noSale?'':'<div class="add-btn-tag">＋</div>'}`+
    `<img src="${item.img}">`+
    `<div class="name">${formatName(displayName)}</div>`+
    `${priceHtml}`+
    `${sizeHtml}`;

  if(!noSale){

    card.querySelector(
      '.add-btn-tag'
    ).onclick=e=>
      addToCart(
        e,
        item,
        displayTagText,
        tagBg,
        tagColor
      );
  }

  card.onclick=
    ()=>zoomCard(card);

  return card;
}

function formatName(n){

  if(!n) return n;

  if(
    n.includes(' ')
  ){
    return(
      n.split(' ')
      .join('<br>')
    );
  }

  return(
    n.length>9
      ?n.slice(0,9)+
       '<br>'+
       n.slice(9)
      :n
  );
}

function zoomCard(c){

  const ov=
    document.createElement(
      'div'
    );

  ov.className=
    'card-overlay';

  ov.appendChild(
    c.cloneNode(true)
  );

  ov.onclick=
    ()=>ov.remove();

  document.body.appendChild(
    ov
  );
}

/* 懸浮購物車拖動 */
(function initDraggableCart(){

  const el=
    document.getElementById(
      'cart-trigger'
    );

  let dragging=false;
  let startX;
  let startY;
  let initialX;
  let initialY;

  const dragStart=e=>{

    dragging=false;

    el.style.transition=
      'none';

    const x=
      e.type==='touchstart'
        ?e.touches[0].clientX
        :e.clientX;

    const y=
      e.type==='touchstart'
        ?e.touches[0].clientY
        :e.clientY;

    startX=x;
    startY=y;

    const r=
      el.getBoundingClientRect();

    initialX=r.left;
    initialY=r.top;

    document.addEventListener(
      'mousemove',
      dragMove
    );

    document.addEventListener(
      'touchmove',
      dragMove,
      {passive:false}
    );

    document.addEventListener(
      'mouseup',
      dragEnd
    );

    document.addEventListener(
      'touchend',
      dragEnd
    );
  };

  const dragMove=e=>{

    const x=
      e.type==='touchmove'
        ?e.touches[0].clientX
        :e.clientX;

    const y=
      e.type==='touchmove'
        ?e.touches[0].clientY
        :e.clientY;

    const dx=x-startX;
    const dy=y-startY;

    if(
      Math.abs(dx)>5||
      Math.abs(dy)>5
    ){

      dragging=true;

      if(e.cancelable)
        e.preventDefault();

      el.style.left=
        initialX+dx+'px';

      el.style.top=
        initialY+dy+'px';

      el.style.right=
        'auto';

      el.style.bottom=
        'auto';
    }
  };

  const dragEnd=()=>{

    document.removeEventListener(
      'mousemove',
      dragMove
    );

    document.removeEventListener(
      'touchmove',
      dragMove
    );

    document.removeEventListener(
      'mouseup',
      dragEnd
    );

    document.removeEventListener(
      'touchend',
      dragEnd
    );

    if(dragging){

      el.style.transition=
        'left .3s ease,right .3s ease,top .3s ease';

      const r=
        el.getBoundingClientRect();

      const w=
        window.innerWidth;

      el.style.left=
        r.left+
        r.width/2<
        w/2
          ?'10px'
          :w-
           r.width-
           10+
           'px';

      if(r.top<50)
        el.style.top='50px';

      if(
        r.top>
        window.innerHeight-60
      ){
        el.style.top=
          window.innerHeight-
          60+
          'px';
      }
    }
  };

  el.addEventListener(
    'click',
    e=>{

      if(dragging){
        e.preventDefault();
      }else{
        toggleCart(true);
      }
    }
  );

  el.addEventListener(
    'mousedown',
    dragStart
  );

  el.addEventListener(
    'touchstart',
    dragStart,
    {passive:false}
  );

})();
