<style>
:root{--theme-color:#fff;--active-color:#f5b080;--nav-bg:#f9f9f9;--text-color:#333}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f9f9f9;margin:0;color:var(--text-color);text-align:center;overflow-x:hidden}
.top-bar{background:var(--theme-color);color:#fff;padding:10px 0;position:fixed;top:0;left:0;width:100%;z-index:999;font-size:15px;display:flex;justify-content:center;align-items:center}
.header-fixed{position:fixed;top:40px;width:100%;background:var(--nav-bg);z-index:998;border-bottom:1px solid #eee}
.nav-bar-wrapper{display:flex;align-items:center;padding:0 5px;height:38px}
.scroll-container{flex:1;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}.scroll-container::-webkit-scrollbar{display:none}
.nav-bar{display:inline-block;padding:8px 0;font-size:10pt}.nav-bar a{color:var(--text-color);text-decoration:none;padding:6px 0;display:inline-block;cursor:pointer}.nav-bar a.active-role{font-weight:bold;color:var(--active-color)}.nav-bar a::after{content:"｜";color:#aaa;margin:0 2px;font-weight:normal}.nav-bar a:last-child::after{content:""}
.nav-arrow{width:24px;font-size:16px;cursor:pointer;flex-shrink:0;color:#bbb;display:flex;justify-content:center;align-items:center}
#card-container{padding:78px 10px 10px;display:flex;flex-direction:column;gap:8px}
#banner-wrapper{width:720px;max-width:100%;margin:auto}#banner-wrapper img{width:100%;height:auto;display:block;margin:0 auto 4px}
.group-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(min-width:480px){.group-grid{grid-template-columns:repeat(auto-fill,120px)}}
.card{border:2px solid var(--theme-color);border-radius:8px;background:#fff;text-align:center;cursor:pointer;overflow:hidden;position:relative}.card.is-sold-out{filter:grayscale(100%);border-color:#999!important}
.stock-tag,.stock-tag.vertical,.stock-tag.sold-out{position:absolute;top:0;left:0;width:55px;height:16px;padding:0 4px;border-radius:0 0 8px 0;font-size:10px;font-weight:bold;white-space:nowrap;display:flex;align-items:center;justify-content:center;z-index:10}
.add-btn-tag{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#ddd;color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
.card img{height:90px;width:auto;max-width:90%;display:block;margin:5px auto 0;object-fit:contain;pointer-events:none}.card .name{margin:1px auto;font-size:9px;font-weight:bold;line-height:1.2;padding:0 2px}.card .price{font-size:10px;margin:1px auto;color:#F5B080}.card .size{font-size:8px;margin:0 auto 5px;color:#888}
.card-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;display:flex;justify-content:center;align-items:center;cursor:pointer}.card-overlay .card{transform:scale(3.1);background:#fff;width:100px;padding:15px 0 5px;pointer-events:none;border-width:1.5px}.card-overlay .stock-tag{width:55px!important;height:16px!important;top:0!important;left:0!important;font-size:10px}.card-overlay .add-btn-tag{transform:scale(.8)}
#cart-trigger{position:fixed;top:88px;right:15px;width:45px;height:45px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:999;opacity:.8;cursor:move;touch-action:none;user-select:none}#cart-trigger img{width:28px;height:28px;pointer-events:none}
#cart-badge{position:absolute;top:-2px;right:-2px;background:#ff4d4f;color:#fff;font-size:10px;border-radius:50%;width:18px;height:18px;display:none;align-items:center;justify-content:center;font-weight:bold}
#cart-panel{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#fff;box-shadow:-5px 0 15px rgba(0,0,0,.1);z-index:1001;transition:.3s;display:flex;flex-direction:column}#cart-panel.open{right:0}
#cart-overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none}
.cart-header{padding:12px 15px;background:var(--theme-color);color:#fff;font-weight:bold;font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center}.cart-list{flex:1;overflow-y:auto;padding:10px;text-align:left}
.cart-item{display:flex;align-items:center;gap:10px;margin-bottom:12px;border-bottom:1px solid #f0f0f0;padding-bottom:8px;font-size:12px}.cart-item img{width:45px;height:45px;object-fit:contain;border-radius:4px}.cart-item-info{flex:1}.cart-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;margin-bottom:3px;font-weight:bold}
.cart-footer{padding:15px 15px 25px;border-top:1px solid #eee;background:#fafafa}.text-clear{display:block;text-align:left;color:#aaa;font-size:13px;text-decoration:underline;cursor:pointer;margin-bottom:12px}
.btn-checkout{background:var(--theme-color);color:#fff;border:0;padding:12px;width:100%;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}
#checkout-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;display:none;align-items:center;justify-content:center}.modal-content{background:#fff;width:85%;max-width:380px;border-radius:15px;padding:20px;position:relative}.input-box{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:5px;font-size:14px}.summary-box{background:#f9f9f9;padding:10px;border-radius:5px;font-size:12px;max-height:250px;overflow-y:auto;text-align:left;margin-bottom:10px;border:1px solid #eee}.qr-box{display:none;text-align:center}.qr-box img{width:180px;height:180px;margin:10px 0}
</style>

<body>

<div class="top-bar"><span id="top-msg">載入中...</span></div>

<div class="header-fixed"><div class="nav-bar-wrapper">
<div class="nav-arrow" onclick="document.getElementById('group-scroll').scrollBy(-150,0)">❮</div>
<div class="scroll-container" id="group-scroll"><div class="nav-bar" id="dynamic-nav"></div></div>
<div class="nav-arrow" onclick="document.getElementById('group-scroll').scrollBy(150,0)">❯</div>
</div></div>

<div id="card-container"><div id="banner-wrapper"></div><div id="items-wrapper"></div></div>

<div id="cart-trigger"><img src="https://images.icon-icons.com/2098/PNG/512/shopping_cart_icon_128753.png"><div id="cart-badge">0</div></div>

<div class="summary-box" id="modal-summary-list"></div>
<div style="padding:5px 0;border-top:1px solid #eee;margin-bottom:5px;text-align:right;font-weight:bold;font-size:14px">總計：<span id="modal-total-price" style="color:#e44d26">$0</span></div>
<input id="user-line" class="input-box" placeholder="LINE名稱 (必填)">
<input id="user-ig" class="input-box" placeholder="其他聯繫方式（IG或Threads帳號）">

</div>

<p style="font-weight:bold;font-size:14px">再麻煩到官方Line(@jiwusales)確認訂單！</p>
<button class="btn-checkout" onclick="closeModal()">關閉視窗</button>
</div>
</div>

<script>
document.documentElement.style.setProperty("--theme-color",CONFIG.THEME_COLOR);
document.documentElement.style.setProperty("--active-color",CONFIG.ACTIVE_COLOR);
document.getElementById("top-msg").textContent=CONFIG.TOP_BAR_TEXT;

let allItems=[],allGroups=[],selectedGroup=null,groupSettings={};
const STOCK_STYLES={"現貨":{bg:"#FFF4BD",color:"#333",tagClass:""},"SOLD OUT":{bg:"#3a3a3a",color:"#fff",tagClass:"sold-out"},"受注":{bg:"#B1DEC1",color:"#fff",tagClass:""},"路上":{bg:"#6C95B0",color:"#fff",tagClass:""},"預訂":{bg:"#C197D2",color:"#fff",tagClass:""}};
const CART_KEY="jiwu_jingpin_cart";
let cart=[];try{cart=JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){}
function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart))}
function getCartSourceName(i){return String(i.groupName||i.ipName||i.ip||i.group||selectedGroup||"").trim()||"商品"}
function getUrlGroup(){return new URLSearchParams(location.search).get("group")||""}

function loadData(){
const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&headers=1`;
fetch(url).then(r=>r.text()).then(t=>{try{
const data=JSON.parse(t.substr(47).slice(0,-2)),H={group:"團名",role:"角色",name:"名稱",originalPrice:"原價",price:"售價",stock:"庫存",status:"狀態",sn:"貨號",img:"圖片",url:"商品網址",size:"尺寸",note:"備註",banner:"首圖",color:"主色系"},labels=(data.table.cols||[]).map(c=>String(c.label||"").trim()),C={};
Object.keys(H).forEach(k=>C[k]=labels.indexOf(H[k]));
const v=(r,i)=>i===-1||!r.c||!r.c[i]?"":String(r.c[i].v??r.c[i].f??"").trim();
let g="",banner="",color="",note="";groupSettings={};
const raw=data.table.rows.map(r=>{const rg=v(r,C.group);if(rg){g=rg;banner=v(r,C.banner)||banner;color=v(r,C.color)||color;note=v(r,C.note)||note;groupSettings[g]={banner,color,note}}return{group:g,role:v(r,C.role)||" ",name:v(r,C.name),originalPrice:v(r,C.originalPrice),price:v(r,C.price),stock:v(r,C.stock),status:v(r,C.status),sn:v(r,C.sn),img:v(r,C.img)||"https://i.postimg.cc/bv5xRs04/image.png",url:v(r,C.url),size:v(r,C.size)}});
allItems=raw.filter(i=>i.group&&String(i.name).trim()&&!["x","ｘ"].includes(String(i.stock).trim().toLowerCase()));
allGroups=[...new Set(allItems.map(i=>i.group))];
const ug=getUrlGroup();selectedGroup=allGroups.includes(ug)?ug:allGroups[0];
if(!ug&&selectedGroup){const u=new URL(location.href);u.searchParams.set("group",selectedGroup);history.replaceState({},"",u.pathname+"?"+u.searchParams)}
renderGroupNav();applyGroupSettings(selectedGroup);renderItems();updateCartUI();
}catch(e){console.error(e);document.getElementById("items-wrapper").innerHTML="載入失敗。"}}).catch(()=>document.getElementById("items-wrapper").innerHTML="載入失敗。");
}

window.addEventListener("popstate",()=>{const g=getUrlGroup();if(allGroups.includes(g)&&g!==selectedGroup){selectedGroup=g;renderGroupNav();applyGroupSettings(g);renderItems();scrollTo({top:0,behavior:"smooth"})}});

function renderBanner(url){document.getElementById("banner-wrapper").innerHTML=(url||"").trim()?`<img src="${url.trim()}">`:""}
function applyGroupSettings(g){const s=groupSettings[g]||{};let c=(s.color||CONFIG.THEME_COLOR).trim();if(c&&!c.startsWith("#"))c="#"+c;document.documentElement.style.setProperty("--theme-color",c);CONFIG.THEME_COLOR=c;document.getElementById("top-msg").textContent=(s.note||CONFIG.TOP_BAR_TEXT).trim();renderBanner(s.banner||"")}

function addToCart(e,item,tagText,tagBg,tagColor){e.stopPropagation();if(/^n$/i.test(String(item.price||"").trim()))return;const source=String(item.group||selectedGroup).trim();cart.push({...item,ip:source,ipName:source,group:source,groupName:source,currentStatus:tagText||"",tagBg,tagColor});saveCart();updateCartUI();e.target.style.background="#fdd365";setTimeout(()=>e.target.style.background="#ddd",50)}
function clearCart(){if(confirm("確定要清空購物車嗎？")){cart=[];saveCart();updateCartUI()}}
function toggleCart(x){document.getElementById("cart-panel").classList.toggle("open",x);document.getElementById("cart-overlay-bg").style.display=x?"block":"none"}
function getDisplayPrice(p){p=String(p||"").trim();return p.includes("-")?"參考圖示":p===""?"詢問花花":/^\d+$/.test(p)?`$${p}`:p}

function updateCartUI(){
const list=document.getElementById("cart-list"),badge=document.getElementById("cart-badge"),totalEl=document.getElementById("cart-total");list.innerHTML="";let total=0,inq=false;
cart.forEach((i,n)=>{const num=/^\d+$/.test(String(i.price||"").trim());total+=num?parseInt(i.price):0;if(!num)inq=true;const d=document.createElement("div");d.className="cart-item";const tag=i.currentStatus?`<div class="cart-tag" style="background:${i.tagBg};color:${i.tagColor||"white"}">${i.currentStatus}</div>`:"";d.innerHTML=`<img src="${i.img}"><div class="cart-item-info">${tag}<div style="font-weight:bold">${i.name}</div><div style="color:#e44d26;font-weight:bold">${getDisplayPrice(i.price)}</div></div><span style="cursor:pointer;color:#ccc;padding:5px" onclick="removeFromCart(${n})">✕</span>`;list.appendChild(d)});
badge.textContent=cart.length;badge.style.display=cart.length?"flex":"none";totalEl.textContent=`$${total}${inq?" + 詢問報價":""}`;
}
function removeFromCart(n){cart.splice(n,1);saveCart();updateCartUI();if(document.getElementById("checkout-modal").style.display==="flex")renderCheckoutSummary()}

function generateLineMessage(){
let msg="你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n",total=0,inq=false,n=1,groups={},order=[];
cart.forEach(i=>{const g=getCartSourceName(i);if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(i)});
order.forEach(g=>{msg+=`\n【${g}】\n`;groups[g].forEach(i=>{const p=String(i.price||"").trim();let pt="",pv=0;if(/^\d+$/.test(p)){pv=parseInt(p);pt=`$${p}`}else if(p.includes("-")){pt="參考圖示";inq=true}else if(!p){pt="詢問花花";inq=true}else{pt=p;inq=true}total+=pv;const st=i.currentStatus==="S☹LD OUT"?"(補貨登記)":"(預訂)",hidden=["三小隻","其他角色","綜合角色","水族","動物","食物"],role=i.role&&!hidden.includes(i.role)?` ${i.role}`:"";msg+=`${n++}. ${st} ${i.name}${role} ${pt}\n`})});
return msg+`\n總金額：$${total}${inq?" + 詢問報價":""}`;
}

function handleCheckoutEntry(){if(!cart.length)return alert("購物車是空的唷！");if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){location.href=CONFIG.LINE_MSG_URL+encodeURIComponent(generateLineMessage());setTimeout(()=>{cart=[];saveCart();updateCartUI();toggleCart(false)},1500)}else openCheckoutModal()}
function openCheckoutModal(){toggleCart(false);document.getElementById("step-1").style.display="block";document.getElementById("step-2").style.display="none";renderCheckoutSummary();document.getElementById("checkout-modal").style.display="flex"}
function closeModal(){document.getElementById("checkout-modal").style.display="none"}

function renderCheckoutSummary(){
const list=document.getElementById("modal-summary-list");list.innerHTML="";let total=0,inq=false;
cart.forEach(i=>{const num=/^\d+$/.test(String(i.price||"").trim());total+=num?parseInt(i.price):0;if(!num)inq=true;const d=document.createElement("div");d.className="cart-item";const tag=i.currentStatus?`<div class="cart-tag" style="background:${i.tagBg};color:${i.tagColor||"white"}">${i.currentStatus}</div>`:"";d.innerHTML=`<img src="${i.img}"><div class="cart-item-info">${tag}<div style="font-weight:bold">${i.name}</div><div style="color:#e44d26;font-weight:bold">${getDisplayPrice(i.price)}</div></div>`;list.appendChild(d)});
document.getElementById("modal-total-price").textContent=`$${total}${inq?" + 詢問報價":""}`;
}

async function handleFinalCheckout(){
const lineName=document.getElementById("user-line").value.trim(),igAcc=document.getElementById("user-ig").value.trim();if(!lineName)return alert("請輸入LINE名稱方便核對ι(｀･-･´)/");
const btn=document.getElementById("send-btn");btn.disabled=true;btn.textContent="傳送中 ᓫ(๑º꒳º๑)ꜝꜝ";
try{const cartData=cart.map(i=>{const s=getCartSourceName(i);return{...i,ip:s,ipName:s,group:s,groupName:s}});await fetch(CONFIG.DEPLOY_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({source:"電腦",lineName,igAccount:igAcc,cartItems:cartData})})}catch(e){console.error(e)}
cart=[];saveCart();updateCartUI();document.getElementById("step-1").style.display="none";document.getElementById("step-2").style.display="block";
}

function renderGroupNav(){document.getElementById("dynamic-nav").innerHTML=allGroups.map(g=>`<a class="${selectedGroup===g?"active-role":""}" onclick='selectGroup(${JSON.stringify(g)})'>${g}</a>`).join("")}
function selectGroup(g){if(!allGroups.includes(g)||g===selectedGroup)return;selectedGroup=g;scrollTo({top:0,behavior:"smooth"});renderGroupNav();applyGroupSettings(g);renderItems();const u=new URL(location.href);u.searchParams.set("group",g);history.pushState({},"",u.pathname+"?"+u.searchParams)}

function getStockInfo(i){
const raw=String(i.stock||"").trim(),n=Number(raw);
if(raw&&Number.isFinite(n)&&n===1)return{tagKey:"現貨",tagText:"最後一個",tagBg:"#E24C60",tagColor:"#fff",tagClass:""};
if(raw&&Number.isFinite(n)&&n>=2&&n<=5)return{tagKey:"現貨",tagText:`剩餘${n}個`,tagBg:STOCK_STYLES["現貨"].bg,tagColor:STOCK_STYLES["現貨"].color,tagClass:""};
if(raw&&Number.isFinite(n)&&n>5)return{tagKey:"現貨",tagText:"還有餘量",tagBg:STOCK_STYLES["現貨"].bg,tagColor:STOCK_STYLES["現貨"].color,tagClass:""};
const k=String(i.status||"").trim(),s=STOCK_STYLES[k];return s?{tagKey:k,tagText:k,tagBg:s.bg,tagColor:s.color,tagClass:s.tagClass}:{tagKey:"",tagText:"",tagBg:"#fab460",tagColor:"white",tagClass:""};
}

function renderItems(){
const c=document.getElementById("items-wrapper"),items=allItems.filter(i=>i.group===selectedGroup);c.innerHTML="";if(!items.length)return c.innerHTML="<div style='padding:40px;color:#999'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";
const grid=document.createElement("div");grid.className="group-grid";items.forEach(i=>grid.appendChild(createCard(i)));c.appendChild(grid);
}

function createCard(i){
const card=document.createElement("div");card.className="card";const stock=String(i.stock||"").trim(),sold=stock==="-",noSale=String(i.price||"").trim()==="0";let x;
if(sold){const s=STOCK_STYLES["SOLD OUT"];x={tagKey:"SOLD OUT",tagText:"S☹LD OUT",tagBg:s.bg,tagColor:s.color,tagClass:s.tagClass}}else x=getStockInfo(i);
if(x.tagKey==="SOLD OUT")card.classList.add("is-sold-out");
const show=x.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(x.tagKey),text=show?x.tagText:"",tag=text?`<div class="stock-tag ${x.tagClass||""}" style="background:${x.tagBg};color:${x.tagColor}">${text}</div>`:"",hidden=["三小隻","其他角色","綜合角色","水族","動物","食物"],role=String(i.role||"").trim(),name=i.name+(role&&!hidden.includes(role)?` ${role}`:"");
card.innerHTML=`${tag}${noSale?"":'<div class="add-btn-tag">＋</div>'}<img src="${i.img}"><div class="name">${formatName(name)}</div>${noSale?"":`<div class="price">${getDisplayPrice(i.price)}</div>`}<div class="size">${i.size||""}</div>`;
if(!noSale)card.querySelector(".add-btn-tag").onclick=e=>addToCart(e,i,text,x.tagBg,x.tagColor);card.onclick=()=>zoomCard(card);return card;
}

function formatName(n){if(!n)return n;return n.includes(" ")?n.split(" ").join("<br>"):n.length>9?n.slice(0,9)+"<br>"+n.slice(9):n}
function zoomCard(c){const o=document.createElement("div");o.className="card-overlay";o.appendChild(c.cloneNode(true));o.onclick=()=>o.remove();document.body.appendChild(o)}

(function(){
const el=document.getElementById("cart-trigger");let drag=false,sx,sy,ix,iy;
function start(e){drag=false;const p=e.touches?e.touches[0]:e,r=el.getBoundingClientRect();sx=p.clientX;sy=p.clientY;ix=r.left;iy=r.top;document.addEventListener("mousemove",move);document.addEventListener("touchmove",move,{passive:false});document.addEventListener("mouseup",end);document.addEventListener("touchend",end)}
function move(e){const p=e.touches?e.touches[0]:e,dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5){drag=true;if(e.cancelable)e.preventDefault();el.style.left=ix+dx+"px";el.style.top=iy+dy+"px";el.style.right="auto"}}
function end(){document.removeEventListener("mousemove",move);document.removeEventListener("touchmove",move);document.removeEventListener("mouseup",end);document.removeEventListener("touchend",end);if(drag){const r=el.getBoundingClientRect();el.style.left=r.left+r.width/2<innerWidth/2?"10px":innerWidth-r.width-10+"px";if(r.top<50)el.style.top="50px";if(r.top>innerHeight-60)el.style.top=innerHeight-60+"px"}}
el.onclick=e=>drag?e.preventDefault():toggleCart(true);el.addEventListener("mousedown",start);el.addEventListener("touchstart",start,{passive:false});
})();

window.onload=loadData;
</script>
