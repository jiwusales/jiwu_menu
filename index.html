  <style>
    body{margin:0;padding:0;font-family:Arial,sans-serif;color:#333;background:#fff}
    a{text-decoration:none!important;-webkit-tap-highlight-color:transparent}
    .control-btn{position:fixed;top:20px;left:10px;width:45px;height:45px;border:none;border-radius:50%;background-color:#E7D4C0;opacity:.5;box-shadow:0 0 6px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:999}
    .control-btn img{width:65%;height:auto;object-fit:contain}
    .logo-container{text-align:center;margin:20px 0}
    .logo-container img{width:160px;height:auto}
    .section-title{text-align:center;margin:15px auto 20px;font-weight:bold;font-size:1.2em;color:#5d4a3a;letter-spacing:2px}
    .carousel-shell{position:relative;width:100%;max-width:1200px;margin:auto}
    .carousel-wrapper{width:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab;user-select:none;overscroll-behavior-x:contain}
    .carousel-wrapper::-webkit-scrollbar{display:none}
    .carousel-wrapper:active{cursor:grabbing}
    .carousel{display:flex;width:100%}
    .carousel-page{flex:0 0 100%;box-sizing:border-box;padding:0 50px;display:grid;grid-template-columns:repeat(var(--columns,1),minmax(0,1fr));grid-template-rows:repeat(3,auto);align-content:start;gap:12px;scroll-snap-align:start;scroll-snap-stop:always}
    .carousel a{display:block;min-width:0;text-align:center;overflow:hidden;background:#fff}
    .carousel img{width:100%;aspect-ratio:1080/400;object-fit:cover;display:block;pointer-events:none;border-radius:10px}
    .item-caption{font-size:12px;font-weight:700;color:#333;line-height:1.35;height:1.35em;margin:5px 6px 0;overflow:hidden}
    .carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;background:transparent;color:#dac7b7;font-size:40px;line-height:1;padding:4px 8px;cursor:pointer}.carousel-arrow[disabled]{display:none}.carousel-prev{left:4px}.carousel-next{right:4px}
    .carousel-dots{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:15px 0 35px}
    .dot{width:10px;height:10px;padding:0;border:0;background-color:#eee;border-radius:50%;cursor:pointer}
    .dot.active{background-color:#dac7b7}
    @media(max-width:600px){
      .logo-container{margin:12px 0 8px}.logo-container img{width:135px}
      .section-title{margin:8px auto 6px}
      .carousel-page{padding:0 50px;gap:8px}.carousel-arrow{font-size:34px}.item-caption{font-size:12px;margin-top:3px}
      .carousel-dots{margin:8px 0 14px}
      .section-divider{padding:9px 0;margin-bottom:14px}
      .role-buttons{margin:12px auto 18px}.role-buttons .row{gap:12px}.role-buttons .item{width:78px}.role-buttons .item span{margin-top:5px;font-size:.78em}
    }
    .section-divider{width:100%;padding:12px 0;font-weight:bold;font-size:1.1em;text-align:center;background-color:#dac7b7;color:#fff;margin-bottom:25px}
    .social-divider{background-color:#F9F6F0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:20px;padding:15px 0;margin-top:40px}
    .social-divider a img{width:40px}
    .role-buttons{max-width:960px;margin:20px auto 40px;padding:0 10px}
    .role-buttons .row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
    .role-buttons .item{width:100px;text-align:center}
    .role-buttons .item img{width:100%;border-radius:10px;transition:transform .2s}
    .role-buttons .item span{display:block;font-size:.85em;color:#333;margin-top:8px;font-weight:bold}
    footer{text-align:center;padding:20px 10px;font-size:1em;color:#333}
  </style>
</head>
<body>

<div class="logo-container">
  <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/logo-banner_e06bad65.png" alt="LOGO" fetchpriority="high" decoding="async" />
</div>

<div class="carousel-shell">

  <div class="carousel-wrapper" id="scroll-wrapper">
    <div class="carousel" id="carousel-inner"></div>

  <button class="carousel-arrow carousel-next" id="carousel-next" type="button" aria-label="下一頁">›</button>
</div>

<div class="section-divider">JIWU寶寶目錄 ᯓ★ 日本IP</div>

<div class="role-buttons">
  <div class="row">
    <div class="item">

        <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/12-2025xia-ri-1_9ee5e5c6.png" loading="lazy" decoding="async" />
        <span>吉伊卡哇</span>
      </a>
    </div>
    <div class="item">
      <a href="CParkBM.html">
        <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/ckwp-icon_3c0d01bb.png" loading="lazy" decoding="async" />
        <span>吉伊卡哇樂園</span>
      </a>
    </div>
    <div class="item">
      <a href="CKRUD.html">
        <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/image_5ac485f6.png" loading="lazy" decoding="async" />
        <span>劇場版人魚島</span>
      </a>
    </div>
    <div class="item">
      <a href="NGNBM.html">
        <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/07-2025xiong-sheng-ri-6_ef4b7863.webp" loading="lazy" decoding="async" />
        <span>Nagano白熊</span>
      </a>
    </div>
  </div>
</div>

<div class="social-divider">
  <a href="https://www.instagram.com/jiwu_sales/" target="_blank"><img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/icon022_0968a80c.png" loading="lazy" decoding="async" /></a>
  <a href="https://www.threads.com/@jiwu_sales" target="_blank"><img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/icon023_fd29a4d2.png" loading="lazy" decoding="async" /></a>
  <a href="https://lin.ee/X6FUFI9" target="_blank"><img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/icon024_cfc55aab.png" loading="lazy" decoding="async" /></a>
</div>

<footer>台中朋朋歡迎自取 ˖ ࣪ ★ (ง˙∇˙)ว Google有地標！</footer>

<button id="refreshBtn" class="control-btn" onclick="location.reload()" title="重新整理">
  <img src="https://cdn.jsdelivr.net/gh/jiwusales/imgh@main/images_1350/re_a18f77c3.png" loading="lazy" decoding="async" />
</button>

<script>
(function(){
  function fastImg(url){
    return String(url||'').trim().replace(
      /^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/,
      'https://cdn.jsdelivr.net/gh/$1/$2@$3/$4'
    );
  }

  document.querySelectorAll('img').forEach(img=>{
    img.src=fastImg(img.src);
  });

  const wrapper=document.getElementById('scroll-wrapper');
  const inner=document.getElementById('carousel-inner');
  const dotsContainer=document.getElementById('carousel-dots');
  const previousButton=document.getElementById('carousel-prev');
  const nextButton=document.getElementById('carousel-next');

  const SHEET_ID='10Q4EOGZPMsu9WOyabxZjU8j6QNuGduM8L-h_mZ10ypQ';
  const SHEET_NAME='最新開團';
  const API_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(SHEET_NAME)}`;

  let allRows=[],columns=0,dragged=false;
  const fallback='https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260927162319_04b00fa2.png';

  async function fetchSheetData(){
    const json=await new Promise((resolve,reject)=>{
      const callback='jiwuHomeSheet_'+Date.now(),script=document.createElement('script');
      const cleanup=()=>{clearTimeout(timer);script.remove();delete window[callback];};
      const timer=setTimeout(()=>{cleanup();reject(new Error('最新開團資料載入逾時'));},20000);
      window[callback]=data=>{cleanup();resolve(data);};
      script.onerror=()=>{cleanup();reject(new Error('無法讀取最新開團資料'));};
      const url=new URL(API_URL);url.searchParams.set('tqx','out:json;responseHandler:'+callback);
      script.src=url.href;document.head.appendChild(script);
    });
    if(!json.table)throw new Error('無法讀取最新開團分頁');
    const headers=json.table.cols.map(col=>String(col.label||'').trim());
    const nameIndex=headers.indexOf('團名'),imageIndex=headers.indexOf('首圖'),shelfIndex=headers.indexOf('上架'),configIndex=headers.indexOf('開團設定');
    if(nameIndex<0||imageIndex<0)throw new Error('最新開團缺少團名或首圖欄位');
    return json.table.rows.filter(row=>String(row.c[nameIndex]?.v||'').trim()).flatMap(row=>{
      const group=String(row.c[nameIndex]?.v||'').trim(),image=String(row.c[imageIndex]?.v||'').trim(),shelf=shelfIndex>=0?String(row.c[shelfIndex]?.v||'').trim():'';
      let config={};try{config=JSON.parse(String(row.c[configIndex]?.v||'{}'));}catch(_){}
      const ads=Array.isArray(config.ads)&&config.ads.length?config.ads:[{name:group,image}];
      return ads.map(ad=>({name:String(ad?.name||group).trim()||group,image:String(ad?.image||image).trim(),group,shelf}));
    });
  }

  function createItem(row,index){
    const a=document.createElement('a');
    const link='https://jiwusales.github.io/jiwu_menu/NEWGOODS.html?group='+encodeURIComponent(row.group||row.name);
    a.href=link;
    a.target='_blank';a.rel='noopener noreferrer';a.draggable=false;
    const img=document.createElement('img');
    img.src=fastImg(row.image||fallback);img.alt=row.name;img.decoding='async';img.draggable=false;
    img.loading=index<columns*3?'eager':'lazy';
    const caption=document.createElement('div');caption.className='item-caption';caption.textContent=row.name;
    a.append(img,caption);return a;
  }

  function renderCarousel(rows=allRows){
    allRows=rows;columns=window.innerWidth<=600?1:Math.max(2,Math.min(5,Math.floor(wrapper.clientWidth/260)));
    inner.style.setProperty('--columns',columns);
    const filtered=rows.filter(row=>row.shelf.toLowerCase()!=='x');
    inner.replaceChildren();dotsContainer.replaceChildren();
    const capacity=columns*3;
    for(let start=0;start<filtered.length;start+=capacity){
      const page=document.createElement('div');page.className='carousel-page';
      filtered.slice(start,start+capacity).forEach((row,i)=>page.appendChild(createItem(row,start+i)));inner.appendChild(page);
      const dot=document.createElement('button');dot.className='dot';dot.type='button';
      const pageIndex=start/capacity;dot.setAttribute('aria-label','第 '+(pageIndex+1)+' 頁');
      dot.onclick=()=>wrapper.scrollTo({left:pageIndex*wrapper.clientWidth,behavior:'smooth'});dotsContainer.appendChild(dot);
    }
    if(!filtered.length){inner.textContent='目前沒有開團資訊。';}
    wrapper.scrollLeft=0;updateDots();
  }
  function updateDots(){
    const active=Math.round(wrapper.scrollLeft/wrapper.clientWidth);
    dotsContainer.querySelectorAll('.dot').forEach((dot,i)=>{dot.classList.toggle('active',i===active);dot.setAttribute('aria-current',i===active?'true':'false');});
    const pageCount=inner.querySelectorAll('.carousel-page').length;
    previousButton.disabled=pageCount<2;nextButton.disabled=pageCount<2;
  }
  function movePage(direction){const pages=inner.querySelectorAll('.carousel-page').length;if(pages<2)return;const next=(Math.round(wrapper.scrollLeft/wrapper.clientWidth)+direction+pages)%pages;wrapper.scrollTo({left:next*wrapper.clientWidth,behavior:'smooth'});}
  previousButton.onclick=()=>movePage(-1);nextButton.onclick=()=>movePage(1);
  wrapper.addEventListener('scroll',updateDots,{passive:true});
  let down=false,startX=0,startScroll=0;
  wrapper.addEventListener('mousedown',e=>{if(e.button!==0)return;down=true;dragged=false;startX=e.clientX;startScroll=wrapper.scrollLeft;});
  window.addEventListener('mousemove',e=>{if(!down)return;if(Math.abs(e.clientX-startX)>5){dragged=true;wrapper.style.scrollSnapType='none';e.preventDefault();wrapper.scrollLeft=startScroll-(e.clientX-startX);}});
  window.addEventListener('mouseup',()=>{if(!down)return;down=false;wrapper.style.scrollSnapType='';if(dragged)wrapper.scrollTo({left:Math.round(wrapper.scrollLeft/wrapper.clientWidth)*wrapper.clientWidth,behavior:'smooth'});});
  wrapper.addEventListener('click',e=>{if(dragged){e.preventDefault();dragged=false;}},true);
  let touchStartX=0,touchStartScroll=0;
  wrapper.addEventListener('touchstart',event=>{dragged=false;touchStartX=event.touches[0]?.clientX||0;touchStartScroll=wrapper.scrollLeft;},{passive:true});
  wrapper.addEventListener('touchend',event=>{const pages=inner.querySelectorAll('.carousel-page').length,delta=(event.changedTouches[0]?.clientX||0)-touchStartX,max=wrapper.scrollWidth-wrapper.clientWidth;if(pages<2||Math.abs(delta)<35)return;if(delta<0&&touchStartScroll>=max-2)wrapper.scrollTo({left:0,behavior:'smooth'});if(delta>0&&touchStartScroll<=2)wrapper.scrollTo({left:max,behavior:'smooth'});},{passive:true});
  let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>renderCarousel(),150);});

  async function init(){
    try{
      const rows=await fetchSheetData();
      renderCarousel(rows);
    }catch(e){
      console.error('載入失敗',e);
      inner.textContent='開團資料暫時無法載入，請稍後重新整理。';
    }
  }

  init();
})();
</script>
</body>
</html>
