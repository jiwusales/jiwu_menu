<script>
document.documentElement.style.setProperty('--theme-color',CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color',CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent=CONFIG.TOP_BAR_TEXT;

let allItems=[],allGroups=[],selectedGroup=null;
let groupSettings={};
function setCatalogImage(img,url,immediate=false){
  img.decoding='async';
  img.loading='eager';
  img.setAttribute('fetchpriority',immediate?'high':'auto');
  if(img.getAttribute('src')!==url)img.src=url;
}
// 圖片欄：同一格內以換行分隔網址；也容許網址之間的空白。
function productPhotos(value){
  return [...new Set(String(value||'').trim().split(/\s+/).filter(Boolean))];
}
function mountProductGallery(img, photos, startIndex=0){
  if(!img)return;
  photos=(Array.isArray(photos)?photos:productPhotos(photos)).map(fastImg);
  if(!photos.length)return;
  const old=img.closest('.product-gallery');
  if(old){old.replaceWith(img);}
  const box=document.createElement('div');
  box.className='product-gallery';
  img.replaceWith(box);box.appendChild(img);
  img.draggable=false;
  let index=Math.max(0,Math.min(startIndex,photos.length-1));
  const dots=document.createElement('div');dots.className='photo-dots';
  function show(next){
    index=(next+photos.length)%photos.length;
    setCatalogImage(img,photos[index],img.dataset.immediate==='true'||box.isConnected);img.dataset.full=photos[index];
    box.dataset.photos=JSON.stringify(photos);box.dataset.index=String(index);
    [...dots.children].forEach((dot,i)=>{
      dot.classList.toggle('active',i===index);
      dot.setAttribute('aria-pressed',String(i===index));
    });
  }
  if(photos.length>1){
    for(const [label,step,symbol] of [['上一張照片',-1,'‹'],['下一張照片',1,'›']]){
      const button=document.createElement('button');button.type='button';
      button.className='photo-arrow '+(step<0?'prev':'next');
      button.textContent=symbol;button.setAttribute('aria-label',label);
      button.onclick=e=>{e.stopPropagation();show(index+step)};box.appendChild(button);
    }
    photos.forEach((_,i)=>{
      const dot=document.createElement('button');dot.type='button';
      dot.setAttribute('aria-label',`第 ${i+1} 張照片`);
      dot.onclick=e=>{e.stopPropagation();show(i)};dots.appendChild(dot);
    });box.appendChild(dots);
    let touch=null,suppressUntil=0;
    box.addEventListener('touchstart',e=>{
      touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;
    },{passive:true});
    box.addEventListener('touchend',e=>{
      if(!touch)return;
      const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;
      touch=null;
      if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){
        show(index+(dx<0?1:-1));suppressUntil=Date.now()+500;
        e.stopPropagation();
      }
    },{passive:true});
    box.addEventListener('touchcancel',()=>{touch=null},{passive:true});
    box.addEventListener('click',e=>{
      if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}
    },true);
  }
  show(index);
}
function restoreProductGallery(card){
  const box=card.querySelector('.product-gallery');
  if(box)mountProductGallery(box.querySelector('img'),JSON.parse(box.dataset.photos),Number(box.dataset.index));
}

function fastImg(url){
  const s=String(url||"").trim();
  return s.replace(
    /^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/,
    "https://cdn.jsdelivr.net/gh/$1/$2@$3/$4"
  );
}

const STOCK_STYLES={
  "現貨":{bg:"#FFF4BD",color:"#333",tagClass:""},
  "SOLD OUT":{bg:"#3a3a3a",color:"#fff",tagClass:"sold-out"},
  "受注":{bg:"#B1DEC1",color:"#fff",tagClass:""},
  "路上":{bg:"#6C95B0",color:"#fff",tagClass:""},
  "預訂":{bg:"#C197D2",color:"#fff",tagClass:""}
};

let cart=JSON.parse(localStorage.getItem('jiwu_cart'))||[];

function getCartSourceName(item){
  return String(
    item.groupName||
    item.ipName||
    item.ip||
    item.group||
    (typeof selectedGroup!=="undefined"?selectedGroup:"")||
    CONFIG.IP_NAME||
    ""
  ).trim()||"商品";
}

function toggleMenu(isOpen){
  const menu=document.getElementById('side-menu');
  const overlay=document.getElementById('menu-overlay');
  if(isOpen){
    menu.classList.add('open');
    overlay.style.display='block';
  }else{
    menu.classList.remove('open');
    overlay.style.display='none';
  }
}

function getUrlGroup(){
  return new URLSearchParams(location.search).get('group')||'';
}

function loadData(){
  const url=`https://jiwu-mac-relay.jiwusales.workers.dev/functions/v1/jiwu-public?format=gviz&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;

  fetch(url).then(r=>r.text()).then(t=>{
    try{
      const data=JSON.parse(t.substr(47).slice(0,-2));

      const HEADER_NAMES={
        group:"團名",
        role:"角色",
        name:"名稱",
        originalPrice:"原價",
        price:"售價",
        stock:"庫存",
        launchItemId:"商品ID",
        status:"狀態",
        sn:"貨號",
        img:"圖片",
        url:"商品網址",
        size:"尺寸",format:"格式",
        note:"備註",
        banner:"首圖",launchConfig:"開團設定",
        color:"主色系"
      };

      const colLabels=(data.table.cols||[]).map(c=>String(c.label||"").trim());
      const COL={};

      Object.keys(HEADER_NAMES).forEach(key=>{
        COL[key]=colLabels.indexOf(HEADER_NAMES[key]);
      });

      const getV=(r,idx)=>{
        if(idx===-1||!r.c||!r.c[idx])return"";
        const cell=r.c[idx];
        const val=cell.v!==null&&cell.v!==undefined?cell.v:(cell.f||"");
        return String(val).trim();
      };

      let lastGroup="",lastNote="";
      let sectionIndex=0,sectionBanner="",sectionColor="";
      let groupPrimaryColor="",bannerCount=0;
      groupSettings={};

      const rawItems=data.table.rows.map(r=>{
        const rawGroup=getV(r,COL.group);
        const rawBanner=getV(r,COL.banner);
        const rawColor=getV(r,COL.color);
        let productConfig={};try{productConfig=JSON.parse(getV(r,COL.launchConfig)||'{}');}catch(_){}

        if(rawGroup!==""&&rawGroup!==lastGroup){
          lastGroup=rawGroup;
          sectionIndex++;
          sectionBanner="";
          sectionColor="";
          groupPrimaryColor="";

          lastNote="";
        }

        if(rawBanner){

        // 整團最上方 bar 固定使用第一首圖區段的主色系。

        if(rawColor&&bannerCount<=1&&!groupPrimaryColor){
          groupPrimaryColor=rawColor;
        }

        lastNote=getV(r,COL.note)||lastNote;
        if(lastGroup){
          const config=productConfig;
          groupSettings[lastGroup]={...groupSettings[lastGroup],color:groupPrimaryColor,note:lastNote,...(Array.isArray(config.panels)&&config.panels.length?{panels:config.panels}:{})};
        }

        return{
          group:lastGroup,
          sectionId:sectionIndex,
          sectionBanner,
          sectionColor,
          role:getV(r,COL.role)||" ",
          kind:String(productConfig.productKind||''),
          name:getV(r,COL.name),
          originalPrice:getV(r,COL.originalPrice),
          price:getV(r,COL.price),
          stock:getV(r,COL.stock),
          launchItemId:getV(r,COL.launchItemId),
          status:getV(r,COL.status),
          sn:getV(r,COL.sn),
          images:productPhotos(getV(r,COL.img)||"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png"),
          img:productPhotos(getV(r,COL.img)||"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png")[0],
          url:getV(r,COL.url),
          size:getV(r,COL.size),format:getV(r,COL.format)
        };
      });

      allItems=rawItems.filter(item=>{
        if(!item.group||!String(item.name).trim())return false;
        const stockVal=String(item.stock).trim().toLowerCase();
        return stockVal!=='x'&&stockVal!=='ｘ';
      });

      allGroups=[...new Set(allItems.map(i=>i.group))];

      const urlGroup=getUrlGroup();
      selectedGroup=allGroups.includes(urlGroup)?urlGroup:allGroups[0];

      if(!urlGroup&&selectedGroup){
        const url=new URL(location.href);
        url.searchParams.set('group',selectedGroup);
        history.replaceState({},'',url.pathname+'?'+url.searchParams.toString());
      }

      renderSideMenu();
      renderGroupNav();
      applyGroupSettings(selectedGroup);
      renderItems();
      updateCartUI();

    }catch(e){
      document.getElementById('items-wrapper').innerHTML="載入失敗。";

    }
  });
}

// Returns complete physical groups only; [] means ambiguous/nonphysical text.
// Axis-internal spaces are not option separators (H400 × W390 × D180 is one group).
function jiwuPhysicalSizeGroups(sizeValue) {
  const text=String(sizeValue??'').normalize('NFKC').trim();if(!text)return [];
  const axes='(?:長|寬|肩|袖|高|深|厚|着丈|身幅|身巾|肩幅|袖丈)',amount='\\d+(?:\\.\\d+)?',unit='(?:cm|mm|公分)?';
  const axisToken=new RegExp('('+axes+')\\s*[:：]?\\s*'+amount+'\\s*'+unit,'gi');
  const xBody='(?:[HWD]?\\s*'+amount+'\\s*'+unit+'\\s*[x×]\\s*){1,2}[HWD]?\\s*'+amount+'\\s*'+unit;
  const singleX=new RegExp('^'+xBody+'$','i'),singleScalar=new RegExp('^'+amount+'\\s*(?:cm|mm|公分)$','i');
  const one=value=>singleX.test(value)||singleScalar.test(value);
  if(text.includes('/')){const parts=text.split('/').map(value=>value.trim());if(parts.every(Boolean)){const groups=parts.flatMap(value=>jiwuPhysicalSizeGroups(value));if(groups.length===parts.length)return groups;}return [];}
  if(one(text))return [text];
  const tokens=[...text.matchAll(axisToken)];
  if(tokens.length&&tokens.map(token=>token[0]).join('').replace(/\s+/g,'')===text.replace(/\s+/g,'')){
    const first=tokens[0][1],groups=[],seen=new Set();let current='';
    for(const token of tokens){const axis=token[1];if(axis===first&&current){groups.push(current);current='';seen.clear();}if(seen.has(axis))return [];seen.add(axis);current+=token[0].replace(/\s+/g,'');}
    if(current)groups.push(current);return groups;
  }
  const groupPattern=new RegExp('^(?:'+xBody+'|'+amount+'\\s*(?:cm|mm|公分))(?=$|\\s)','i');
  const groups=[];let rest=text;
  while(rest){const match=rest.match(groupPattern);if(!match)return [];groups.push(match[0].trim());rest=rest.slice(match[0].length).trim();}
  return groups;
}

// Shared conservative projection; never changes name/role/SKU/ID/price.
// inferFormat=false permits a client explicitly sending format:'' to clear it.
function jiwuSplitProductSpec(sizeValue, formatValue, inferFormat = true) {
  const normalizeFormat=value=>String(value??'').normalize('NFKC').trim().replace(/\bBOX\s+([1-9]\d*(?:入|款)?)(?=$|[\s/])/gi,'BOX$1').replace(/(單抽|单抽|抱盒)\s+([1-9]\d*(?:入|款))(?=$|[\s/])/g,'$1$2').replace(/[\s/]+/g,' ').trim();
  const originalSize=String(sizeValue??'').trim(),explicitFormat=normalizeFormat(formatValue);
  const normalized=originalSize.normalize('NFKC'),parts=normalized.split('/').map(value=>value.trim()),optionParts=normalizeFormat(originalSize).split(' ');
  const clothing=value=>/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|F|FREE|SML)$/i.test(value);
  const option=value=>clothing(value)||/^(?:(?:單抽|单抽|抱盒)(?:\s*[1-9]\d*(?:入|款))?|BOX(?:\s*[1-9]\d*(?:入|款)?)?|針式|针式|夾式|夹式|針|针|夾|夹)$/i.test(value);
  if(optionParts.length&&optionParts.every(value=>value&&option(value))){
    return {format:explicitFormat||(inferFormat?optionParts.join(' '):''),size:''};
  }
  let labels=0;while(labels<parts.length&&clothing(parts[labels]))labels++;
  const measures=jiwuPhysicalSizeGroups(parts.slice(labels).join('/'));
  if(labels>0&&measures.length===labels){
    return {format:explicitFormat||(inferFormat?parts.slice(0,labels).join(' '):''),size:measures.join(' ')};
  }
  const physicalGroups=jiwuPhysicalSizeGroups(originalSize);
  return {format:explicitFormat,size:physicalGroups.length?physicalGroups.join(' '):originalSize};
}

// Display projection only. Existing carts and pending order payloads are never rewritten.
function jiwuSpecEscape(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function jiwuFormatOptions(value){return String(value??'').split(/[\/／、,，;；\s]+/).map(value=>value.trim()).filter(Boolean);}
function parseItemVariant(item){
  const spec=jiwuSplitProductSpec(item?.size,item?.format);
  if(spec.format){
    const sizes=jiwuFormatOptions(spec.format);
    return {size:sizes[0]||'',sizes,color:'',colorCode:'',realSize:spec.size};
  }
  if(typeof parseVariant==='function'){
    const variant=parseVariant(item?.size);
    // An unambiguous physical measurement is not a colour option.
    const raw=String(item?.size??'').trim();
    if(!variant.sizes?.length&&!variant.colorCode&&variant.color===raw&&/^(?:(?:[HWD長寬高深厚肩袖Φφ]|\d)[\s\S]*\d[\s\S]*(?:cm|mm|公分|毫米|[x×])|(?:長|寬|高|深|厚|肩|袖)\s*\d)/i.test(raw))
      return {...variant,color:'',realSize:raw};
    return variant;
  }
  return {size:'',sizes:[],color:'',colorCode:'',realSize:spec.size};
}
function jiwuIsDrawVariant(item){return (parseItemVariant(item).sizes||[]).some(value=>/單抽|单抽|抱盒|BOX/i.test(value));}
function jiwuIsApparel(item){
  const kind=String(item?.kind||'').normalize('NFKC').trim(),name=String(item?.name||'').normalize('NFKC');
  return /服飾|服装|衣著|衣服/.test(kind)||/(?:大學\s*T|(?:長|短|半袖)\s*T(?:[^a-z]|$)|T恤|Tシャツ|上衣|襯衫|外套|毛衣|針織衫|衛衣|帽T|連帽衫|背心|洋裝|連身裙|裙子|棉褲|長褲|短褲|居家服|睡衣|服飾|襪|圍巾|手套|帽子)/i.test(name);
}
function jiwuCatalogSpecHtml(items){
  const rows=Array.isArray(items)?items:[items],variants=rows.map(parseItemVariant);
  const sizes=[...new Set(variants.map(variant=>String(variant.realSize||'').trim()).filter(Boolean))];
  const formats=rows.some(jiwuIsDrawVariant)?[]:[...new Set(rows.filter(jiwuIsApparel).flatMap(item=>parseItemVariant(item).sizes||[]))];
  const parts=[];
  if(formats.length)parts.push('<span class="product-format">'+jiwuSpecEscape(formats.join(' '))+'</span>');
  if(sizes.length)parts.push('<span class="product-physical-size">'+jiwuSpecEscape(sizes.join(' / '))+'</span>');
  return '<div class="size">'+parts.join(' · ')+'</div>';
}

function jiwuCartFormatSuffix(item){

}
function jiwuActualSizeForOption(variant,option){
  if(typeof getVariantRealSize==='function')return getVariantRealSize(variant,option);
  const sizes=variant.sizes||[],measurements=jiwuPhysicalSizeGroups(variant.realSize);

}

function parseVariant(value){
  const raw=String(value||"").trim();
  const p=raw.split(/[\/／]/).map(x=>x.trim()).filter(Boolean);

  // 每個購買方式分列，保留各列貨號、價格與庫存。
  if(/^(單抽|抱盒.*)$/.test(p[0]||'')&&p[1]!=='抱盒'){
    return {size:p[0],sizes:[p[0]],color:'',colorCode:'',realSize:p.slice(1).join('/'),sharedRealSize:true,purchaseOption:true};
  }

  // 單抽與抱盒共用同一段實際尺寸。
  if(p[0]==='單抽'&&p[1]==='抱盒'){
    return {size:'單抽',sizes:['單抽','抱盒'],color:'',colorCode:'',realSize:p.slice(2).join('/'),sharedRealSize:true};
  }

  const isSingleCode=s=>/^#?[0-9a-f]{3,8}$/i.test(String(s||"").trim());
  const isCode=s=>{
    const parts=String(s||"").split("+").map(x=>x.trim()).filter(Boolean);
    return parts.length>0&&parts.every(isSingleCode);
  };
  const code=s=>String(s||"").split("+").map(x=>{
    x=x.trim();
    return x?(x.startsWith("#")?x:"#"+x):"";
  }).filter(Boolean).join("+");

  const isSize=s=>/^(XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|2XL|3XL|4XL|5XL|FREE|F)$/i.test(String(s||"").trim());
  const looksLikeRealSize=s=>/\d|cm|mm|×|約|φ|Φ|直徑|胸寬|衣長|袖長|肩寬|高|寬|長/i.test(String(s||""));

  const sizes=[];
  let i=0;

  // 開頭連續出現的 S/M/L/XL... 全部視為可選尺寸
  while(i<p.length&&isSize(p[i])){
    sizes.push(p[i].toUpperCase());
    i++;
  }

  const rest=p.slice(i);
  let color="",colorCode="",realSize="";

  if(sizes.length){
    if(rest.length===1){
      if(isCode(rest[0])){
        colorCode=code(rest[0]);
      }else if(looksLikeRealSize(rest[0])){
        realSize=rest[0];
      }else{
        color=rest[0];
      }
    }else if(rest.length>=2){
      // 尺寸.../顏色/色碼/實際尺寸
      if(isCode(rest[1])){
        color=rest[0]||"";
        colorCode=code(rest[1]);
        realSize=rest.slice(2).join("/")||"";
      }else if(looksLikeRealSize(rest[0])){
        realSize=rest.join("/");
      }else{
        // 相容舊格式：S/粉色/胸寬40cm
        color=rest[0]||"";
        realSize=rest.slice(1).join("/")||"";
      }
    }

    return{
      size:sizes[0]||"",
      sizes,
      color,
      colorCode,
      realSize
    };
  }

  // 沒有尺寸：顏色/色碼/實際尺寸
  if(rest.length){
    color=rest[0]||"";

    if(rest.length>=2&&isCode(rest[1])){
      colorCode=code(rest[1]);
      realSize=rest.slice(2).join("/")||"";
    }else if(rest.length>=2){
      realSize=rest.slice(1).join("/")||"";
    }
  }

  return{
    size:"",
    sizes:[],
    color,
    colorCode,
    realSize
  };
}

function getVariantRealSize(variant, selectedSize){
  if(variant.sharedRealSize)return variant.realSize||'';
  const measurements=jiwuPhysicalSizeGroups(variant.realSize);
  const sizes=variant.sizes||[];
  // Multiple measurements follow the same order as the size buttons.
  if(sizes.length>1 && measurements.length===sizes.length){
    const index=sizes.findIndex(value=>String(value).toUpperCase()===String(selectedSize||'').toUpperCase());
    return index>=0?measurements[index]:'';
  }
  return variant.realSize||'';
}

function getColorDotsHtml(items){
  const seen=new Set();
  const dots=[];

  items.forEach(item=>{
    const v=parseItemVariant(item);
    if(!v.colorCode)return;

    const key=v.colorCode.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);

    const colors=v.colorCode.split("+").map(x=>x.trim()).filter(Boolean);
    const hasWhite=colors.some(x=>{
      const c=x.toLowerCase().replace("#","");
      return c==="fff"||c==="ffffff";
    });

    let bg=colors[0]||"transparent";
    if(colors.length===2){
      bg=`linear-gradient(135deg,${colors[0]} 0%,${colors[0]} 50%,${colors[1]} 50%,${colors[1]} 100%)`;
    }else if(colors.length>2){
      const step=100/colors.length;
      bg=`linear-gradient(135deg,${colors.map((c,i)=>`${c} ${i*step}%,${c} ${(i+1)*step}%`).join(",")})`;
    }

    dots.push(`<span class="color-dot" style="background:${bg};${hasWhite?"border:1px solid #bbb":""}" title="${v.color||v.colorCode}"></span>`);
  });

  return dots.length?`<div class="color-dots">${dots.join("")}</div>`:"";
}

        <div class="variant-options" id="variant-color-options"></div>

    </div>`;

  const imgEl=ov.querySelector('#variant-img');
  const sizeSection=ov.querySelector('#variant-size-section');
  const sizeBox=ov.querySelector('#variant-size-options');
  const colorSection=ov.querySelector('#variant-color-section');
  const colorBox=ov.querySelector('#variant-color-options');
  const realSizeEl=ov.querySelector('#variant-real-size');
  const priceEl=ov.querySelector('#variant-price');
  const stockEl=ov.querySelector('#variant-stock');
  const addBtn=ov.querySelector('#variant-add');

  const colors=[...new Set(
    available.map(x=>parseItemVariant(x).color).filter(Boolean)
  )];

  const allSizes=[...new Set(
    available.flatMap(x=>parseItemVariant(x).sizes||[]).filter(Boolean)
  )];

  const hasAnySizes=allSizes.length>0;

  function rowsForSelectedColor(){
    if(!colors.length||!selectedColor)return available;
    return available.filter(x=>parseItemVariant(x).color===selectedColor);
  }

  function validSizesForSelectedColor(){
    return [...new Set(
      rowsForSelectedColor()
        .flatMap(x=>parseItemVariant(x).sizes||[])
        .filter(Boolean)
    )];
  }

  function findItem(){
    let matches=rowsForSelectedColor();

    if(selectedSize){
      const sizeMatches=matches.filter(x=>{
        const v=parseItemVariant(x);
        return (v.sizes||[]).includes(selectedSize);
      });

      if(sizeMatches.length)matches=sizeMatches;
    }

    return matches[0]||null;
  }

  function renderSizeButtons(){
    const validSizes=validSizesForSelectedColor();

    if(!hasAnySizes||!validSizes.length){
      selectedSize="";
      sizeSection.style.display='none';
      sizeBox.innerHTML="";
      return;
    }

    sizeSection.style.display='block';

    if(!validSizes.includes(selectedSize)){
      selectedSize=validSizes[0];
    }

    sizeBox.innerHTML="";

    validSizes.forEach(size=>{
      const b=document.createElement('button');
      b.className='variant-option';
      b.dataset.value=size;
      b.textContent=size;
      b.classList.toggle('active',size===selectedSize);

      b.onclick=ev=>{
        ev.stopPropagation();
        selectedSize=size;
        setChosen();
      };

      sizeBox.appendChild(b);
    });
  }

  function updateColorButtons(){
    colorBox.querySelectorAll('.variant-option').forEach(b=>{
      b.disabled=false;
      b.classList.toggle('active',b.dataset.value===selectedColor);
    });
  }

  function setChosen(){
    selectedItem=findItem();

    sizeBox.querySelectorAll('.variant-option').forEach(b=>{
      b.classList.toggle('active',b.dataset.value===selectedSize);
    });

    updateColorButtons();

    if(!selectedItem){
      addBtn.disabled=true;
      return;
    }

    const v=parseItemVariant(selectedItem);

    selectedItem={
      ...selectedItem,
      selectedSize:selectedSize,
      selectedColor:selectedColor||v.color||"",
      actualSize:getVariantRealSize(v,selectedSize)
    };

    mountProductGallery(imgEl,selectedItem.images||productPhotos(selectedItem.img||first.img));
    priceEl.textContent=getDisplayPrice(selectedItem.price);
    realSizeEl.textContent=selectedItem.actualSize;

    const info=getItemOrderInfo(selectedItem);
    const showTag=info.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(info.tagKey);

    stockEl.style.display=showTag?"flex":"none";

    if(showTag){
      stockEl.textContent=info.tagText;
      stockEl.style.background=info.tagBg;
      stockEl.style.color=info.tagColor;
    }

    addBtn.textContent=info.tagKey==="SOLD OUT"?"補貨登記":"加入購物車";
    addBtn.disabled=false;
  }

  if(colors.length){
    colors.forEach(color=>{
      const b=document.createElement('button');
      b.className='variant-option';
      b.dataset.value=color;
      b.textContent=color;
      b.classList.toggle('active',color===selectedColor);

      b.onclick=ev=>{
        ev.stopPropagation();
        selectedColor=color;

        // 換顏色時，尺寸只留下該顏色真正有的尺寸
        renderSizeButtons();
        setChosen();
      };

      colorBox.appendChild(b);
    });
  }else{
    colorSection.style.display='none';
  }

  renderSizeButtons();
  setChosen();

  addBtn.onclick=ev=>{
    ev.stopPropagation();
    if(!selectedItem)return;

    const info=getItemOrderInfo(selectedItem);
    addToCart(ev,selectedItem,info.tagText||"預訂",info.tagBg,info.tagColor);
    ov.remove();
  };

  ov.querySelector('.variant-close').onclick=()=>ov.remove();
  ov.onclick=ev=>{if(ev.target===ov)ov.remove()};
  document.body.appendChild(ov);
}

function getVariantGroupPrice(items){
  const prices=[...new Set(items.map(x=>String(x.price||"").trim()).filter(x=>/^\d+$/.test(x)))].map(Number).sort((a,b)=>a-b);
  if(!prices.length)return getDisplayPrice(items[0]?.price||"");
  return prices.length===1?`$${prices[0]}`:`$${prices[0]}~$${prices[prices.length-1]}`;
}

function clearCart(){
  if(confirm("確定要清空購物車嗎？")){
    cart=[];
    saveCart();
    updateCartUI();
  }
}

function toggleCart(isOpen){
  const panel=document.getElementById('cart-panel');
  const bg=document.getElementById('cart-overlay-bg');

  if(isOpen){
    panel.classList.add('open');
    bg.style.display='block';
  }else{
    panel.classList.remove('open');
    bg.style.display='none';
  }
}

function isCartRestockItem(item){
  return ['S☹LD OUT','SOLD OUT','補貨登記','補登'].includes(String(item.currentStatus||'').trim().toUpperCase());
}

function getDisplayPrice(price){
  const p=String(price||"").trim();

  if(p.indexOf('-')!==-1)return"參考圖示";
  if(p==="")return"詢問花花";
  if(/^[0-9]+$/.test(p))return`$${p}`;

  return p;
}

function updateCartUI(){
  const list=document.getElementById('cart-list');
  const badge=document.getElementById('cart-badge');
  const totalEl=document.getElementById('cart-total');

  list.innerHTML="";

  let total=0;
  let hasInquiry=false;

  cart.forEach((item,index)=>{
    const isNumeric=/^[0-9]+$/.test(String(item.price||"").trim());
    const priceVal=isNumeric?parseInt(item.price):0;

    if(!isNumeric&&!isCartRestockItem(item))hasInquiry=true;

    if(!isCartRestockItem(item))total+=priceVal;

    const div=document.createElement('div');
    div.className='cart-item';

    const tagHtml=item.currentStatus
      ?`<div class="cart-tag" style="background-color:${item.tagBg};color:${item.tagColor||'white'}">${item.currentStatus}</div>`
      :"";

    div.innerHTML=`
      <img src="${fastImg(item.img)}" loading="lazy" decoding="async">
      <div class="cart-item-info">
        <div>${tagHtml}${getCartVariantTags(item)}</div>
        <div style="font-weight:bold;margin-bottom:2px">${item.name}</div>
        <div style="color:#e44d26;font-weight:bold;margin-top:2px">${getDisplayPrice(item.price)}</div>
      </div>
      <span style="cursor:pointer;color:#ccc;padding:5px" onclick="removeFromCart(${index})">✕</span>
    `;

    list.appendChild(div);
  });

  badge.textContent=cart.length;
  badge.style.display=cart.length>0?"flex":"none";
  totalEl.textContent=`$${total}${hasInquiry?" + 詢問報價":""}`;
}

function removeFromCart(index){
  cart.splice(index,1);
  saveCart();
  updateCartUI();

  if(document.getElementById('checkout-modal').style.display==="flex"){
    renderCheckoutSummary();
  }
}

function onlineSalesGroupName(value){
  return String(value||'').trim().replace(/^\d*\s*⛔\uFE0F?\s*/, '').trim();
}

function generateLineMessage(){
  let msg="你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n";
  let total=0;
  let hasInquiry=false;

  const groupedCart={};
  const groupOrder=[];

  cart.forEach(item=>{
    const gName=onlineSalesGroupName(getCartSourceName(item));

    if(!groupedCart[gName]){
      groupedCart[gName]=[];
      groupOrder.push(gName);
    }

    groupedCart[gName].push(item);
  });

  let index=1;

  groupOrder.forEach(gName=>{
    msg+=`\n【${gName}】\n`;

    groupedCart[gName].forEach(item=>{
      const priceRaw=String(item.price||"").trim();

      let priceText="";
      let priceVal=0;

      if(/^[0-9]+$/.test(priceRaw)){
        priceVal=parseInt(priceRaw);
        priceText=`$${priceRaw}`;
      }else if(priceRaw.indexOf('-')!==-1){
        priceText="參考圖示";
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }else if(priceRaw===""){
        priceText="詢問花花";
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }else{
        priceText=priceRaw;
        hasInquiry=hasInquiry||!isCartRestockItem(item);
      }

      if(!isCartRestockItem(item))total+=priceVal;

      let statusText="";

      if(item.currentStatus==="S☹LD OUT"){
        statusText="(補貨登記)";
      }else if(item.currentStatus==="最後一個"){
        statusText="(現貨)";
      }else if(item.currentStatus){
        statusText=`(${item.currentStatus})`;
      }

      const hiddenRoles=["三小隻","其他角色","綜合角色","水族","動物","食物"];
      const roleText=item.role&&!hiddenRoles.includes(item.role)
        ?` ${item.role}`
        :"";

      const variantText=getVariantDisplay(item).replaceAll("／","/");
const optionText=variantText?` ${variantText}`:"";
msg+=`${index}. ${statusText}${statusText?" ":""}${item.name}${roleText}${optionText} ${priceText}\n`;

      index++;
    });
  });

  msg+=`\n總金額：$${total}${hasInquiry?" + 詢問報價":""}`;

  return msg;
}

function handleCheckoutEntry(){
  if(cart.length===0)return alert("購物車是空的唷！");

  const isMobileDevice=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

  if(isMobileDevice){
    const msg=generateLineMessage();

    window.location.href=CONFIG.LINE_MSG_URL+encodeURIComponent(msg);

    setTimeout(()=>{
      cart=[];
      saveCart();
      updateCartUI();
      toggleCart(false);
    },1500);

  }else{
    openCheckoutModal();
  }
}

function openCheckoutModal(){
  toggleCart(false);
  document.getElementById('step-1').style.display="block";
  document.getElementById('step-2').style.display="none";
  renderCheckoutSummary();
  document.getElementById('checkout-modal').style.display="flex";
}

function renderCheckoutSummary(){
  const summaryList=document.getElementById('modal-summary-list');
  const totalEl=document.getElementById('modal-total-price');

  summaryList.innerHTML="";

  let total=0;
  let hasInquiry=false;

  cart.forEach(item=>{
    const isNumeric=/^[0-9]+$/.test(String(item.price||"").trim());
    const priceVal=isNumeric?parseInt(item.price):0;

    if(!isNumeric&&!isCartRestockItem(item))hasInquiry=true;

    if(!isCartRestockItem(item))total+=priceVal;

    const div=document.createElement('div');
    div.className='cart-item';

    const tagHtml=item.currentStatus
      ?`<div class="cart-tag" style="background-color:${item.tagBg};color:${item.tagColor||'white'}">${item.currentStatus}</div>`
      :"";

    div.innerHTML=`
      <img src="${fastImg(item.img)}" loading="lazy" decoding="async">
      <div class="cart-item-info">
        <div>${tagHtml}${getCartVariantTags(item)}</div>
        <div style="font-weight:bold;margin-bottom:2px">${item.name}</div>
        <div style="color:#e44d26;font-weight:bold;margin-top:2px">${getDisplayPrice(item.price)}</div>
      </div>
    `;

    summaryList.appendChild(div);
  });

  totalEl.textContent=`$${total}${hasInquiry?" + 詢問報價":""}`;
}

function closeModal(){
  document.getElementById('checkout-modal').style.display="none";
}

async function handleFinalCheckout(){
  const lineName=document.getElementById('user-line').value.trim();
  const igAcc=document.getElementById('user-ig').value.trim();

  if(!lineName){
    alert("請輸入LINE名稱方便核對ι(｀･-･´)/");
    return;
  }

  const btn=document.getElementById('send-btn');
  btn.disabled=true;
  btn.textContent="傳送中 ᓫ(๑º꒳º๑)ꜝꜝ";

  const cartData=cart.map(item=>{
    const source=getCartSourceName(item);

    return{
      ...item,
      ip:source,
      ipName:source,
      group:source,
      groupName:source
    };
  });

  const postData={
    source:"電腦",
    lineName,
    igAccount:igAcc,
    cartItems:cartData
  };

  try{await jiwuSubmitOrder(postData);}catch(e){alert(e.message||'訂單儲存失敗，購物車已保留，請重試');btn.disabled=false;btn.textContent='確認訂購';return;}

  cart=[];
  saveCart();
  updateCartUI();

  document.getElementById('step-1').style.display="none";
  document.getElementById('step-2').style.display="block";
}

function renderGroupNav(){
  const nav=document.getElementById('dynamic-nav');

  nav.innerHTML=allGroups.map(g=>{
    const isSelected=selectedGroup===g;
    const safeName=g.replace(/'/g,"\\'");

    return`<a class="${isSelected?'active-role':''}" onclick="selectGroup('${safeName}')">${g}</a>`;
  }).join('');
}

function selectGroup(name){
  if(!allGroups.includes(name)||name===selectedGroup)return;

  selectedGroup=name;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  renderGroupNav();
  applyGroupSettings(selectedGroup);
  renderItems();

  const url=new URL(location.href);

  url.searchParams.set('group',name);

  history.pushState(
    {},
    '',
    url.pathname+'?'+url.searchParams.toString()
  );
}

function getStockInfo(item){
  const stockNum=parseFloat(item.stock)||0;

  if(stockNum===1){
    return{
      tagKey:"現貨",
      tagText:"最後一個",
      tagBg:"#E24C60",
      tagColor:"#fff",
      tagClass:""
    };
  }

  const key=String(item.status||"").trim();
  const style=STOCK_STYLES[key];

  if(!style){
    return{
      tagKey:"",
      tagText:"",
      tagBg:"#fab460",
      tagColor:"white",
      tagClass:""
    };
  }

  return{
    tagKey:key,
    tagText:key,
    tagBg:style.bg,
    tagColor:style.color,
    tagClass:style.tagClass
  };
}

function jiwuCanvasSections(items,panels){
  const sections=new Map();
  if(Array.isArray(panels)&&panels.length&&panels.every(panel=>Array.isArray(panel.productIds))){
    panels.forEach((panel,index)=>{
      const ids=new Set(panel.productIds),drawKeys=new Set(items.filter(item=>ids.has(item.launchItemId)&&jiwuIsDrawVariant(item)).map(getVariantKey));
      sections.set(index,{banner:panel.image||'',color:panel.mainColor||'',items:items.filter(item=>ids.has(item.launchItemId)||(jiwuIsDrawVariant(item)&&drawKeys.has(getVariantKey(item))))});
    });
    return sections;
  }
  items.forEach(item=>{
    if(!sections.has(item.sectionId))sections.set(item.sectionId,{banner:item.sectionBanner,color:item.sectionColor||'',items:[]});
    sections.get(item.sectionId).items.push(item);
  });
  return sections;
}

function renderItems(){
  const container=document.getElementById('items-wrapper');
  container.style.visibility='visible';
  container.removeAttribute('aria-busy');
  container.innerHTML="";

  const groupItems=allItems.filter(i=>i.group===selectedGroup);
  if(groupItems.length===0){
    container.style.visibility='visible';
    container.removeAttribute('aria-busy');
    container.innerHTML="<div style='padding:40px;color:#999'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";
    return;
  }

  const sections=jiwuCanvasSections(groupItems,groupSettings[selectedGroup]?.panels);

  let sectionIndex=0;
  sections.forEach((section)=>{
    const block=document.createElement('section');
    block.className='series-section';
    if(section.banner){
      const banner=document.createElement('div');
      banner.className='series-banner';
      const img=document.createElement('img');
      setCatalogImage(img,fastImg(section.banner),sectionIndex===0);
      img.alt='系列首圖';
      img.decoding='async';
      banner.appendChild(img);
      block.appendChild(banner);
    }
    const grouped=new Map();
    section.items.forEach(item=>{
      const key=getVariantKey(item);
      if(!grouped.has(key))grouped.set(key,[]);
      grouped.get(key).push(item);
    });
    const grid=document.createElement('div');
    grid.className='group-grid';
    grouped.forEach(variants=>grid.appendChild(createCard(variants,section.color)));
    block.appendChild(grid);
    container.appendChild(block);
    sectionIndex++;
  });

}

function createCard(variants,sectionColor=""){
  const usable=variants.filter(canAddItem);
  const item=usable.find(x=>String(x.stock||"").trim()!=="-")||usable[0]||variants[0];
  const card=document.createElement('div');
  card.className='card';

  const borderColor=String(sectionColor||"").trim();
  if(borderColor){
    card.style.borderColor=borderColor.startsWith("#")?borderColor:"#"+borderColor;
  }

  const allSoldOut=variants.every(x=>String(x.stock||"").trim()==='-');
  const info=allSoldOut?getItemOrderInfo(variants[0]):getItemOrderInfo(item);
  if(allSoldOut)card.classList.add('is-sold-out');

  const shouldShowTag=info.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(info.tagKey);
  const displayTagText=shouldShowTag?info.tagText:"";
  const finalTagClass=info.tagClass||(displayTagText.length>=2?"vertical":"");
  const tagHtml=displayTagText?`<div class="stock-tag ${finalTagClass}" style="background-color:${info.tagBg};color:${info.tagColor}">${displayTagText}</div>`:"";
  const addBtnHtml=usable.length?`<div class="add-btn-tag">＋</div>`:"";
  const priceHtml=usable.length?`<div class="price">${getVariantGroupPrice(usable)}</div>`:"";
  const colorDotsHtml=getColorDotsHtml(variants);

  const parsedItem=parseItemVariant(item);
  const isVariant=
    variants.length>1||
    parsedItem.sizes.length>0||
    !!parsedItem.colorCode;
  const sizeHtml=jiwuCatalogSpecHtml(variants);
  const hiddenRoles=["三小隻","其他角色","綜合角色","水族","動物","食物"];
  const role=String(item.role||"").trim();
  const displayName=item.name+(role&&!hiddenRoles.includes(role)?` ${role}`:"");
  const fullImg=fastImg(item.img);

  const immediate=false;
  card.innerHTML=`${tagHtml}${addBtnHtml}<img data-immediate="${immediate}" data-full="${fullImg}" loading="lazy" decoding="async"><div class="name">${formatName(displayName)}</div>${priceHtml}${colorDotsHtml}${sizeHtml}`;

  const addBtn=card.querySelector('.add-btn-tag');
  if(addBtn){
    addBtn.onclick=e=>{
      e.stopPropagation();
      if(isVariant)openVariantPicker(e,variants);
      else{
        const i=getItemOrderInfo(item);
        addToCart(e,item,i.tagText||"預訂",i.tagBg,i.tagColor);
      }
    };
  }

  card.onclick=e=>{
    if(isVariant)openVariantPicker(e,variants);
    else zoomCard(card);
  };
  mountProductGallery(card.querySelector('img'),item.images||productPhotos(item.img));
  return card;
}

function formatName(n){
  if(!n)return n;

  const text=n.trim();
  const charCount=[...text.replace(/\s/g,"")].length;

  // 名稱＋角色合計 7 字以內：保留空白，不換行
  if(charCount<=7){
    return text.replace(/ /g,"&nbsp;");
  }

  // 超過 7 字：原本有空白就以空白處換行
  if(text.includes(" ")){
    return text.split(" ").join("<br>");
  }

  return [...text].length>9
    ?[...text].slice(0,9).join("")+"<br>"+[...text].slice(9).join("")
    :text;
}

function zoomCard(c){
  const ov=document.createElement('div');

  ov.className='card-overlay';

  const clone=c.cloneNode(true);
  restoreProductGallery(clone);
  const img=clone.querySelector('img');

  if(img){
    setCatalogImage(img,img.dataset.full||img.src,true);
    img.removeAttribute('loading');
    img.decoding='async';
  }

  ov.appendChild(clone);

  ov.onclick=()=>{
    ov.remove();
  };

  document.body.appendChild(ov);
}

(function initDraggableCart(){
  const el=document.getElementById('cart-trigger');

  let isDragging=false;
  let startX,startY,initialX,initialY;

  const dragStart=e=>{
    isDragging=false;
    el.style.transition='none';

    const clientX=e.type==='touchstart'
      ?e.touches[0].clientX
      :e.clientX;

    const clientY=e.type==='touchstart'
      ?e.touches[0].clientY
      :e.clientY;

    startX=clientX;
    startY=clientY;

    const rect=el.getBoundingClientRect();

    initialX=rect.left;
    initialY=rect.top;

    document.addEventListener('mousemove',dragMove);
    document.addEventListener('touchmove',dragMove,{passive:false});
    document.addEventListener('mouseup',dragEnd);
    document.addEventListener('touchend',dragEnd);
  };

  const dragMove=e=>{
    const clientX=e.type==='touchmove'
      ?e.touches[0].clientX
      :e.clientX;

    const clientY=e.type==='touchmove'
      ?e.touches[0].clientY
      :e.clientY;

    const dx=clientX-startX;
    const dy=clientY-startY;

    if(Math.abs(dx)>5||Math.abs(dy)>5){
      isDragging=true;

      if(e.cancelable){
        e.preventDefault();
      }

      el.style.left=(initialX+dx)+'px';
      el.style.top=(initialY+dy)+'px';
      el.style.right='auto';
      el.style.bottom='auto';
    }
  };

  const dragEnd=()=>{
    document.removeEventListener('mousemove',dragMove);
    document.removeEventListener('touchmove',dragMove);
    document.removeEventListener('mouseup',dragEnd);
    document.removeEventListener('touchend',dragEnd);

    if(isDragging){
      el.style.transition=
        'left .3s ease,right .3s ease,top .3s ease';

      const rect=el.getBoundingClientRect();
      const screenWidth=window.innerWidth;

      if(rect.left+rect.width/2<screenWidth/2){
        el.style.left='10px';
      }else{
        el.style.left=
          (screenWidth-rect.width-10)+'px';
      }

      if(rect.top<50){
        el.style.top='50px';
      }

      if(rect.top>window.innerHeight-60){
        el.style.top=
          (window.innerHeight-60)+'px';
      }
    }
  };

  el.addEventListener('click',e=>{
    if(isDragging){
      e.preventDefault();
    }else{
      toggleCart(true);
    }
  });

  el.addEventListener('mousedown',dragStart);
  el.addEventListener('touchstart',dragStart,{passive:false});
})();
