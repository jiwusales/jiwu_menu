<script>

let allItems=[],allGroups=[],selectedGroup=null,groupSettings={};
const STOCK_STYLES={"現貨":{bg:"#FFF4BD",color:"#333",tagClass:""},"SOLD OUT":{bg:"#3a3a3a",color:"#fff",tagClass:"sold-out"},"受注":{bg:"#B1DEC1",color:"#fff",tagClass:""},"路上":{bg:"#6C95B0",color:"#fff",tagClass:""},"預訂":{bg:"#C197D2",color:"#fff",tagClass:""}};
const CART_KEY="jiwu_jingpin_cart";

function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart))}
function getCartSourceName(i){return String(i.groupName||i.ipName||i.ip||i.group||selectedGroup||"").trim()||"商品"}
function getUrlGroup(){return new URLSearchParams(location.search).get("group")||""}

function loadData(){
  return catalogDataRequest.then(t=>{try{
const data=JSON.parse(t.substr(47).slice(0,-2)),H={group:"團名",role:"角色",name:"名稱",originalPrice:"原價",price:"售價",stock:"庫存",launchItemId:"商品ID",status:"狀態",sn:"貨號",img:"圖片",url:"商品網址",size:"尺寸",format:"格式",note:"備註",banner:"首圖",color:"主色系"},labels=(data.table.cols||[]).map(c=>String(c.label||"").trim()),C={};
Object.keys(H).forEach(k=>C[k]=labels.indexOf(H[k]));
const v=(r,i)=>i===-1||!r.c||!r.c[i]?"":String(r.c[i].v??r.c[i].f??"").trim();
let g="",banner="",color="",note="";groupSettings={};
const raw=data.table.rows.map(r=>{const rg=v(r,C.group);if(rg){g=rg;banner=v(r,C.banner)||banner;color=v(r,C.color)||color;note=v(r,C.note)||note;groupSettings[g]={banner,color,note}}return{group:g,role:v(r,C.role)||" ",name:v(r,C.name),originalPrice:v(r,C.originalPrice),price:v(r,C.price),stock:v(r,C.stock),launchItemId:v(r,C.launchItemId),status:v(r,C.status),sn:v(r,C.sn),img:v(r,C.img)||"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png",url:v(r,C.url),size:v(r,C.size),format:v(r,C.format)}});
allItems=raw.filter(i=>i.group&&String(i.name).trim()&&!["x","ｘ"].includes(String(i.stock).trim().toLowerCase()));
allGroups=[...new Set(allItems.map(i=>i.group))];
const ug=getUrlGroup();selectedGroup=allGroups.includes(ug)?ug:allGroups[0];
if(!ug&&selectedGroup){const u=new URL(location.href);u.searchParams.set("group",selectedGroup);history.replaceState({},"",u.pathname+"?"+u.searchParams)}
renderGroupNav();applyGroupSettings(selectedGroup);renderItems();updateCartUI();
}catch(e){console.error(e);document.getElementById("items-wrapper").innerHTML="載入失敗。"}}).catch(()=>document.getElementById("items-wrapper").innerHTML="載入失敗。");
}

window.addEventListener("popstate",()=>{const g=getUrlGroup();if(allGroups.includes(g)&&g!==selectedGroup){selectedGroup=g;renderGroupNav();applyGroupSettings(g);renderItems();scrollTo({top:0,behavior:"smooth"})}});

function renderBanner(url){document.getElementById("banner-wrapper").innerHTML=(url||"").trim()?`<img src="${url.trim()}">`:""}
function applyGroupSettings(g){const s=groupSettings[g]||{};let c=(s.color||CONFIG.THEME_COLOR).trim();if(c&&!c.startsWith("#"))c="#"+c;document.documentElement.style.setProperty("--theme-color",c);CONFIG.THEME_COLOR=c;document.getElementById("top-msg").textContent=(s.note||CONFIG.TOP_BAR_TEXT).trim();renderBanner(s.banner||"")}

// Returns complete physical groups only; [] means ambiguous/nonphysical text.
// Axis-internal spaces are not option separators (H400 × W390 × D180 is one group).
function jiwuPhysicalSizeGroups(sizeValue) {
  const text=String(sizeValue??'').normalize('NFKC').trim();if(!text)return [];
  const axes='(?:長|寬|肩|袖|高|深|厚|着丈|身幅|身巾|肩幅|袖丈)',amount='\\d+(?:\\.\\d+)?',unit='(?:cm|mm|公分)?';
  const axisToken=new RegExp('('+axes+')\\s*[:：]?\\s*'+amount+'\\s*'+unit,'gi');
  const xBody='(?:[HWD]?\\s*'+amount+'\\s*'+unit+'\\s*[x×]\\s*){1,2}[HWD]?\\s*'+amount+'\\s*'+unit;
  const singleX=new RegExp('^'+xBody+'$','i'),singleScalar=new RegExp('^'+amount+'\\s*(?:cm|mm|公分)$','i');
  const one=value=>singleX.test(value)||singleScalar.test(value);
  if(text.includes('/')){const parts=text.split('/').map(value=>value.trim());if(parts.every(Boolean)){const groups=parts.flatMap(value=>jiwuPhysicalSizeGroups(value));if(groups.length===parts.length)return groups;}return [];}
  if(one(text))return [text];
  const tokens=[...text.matchAll(axisToken)];
  if(tokens.length&&tokens.map(token=>token[0]).join('').replace(/\s+/g,'')===text.replace(/\s+/g,'')){
    const first=tokens[0][1],groups=[],seen=new Set();let current='';
    for(const token of tokens){const axis=token[1];if(axis===first&&current){groups.push(current);current='';seen.clear();}if(seen.has(axis))return [];seen.add(axis);current+=token[0].replace(/\s+/g,'');}
    if(current)groups.push(current);return groups;
  }
  const groupPattern=new RegExp('^(?:'+xBody+'|'+amount+'\\s*(?:cm|mm|公分))(?=$|\\s)','i');
  const groups=[];let rest=text;
  while(rest){const match=rest.match(groupPattern);if(!match)return [];groups.push(match[0].trim());rest=rest.slice(match[0].length).trim();}
  return groups;
}

// Shared conservative projection; never changes name/role/SKU/ID/price.
// inferFormat=false permits a client explicitly sending format:'' to clear it.
function jiwuSplitProductSpec(sizeValue, formatValue, inferFormat = true) {
  const normalizeFormat=value=>String(value??'').normalize('NFKC').trim().replace(/\bBOX\s+([1-9]\d*(?:入|款)?)(?=$|[\s/])/gi,'BOX$1').replace(/(單抽|单抽|抱盒)\s+([1-9]\d*(?:入|款))(?=$|[\s/])/g,'$1$2').replace(/[\s/]+/g,' ').trim();
  const originalSize=String(sizeValue??'').trim(),explicitFormat=normalizeFormat(formatValue);
  const normalized=originalSize.normalize('NFKC'),parts=normalized.split('/').map(value=>value.trim()),optionParts=normalizeFormat(originalSize).split(' ');
  const clothing=value=>/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|F|FREE|SML)$/i.test(value);
  const option=value=>clothing(value)||/^(?:(?:單抽|单抽|抱盒)(?:\s*[1-9]\d*(?:入|款))?|BOX(?:\s*[1-9]\d*(?:入|款)?)?|針式|针式|夾式|夹式|針|针|夾|夹)$/i.test(value);
  if(optionParts.length&&optionParts.every(value=>value&&option(value))){
    return {format:explicitFormat||(inferFormat?optionParts.join(' '):''),size:''};
  }
  let labels=0;while(labels<parts.length&&clothing(parts[labels]))labels++;
  const measures=jiwuPhysicalSizeGroups(parts.slice(labels).join('/'));
  if(labels>0&&measures.length===labels){
    return {format:explicitFormat||(inferFormat?parts.slice(0,labels).join(' '):''),size:measures.join(' ')};
  }
  const physicalGroups=jiwuPhysicalSizeGroups(originalSize);
  return {format:explicitFormat,size:physicalGroups.length?physicalGroups.join(' '):originalSize};
}

// Display projection only. Existing carts and pending order payloads are never rewritten.
function jiwuSpecEscape(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function jiwuFormatOptions(value){return String(value??'').split(/[\/／、,，;；\s]+/).map(value=>value.trim()).filter(Boolean);}
function parseItemVariant(item){
  const spec=jiwuSplitProductSpec(item?.size,item?.format);
  if(spec.format){
    const sizes=jiwuFormatOptions(spec.format);
    return {size:sizes[0]||'',sizes,color:'',colorCode:'',realSize:spec.size};
  }
  if(typeof parseVariant==='function'){
    const variant=parseVariant(item?.size);
    // An unambiguous physical measurement is not a colour option.
    const raw=String(item?.size??'').trim();
    if(!variant.sizes?.length&&!variant.colorCode&&variant.color===raw&&/^(?:(?:[HWD長寬高深厚肩袖Φφ]|\d)[\s\S]*\d[\s\S]*(?:cm|mm|公分|毫米|[x×])|(?:長|寬|高|深|厚|肩|袖)\s*\d)/i.test(raw))
      return {...variant,color:'',realSize:raw};
    return variant;
  }
  return {size:'',sizes:[],color:'',colorCode:'',realSize:spec.size};
}
function jiwuCatalogSpecHtml(items){
  const rows=Array.isArray(items)?items:[items];
  const formats=[...new Set(rows.flatMap(item=>parseItemVariant(item).sizes||[]))];
  return '<div class="size">'+(formats.length?'<span class="product-format">'+jiwuSpecEscape(formats.join(' '))+'</span>':'')+'</div>';
}

function jiwuCartFormatSuffix(item){
  const values=[item?.selectedSize,item?.selectedColor].map(value=>String(value??'').trim()).filter(Boolean);
  return values.length?' '+values.join('/'):'';
}
function jiwuActualSizeForOption(variant,option){
  if(typeof getVariantRealSize==='function')return getVariantRealSize(variant,option);
  const sizes=variant.sizes||[],measurements=jiwuPhysicalSizeGroups(variant.realSize);
  if(sizes.length>1&&measurements.length===sizes.length){const index=sizes.indexOf(option);return index>=0?measurements[index]:'';}
  return variant.realSize||'';
}
function jiwuSelectCatalogFormat(e,item,add){
  const variant=parseItemVariant(item),options=variant.sizes||[];
  if(String(item.selectedSize||'').trim()||!options.length)return false;
  const chosen=option=>{
    const actualSize=jiwuActualSizeForOption(variant,option);
    add({...item,selectedSize:option,actualSize});
  };
  if(options.length===1){chosen(options[0]);return true;}
  if(e)e.stopPropagation();
  const overlay=document.createElement('div'),panel=document.createElement('div'),title=document.createElement('strong');
  overlay.className='jiwu-format-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','選擇格式');
  overlay.style.cssText='position:fixed;inset:0;z-index:10001;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px';
  panel.style.cssText='background:white;border-radius:12px;padding:20px;max-width:360px;width:100%;display:flex;gap:10px;flex-wrap:wrap';
  title.textContent='選擇格式';title.style.cssText='display:block;width:100%;margin-bottom:6px';panel.appendChild(title);
  options.forEach(option=>{const button=document.createElement('button');button.type='button';button.textContent=option;button.className='variant-option';button.style.cssText='padding:8px 12px;border:1px solid #ddd;border-radius:7px;background:white;color:#444';button.onclick=()=>{overlay.remove();chosen(option);};panel.appendChild(button);});
  const close=document.createElement('button');close.type='button';close.textContent='取消';close.style.cssText='padding:8px 12px';close.onclick=()=>overlay.remove();panel.appendChild(close);
  overlay.onclick=event=>{if(event.target===overlay)overlay.remove();};overlay.appendChild(panel);document.body.appendChild(overlay);return true;
}


function addToCart(e,item,tagText,tagBg,tagColor){
  // New additions only; never normalize existing cart or pending payloads.
  if(jiwuSelectCatalogFormat(e,item,chosen=>addToCart(e,chosen,tagText,tagBg,tagColor)))return;
e.stopPropagation();if(/^n$/i.test(String(item.price||"").trim()))return;const source=String(item.group||selectedGroup).trim();cart.push({catalogSheet:CONFIG.SHEET_NAME,...item,ip:source,ipName:source,group:source,groupName:source,currentStatus:tagText||"",tagBg,tagColor});saveCart();updateCartUI();e.target.style.background="#fdd365";setTimeout(()=>e.target.style.background="#ddd",50)}
function clearCart(){if(confirm("確定要清空購物車嗎？")){cart=[];saveCart();updateCartUI()}}
function toggleCart(x){
 if(x&&window.jiwuRefreshCart)void window.jiwuRefreshCart();
document.getElementById("cart-panel").classList.toggle("open",x);document.getElementById("cart-overlay-bg").style.display=x?"block":"none"}
function getDisplayPrice(p){p=String(p||"").trim();return p.includes("-")?"參考圖示":p===""?"詢問花花":/^\d+$/.test(p)?`$${p}`:p}

function updateCartUI(){
const list=document.getElementById("cart-list"),badge=document.getElementById("cart-badge"),totalEl=document.getElementById("cart-total");list.innerHTML="";let total=0,inq=false;
cart.forEach((i,n)=>{const num=/^\d+$/.test(String(i.price||"").trim());if(!isCartRestockItem(i)){total+=num?parseInt(i.price):0;if(!num)inq=true;}const d=document.createElement("div");d.className="cart-item";const tag=i.currentStatus?`<div class="cart-tag" style="background:${i.tagBg};color:${i.tagColor||"white"}">${i.currentStatus}</div>`:"";d.innerHTML=`<img src="${i.img}"><div class="cart-item-info">${tag}<div style="font-weight:bold">${i.name}${jiwuSpecEscape(jiwuCartFormatSuffix(i))}</div><div style="color:#e44d26;font-weight:bold">${getDisplayPrice(i.price)}</div></div><span style="cursor:pointer;color:#ccc;padding:5px" onclick="removeFromCart(${n})">✕</span>`;list.appendChild(d)});
badge.textContent=cart.length;badge.style.display=cart.length?"flex":"none";totalEl.textContent=`$${total}${inq?" + 詢問報價":""}`;
}
function removeFromCart(n){cart.splice(n,1);saveCart();updateCartUI();if(document.getElementById("checkout-modal").style.display==="flex")renderCheckoutSummary()}

function isCartRestockItem(item){return ['S☹LD OUT','SOLD OUT','補貨登記','補登'].includes(String(item.currentStatus||'').trim().toUpperCase());}
function generateLineMessage(){
let msg="你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n",total=0,inq=false,n=1,groups={},order=[];
cart.forEach(i=>{const g=getCartSourceName(i);if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(i)});
order.forEach(g=>{msg+=`\n【${g}】\n`;groups[g].forEach(i=>{const p=String(i.price||"").trim();let pt="",pv=0;if(/^\d+$/.test(p)){pv=parseInt(p);pt=`$${p}`}else if(p.includes("-")){pt="參考圖示";inq=inq||!isCartRestockItem(i)}else if(!p){pt="詢問花花";inq=inq||!isCartRestockItem(i)}else{pt=p;inq=inq||!isCartRestockItem(i)}if(!isCartRestockItem(i))total+=pv;const st=isCartRestockItem(i)?"(補貨登記)":"(預訂)",hidden=["三小隻","其他角色","綜合角色","水族","動物","食物"],role=i.role&&!hidden.includes(i.role)?` ${i.role}`:"";msg+=`${n++}. ${st} ${i.name}${jiwuCartFormatSuffix(i)}${role} ${pt}\n`})});
return appendDeliveryMessage(msg+`\n總金額：$${total}${inq?" + 詢問報價":""}`);
}


function isDeliveryMobile(){
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}
let deliveryMethod = '';
function selectDelivery(input){
  deliveryMethod = input.checked ? input.value : '';
  document.querySelectorAll('.delivery-options input').forEach(el => {
    el.checked = el.value === deliveryMethod;
  });
}
function requireDelivery(){
  if (['shipping','pickup','undecided'].includes(deliveryMethod)) return true;
  alert('取貨方式記得選一個(´•᎑•`)♡');
  return false;
}
function getDeliveryNote(){
  return deliveryMethod === 'pickup' ? '面交' : deliveryMethod === 'undecided' ? '貨到詢問' : '';
}
function appendDeliveryMessage(message){
  if (deliveryMethod === 'pickup') return message + '（自取）';
  if (deliveryMethod === 'undecided') return message + '\n到貨再決定怎麼取！感ㄣ(੭•̀ᵕ•̀)੭';
  return message;
}
document.getElementById(isDeliveryMobile() ? 'delivery-cart' : 'delivery-modal').hidden = false;

async function handleCheckoutEntry(){
  if(!jiwuManualNext){if(typeof window.jiwuEnsureCartCurrent!=='function'){alert('購物車更新功能尚未載入，請重新整理後再試');return;}if(!await window.jiwuEnsureCartCurrent())return;}
if(!cart.length)return alert("購物車是空的唷！");if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){if(!requireDelivery())return;location.href=CONFIG.LINE_MSG_URL+encodeURIComponent(generateLineMessage());setTimeout(()=>{cart=[];saveCart();updateCartUI();toggleCart(false)},1500)}else openCheckoutModal()}
function openCheckoutModal(){toggleCart(false);document.getElementById("step-1").style.display="block";document.getElementById("step-2").style.display="none";renderCheckoutSummary();document.getElementById("checkout-modal").style.display="flex"}
function closeModal(){document.getElementById("checkout-modal").style.display="none"}

function renderCheckoutSummary(){
const list=document.getElementById("modal-summary-list");list.innerHTML="";let total=0,inq=false;
cart.forEach(i=>{const num=/^\d+$/.test(String(i.price||"").trim());if(!isCartRestockItem(i)){total+=num?parseInt(i.price):0;if(!num)inq=true;}const d=document.createElement("div");d.className="cart-item";const tag=i.currentStatus?`<div class="cart-tag" style="background:${i.tagBg};color:${i.tagColor||"white"}">${i.currentStatus}</div>`:"";d.innerHTML=`<img src="${i.img}"><div class="cart-item-info">${tag}<div style="font-weight:bold">${i.name}${jiwuSpecEscape(jiwuCartFormatSuffix(i))}</div><div style="color:#e44d26;font-weight:bold">${getDisplayPrice(i.price)}</div></div>`;list.appendChild(d)});
document.getElementById("modal-total-price").textContent=`$${total}${inq?" + 詢問報價":""}`;
}

async function handleFinalCheckout(){
  if(!jiwuManualNext){if(typeof window.jiwuEnsureCartCurrent!=='function'){alert('購物車更新功能尚未載入，請重新整理後再試');return;}if(!await window.jiwuEnsureCartCurrent())return;}

  if (!requireDelivery()) return;
const lineName=document.getElementById("user-line").value.trim(),igAcc=document.getElementById("user-ig").value.trim();if(!lineName)return alert("請輸入LINE名稱方便核對ι(｀･-･´)/");
const btn=document.getElementById("send-btn");btn.disabled=true;btn.textContent="傳送中 ᓫ(๑º꒳º๑)ꜝꜝ";
try{const cartData=cart.map(i=>{const s=getCartSourceName(i);return{...i,ip:s,ipName:s,group:s,groupName:s}});await jiwuSubmitOrder({source:"電腦",lineName,igAccount:igAcc,cartItems:cartData,deliveryMethod,note:getDeliveryNote()})}catch(e){alert(e.message||'訂單儲存失敗，購物車已保留，請重試');btn.disabled=false;btn.textContent='確認訂購';return;}
cart=[];saveCart();updateCartUI();document.getElementById("step-1").style.display="none";document.getElementById("step-2").style.display="block";
}

function renderGroupNav(){document.getElementById("dynamic-nav").innerHTML=allGroups.map(g=>`<a class="${selectedGroup===g?"active-role":""}" onclick='selectGroup(${JSON.stringify(g)})'>${g}</a>`).join("")}
function selectGroup(g){if(!allGroups.includes(g)||g===selectedGroup)return;selectedGroup=g;scrollTo({top:0,behavior:"smooth"});renderGroupNav();applyGroupSettings(g);renderItems();const u=new URL(location.href);u.searchParams.set("group",g);history.pushState({},"",u.pathname+"?"+u.searchParams)}

function getStockInfo(i){
const raw=String(i.stock||"").trim(),n=Number(raw);
if(raw&&Number.isFinite(n)&&n===1)return{tagKey:"現貨",tagText:"最後一個",tagBg:"#E24C60",tagColor:"#fff",tagClass:""};
if(raw&&Number.isFinite(n)&&n>=2&&n<=5)return{tagKey:"現貨",tagText:`剩餘${n}個`,tagBg:STOCK_STYLES["現貨"].bg,tagColor:STOCK_STYLES["現貨"].color,tagClass:""};
if(raw&&Number.isFinite(n)&&n>5)return{tagKey:"現貨",tagText:"還有餘量",tagBg:STOCK_STYLES["現貨"].bg,tagColor:STOCK_STYLES["現貨"].color,tagClass:""};
const k=String(i.status||"").trim(),s=STOCK_STYLES[k];return s?{tagKey:k,tagText:k,tagBg:s.bg,tagColor:s.color,tagClass:s.tagClass}:{tagKey:"",tagText:"",tagBg:"#fab460",tagColor:"white",tagClass:""};
}

function renderItems(){
const c=document.getElementById("items-wrapper"),items=allItems.filter(i=>i.group===selectedGroup);c.innerHTML="";if(!items.length)return c.innerHTML="<div style='padding:40px;color:#999'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";
const grid=document.createElement("div");grid.className="group-grid";items.forEach(i=>grid.appendChild(createCard(i)));c.appendChild(grid);
}

function createCard(i){
const card=document.createElement("div");card.className="card";const stock=String(i.stock||"").trim(),sold=stock==="-",noSale=String(i.price||"").trim()==="0";let x;
if(sold){const s=STOCK_STYLES["SOLD OUT"];x={tagKey:"SOLD OUT",tagText:"S☹LD OUT",tagBg:s.bg,tagColor:s.color,tagClass:s.tagClass}}else x=getStockInfo(i);
if(x.tagKey==="SOLD OUT")card.classList.add("is-sold-out");
const show=x.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(x.tagKey),text=show?x.tagText:"",tag=text?`<div class="stock-tag ${x.tagClass||""}" style="background:${x.tagBg};color:${x.tagColor}">${text}</div>`:"",hidden=["三小隻","其他角色","綜合角色","水族","動物","食物"],role=String(i.role||"").trim(),name=i.name+(role&&!hidden.includes(role)?` ${role}`:"");
card.innerHTML=`${tag}${noSale?"":'<div class="add-btn-tag">＋</div>'}<img src="${i.img}"><div class="name">${formatName(name)}</div>${noSale?"":`<div class="price">${getDisplayPrice(i.price)}</div>`}${jiwuCatalogSpecHtml(i)}`;
if(!noSale)card.querySelector(".add-btn-tag").onclick=e=>addToCart(e,i,text,x.tagBg,x.tagColor);card.onclick=()=>zoomCard(card);return card;
}

function formatName(n){if(!n)return n;return n.includes(" ")?n.split(" ").join("<br>"):n.length>9?n.slice(0,9)+"<br>"+n.slice(9):n}
function zoomCard(c){const o=document.createElement("div");o.className="card-overlay";o.appendChild(c.cloneNode(true));o.onclick=()=>o.remove();document.body.appendChild(o)}

(function(){
const el=document.getElementById("cart-trigger");let drag=false,sx,sy,ix,iy;
function start(e){drag=false;const p=e.touches?e.touches[0]:e,r=el.getBoundingClientRect();sx=p.clientX;sy=p.clientY;ix=r.left;iy=r.top;document.addEventListener("mousemove",move);document.addEventListener("touchmove",move,{passive:false});document.addEventListener("mouseup",end);document.addEventListener("touchend",end)}
function move(e){const p=e.touches?e.touches[0]:e,dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5){drag=true;if(e.cancelable)e.preventDefault();el.style.left=ix+dx+"px";el.style.top=iy+dy+"px";el.style.right="auto"}}
function end(){document.removeEventListener("mousemove",move);document.removeEventListener("touchmove",move);document.removeEventListener("mouseup",end);document.removeEventListener("touchend",end);if(drag){const r=el.getBoundingClientRect();el.style.left=r.left+r.width/2<innerWidth/2?"10px":innerWidth-r.width-10+"px";if(r.top<50)el.style.top="50px";if(r.top>innerHeight-60)el.style.top=innerHeight-60+"px"}}
el.onclick=e=>drag?e.preventDefault():toggleCart(true);el.addEventListener("mousedown",start);el.addEventListener("touchstart",start,{passive:false});
})();

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',loadData,{once:true});
}else{
  loadData();
}
</script>
