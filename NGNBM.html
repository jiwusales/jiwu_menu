<script>
// 初始化設定
document.documentElement.style.setProperty('--theme-color', CONFIG.THEME_COLOR);
document.documentElement.style.setProperty('--active-color', CONFIG.ACTIVE_COLOR);
document.getElementById('top-msg').textContent = CONFIG.TOP_BAR_TEXT;

let allItems = [], allCategories = [], allTypes = [], selectedTypes = [], selectedRole = null;
let selectedStockFilters = [];

// 圖片欄：同一格內以換行分隔網址；也容許網址之間的空白。
function productPhotos(value){
  return [...new Set(String(value||'').trim().split(/\s+/).filter(Boolean))];
}
function mountProductGallery(img, photos, startIndex=0){
  if(!img)return;
  photos=(Array.isArray(photos)?photos:productPhotos(photos)).map(fastImg);
  if(!photos.length)return;
  const old=img.closest('.product-gallery');
  if(old){old.replaceWith(img);}
  const box=document.createElement('div');
  box.className='product-gallery';
  img.replaceWith(box);box.appendChild(img);
  img.draggable=false;
  let index=Math.max(0,Math.min(startIndex,photos.length-1));
  const dots=document.createElement('div');dots.className='photo-dots';
  function show(next){
    index=(next+photos.length)%photos.length;
    img.src=photos[index];img.dataset.full=photos[index];
    box.dataset.photos=JSON.stringify(photos);box.dataset.index=String(index);
    [...dots.children].forEach((dot,i)=>{
      dot.classList.toggle('active',i===index);
      dot.setAttribute('aria-pressed',String(i===index));
    });
  }
  if(photos.length>1){
    for(const [label,step,symbol] of [['上一張照片',-1,'‹'],['下一張照片',1,'›']]){
      const button=document.createElement('button');button.type='button';
      button.className='photo-arrow '+(step<0?'prev':'next');
      button.textContent=symbol;button.setAttribute('aria-label',label);
      button.onclick=e=>{e.stopPropagation();show(index+step)};box.appendChild(button);
    }
    photos.forEach((_,i)=>{
      const dot=document.createElement('button');dot.type='button';
      dot.setAttribute('aria-label',`第 ${i+1} 張照片`);
      dot.onclick=e=>{e.stopPropagation();show(i)};dots.appendChild(dot);
    });box.appendChild(dots);
    let touch=null,suppressUntil=0;
    box.addEventListener('touchstart',e=>{
      touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;
    },{passive:true});
    box.addEventListener('touchend',e=>{
      if(!touch)return;
      const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;
      touch=null;
      if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){
        show(index+(dx<0?1:-1));suppressUntil=Date.now()+500;
        e.stopPropagation();
      }
    },{passive:true});
    box.addEventListener('touchcancel',()=>{touch=null},{passive:true});
    box.addEventListener('click',e=>{
      if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}
    },true);
  }
  show(index);
}

  fetch(url).then(r => r.text()).then(t => {

      const HEADER_NAMES = { ip: "IP", role: "角色", type: "種類", name: "名稱", originalPrice: "原價", price: "售價", colStock: "庫存", colShop: "店面", colNonStock: "非現", status: "狀態", sn: "貨號", img: "圖片", url: "商品網址", size: "尺寸", note: "首圖" };

      const COL = {};

        COL[key] = colLabels.indexOf(HEADER_NAMES[key]);
      });

      const getV = (r, idx) => {
        if (!r.c || !r.c[idx]) return "";
        const cell = r.c[idx];

        return String(val).trim();

      const rawItems = data.table.rows.map(r => ({
        ip: getV(r, COL.ip),

        originalPrice: getV(r, COL.originalPrice),
        price: getV(r, COL.price),
        colStock: getV(r, COL.colStock),
        colShop: getV(r, COL.colShop),
        colNonStock: getV(r, COL.colNonStock),
        status: getV(r, COL.status),
        sn: getV(r, COL.sn),
        images:productPhotos(getV(r,COL.img)||"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png"),
        img:productPhotos(getV(r,COL.img)||"https://raw.githubusercontent.com/jiwusales/imgh/main/images_1350/image_885310d2.png")[0],
        url: getV(r, COL.url),
        size: getV(r, COL.size),

      }));

      // 取得同 IP 名稱底下第一列的備註欄，作為頁面最上方的 banner 圖片網址
      const ipRows = CONFIG.IP_NAME ? rawItems.filter(i => i.ip === CONFIG.IP_NAME) : rawItems;

function parseVariant(value){
  const raw=String(value||"").trim();
  const p=raw.split(/[\/／]/).map(x=>x.trim()).filter(Boolean);

  // 每個購買方式分列，保留各列貨號、價格與庫存。
  if(/^(單抽|抱盒.*)$/.test(p[0]||'')&&p[1]!=='抱盒'){
    return {size:p[0],sizes:[p[0]],color:'',colorCode:'',realSize:p.slice(1).join('/'),sharedRealSize:true,purchaseOption:true};
  }

  // 單抽與抱盒共用同一段實際尺寸。
  if(p[0]==='單抽'&&p[1]==='抱盒'){
    return {size:'單抽',sizes:['單抽','抱盒'],color:'',colorCode:'',realSize:p.slice(2).join('/'),sharedRealSize:true};
  }

  const isSingleCode=s=>/^#?[0-9a-f]{3,8}$/i.test(String(s||"").trim());
  const isCode=s=>{
    const parts=String(s||"").split("+").map(x=>x.trim()).filter(Boolean);
    return parts.length>0&&parts.every(isSingleCode);
  };
  const code=s=>String(s||"").split("+").map(x=>{
    x=x.trim();
    return x?(x.startsWith("#")?x:"#"+x):"";
  }).filter(Boolean).join("+");

  const isSize=s=>/^(XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|2XL|3XL|4XL|5XL|FREE|F)$/i.test(String(s||"").trim());
  const looksLikeRealSize=s=>/\d|cm|mm|×|約|φ|Φ|直徑|胸寬|衣長|袖長|肩寬|高|寬|長/i.test(String(s||""));

  const sizes=[];
  let i=0;

  // 開頭連續出現的 S/M/L/XL... 全部視為可選尺寸
  while(i<p.length&&isSize(p[i])){
    sizes.push(p[i].toUpperCase());
    i++;
  }

  const rest=p.slice(i);
  let color="",colorCode="",realSize="";

  if(sizes.length){
    if(rest.length===1){
      if(isCode(rest[0])){
        colorCode=code(rest[0]);
      }else if(looksLikeRealSize(rest[0])){
        realSize=rest[0];
      }else{
        color=rest[0];
      }
    }else if(rest.length>=2){
      // 尺寸.../顏色/色碼/實際尺寸
      if(isCode(rest[1])){
        color=rest[0]||"";
        colorCode=code(rest[1]);
        realSize=rest.slice(2).join("/")||"";
      }else if(looksLikeRealSize(rest[0])){
        realSize=rest.join("/");
      }else{
        // 相容舊格式：S/粉色/胸寬40cm
        color=rest[0]||"";
        realSize=rest.slice(1).join("/")||"";
      }
    }

    return{
      size:sizes[0]||"",
      sizes,
      color,
      colorCode,
      realSize
    };
  }

  // 沒有尺寸：顏色/色碼/實際尺寸
  if(rest.length){
    color=rest[0]||"";

    if(rest.length>=2&&isCode(rest[1])){
      colorCode=code(rest[1]);
      realSize=rest.slice(2).join("/")||"";
    }else if(rest.length>=2){
      realSize=rest.slice(1).join("/")||"";
    }
  }

  return{
    size:"",
    sizes:[],
    color,
    colorCode,
    realSize
  };
}

function getVariantRealSize(variant, selectedSize){
  if(variant.sharedRealSize)return variant.realSize||'';
  const measurements=String(variant.realSize||'').split(/[／/]/).map(x=>x.trim());
  const sizes=variant.sizes||[];
  // Multiple measurements follow the same order as the size buttons.
  if(sizes.length>1 && measurements.length===sizes.length){
    const index=sizes.indexOf(String(selectedSize||'').toUpperCase());
    return index>=0?measurements[index]:'';
  }
  return variant.realSize||'';
}

function getVariantKey(item){

}

function getColorDotsHtml(items){
  const seen=new Set();
  const dots=[];

  items.forEach(item=>{
    const v=parseVariant(item.size);
    if(!v.colorCode)return;

    const key=v.colorCode.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);

    const colors=v.colorCode.split("+").map(x=>x.trim()).filter(Boolean);
    const hasWhite=colors.some(x=>{
      const c=x.toLowerCase().replace("#","");
      return c==="fff"||c==="ffffff";
    });

    let bg=colors[0]||"transparent";
    if(colors.length===2){
      bg=`linear-gradient(135deg,${colors[0]} 0%,${colors[0]} 50%,${colors[1]} 50%,${colors[1]} 100%)`;
    }else if(colors.length>2){
      const step=100/colors.length;
      bg=`linear-gradient(135deg,${colors.map((c,i)=>`${c} ${i*step}%,${c} ${(i+1)*step}%`).join(",")})`;
    }

    dots.push(`<span class="color-dot" style="background:${bg};${hasWhite?"border:1px solid #bbb":""}" title="${v.color||v.colorCode}"></span>`);
  });

  return dots.length?`<div class="color-dots">${dots.join("")}</div>`:"";
}

      </div>

      <div class="variant-section" id="variant-color-section">

        <div class="variant-options" id="variant-color-options"></div>
      </div>

      <button class="variant-add" id="variant-add">加入購物車</button>
    </div>`;

  const imgEl=ov.querySelector('#variant-img');
  const sizeSection=ov.querySelector('#variant-size-section');
  const sizeBox=ov.querySelector('#variant-size-options');
  const colorSection=ov.querySelector('#variant-color-section');
  const colorBox=ov.querySelector('#variant-color-options');
  const realSizeEl=ov.querySelector('#variant-real-size');
  const priceEl=ov.querySelector('#variant-price');
  const stockEl=ov.querySelector('#variant-stock');
  const addBtn=ov.querySelector('#variant-add');

  const colors=[...new Set(
    available.map(x=>parseVariant(x.size).color).filter(Boolean)
  )];

  const allSizes=[...new Set(
    available.flatMap(x=>parseVariant(x.size).sizes||[]).filter(Boolean)
  )];

  const hasAnySizes=allSizes.length>0;

  function rowsForSelectedColor(){
    if(!colors.length||!selectedColor)return available;
    return available.filter(x=>parseVariant(x.size).color===selectedColor);
  }

  function validSizesForSelectedColor(){
    return [...new Set(
      rowsForSelectedColor()
        .flatMap(x=>parseVariant(x.size).sizes||[])
        .filter(Boolean)
    )];
  }

  function findItem(){
    let matches=rowsForSelectedColor();

    if(selectedSize){
      const sizeMatches=matches.filter(x=>{
        const v=parseVariant(x.size);
        return (v.sizes||[]).includes(selectedSize);
      });

      if(sizeMatches.length)matches=sizeMatches;
    }

    return matches[0]||null;
  }

  function renderSizeButtons(){
    const validSizes=validSizesForSelectedColor();

    if(!hasAnySizes||!validSizes.length){
      selectedSize="";
      sizeSection.style.display='none';
      sizeBox.innerHTML="";
      return;
    }

    sizeSection.style.display='block';

    if(!validSizes.includes(selectedSize)){
      selectedSize=validSizes[0];
    }

    sizeBox.innerHTML="";

    validSizes.forEach(size=>{
      const b=document.createElement('button');
      b.className='variant-option';
      b.dataset.value=size;
      b.textContent=size;
      b.classList.toggle('active',size===selectedSize);

      b.onclick=ev=>{
        ev.stopPropagation();
        selectedSize=size;
        setChosen();
      };

      sizeBox.appendChild(b);
    });
  }

  function updateColorButtons(){
    colorBox.querySelectorAll('.variant-option').forEach(b=>{
      b.disabled=false;
      b.classList.toggle('active',b.dataset.value===selectedColor);
    });
  }

  function setChosen(){
    selectedItem=findItem();

    sizeBox.querySelectorAll('.variant-option').forEach(b=>{
      b.classList.toggle('active',b.dataset.value===selectedSize);
    });

    updateColorButtons();

    if(!selectedItem){
      addBtn.disabled=true;
      return;
    }

    const v=parseVariant(selectedItem.size);

    selectedItem={
      ...selectedItem,
      selectedSize:selectedSize,
      selectedColor:selectedColor||v.color||"",
      actualSize:getVariantRealSize(v,selectedSize)
    };

    mountProductGallery(imgEl,selectedItem.images||productPhotos(selectedItem.img||first.img));
    priceEl.textContent=getDisplayPrice(selectedItem.price);
    realSizeEl.textContent=selectedItem.actualSize;

    const info=getItemOrderInfo(selectedItem);
    const showTag=info.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(info.tagKey);

    stockEl.style.display=showTag?"flex":"none";

    if(showTag){
      stockEl.textContent=info.tagText;
      stockEl.style.background=info.tagBg;
      stockEl.style.color=info.tagColor;
    }

    addBtn.textContent=info.tagKey==="SOLD OUT"?"補貨登記":"加入購物車";
    addBtn.disabled=false;
  }

  if(colors.length){
    colors.forEach(color=>{
      const b=document.createElement('button');
      b.className='variant-option';
      b.dataset.value=color;
      b.textContent=color;
      b.classList.toggle('active',color===selectedColor);

      b.onclick=ev=>{
        ev.stopPropagation();
        selectedColor=color;

        // 換顏色時，尺寸只留下該顏色真正有的尺寸
        renderSizeButtons();
        setChosen();
      };

      colorBox.appendChild(b);
    });
  }else{
    colorSection.style.display='none';
  }

  renderSizeButtons();
  setChosen();

  addBtn.onclick=ev=>{
    ev.stopPropagation();
    if(!selectedItem)return;

    const info=getItemOrderInfo(selectedItem);
    addToCart(ev,selectedItem,info.tagText||"預訂",info.tagBg,info.tagColor);
    ov.remove();
  };

  ov.querySelector('.variant-close').onclick=()=>ov.remove();
  ov.onclick=ev=>{if(ev.target===ov)ov.remove()};
  document.body.appendChild(ov);
}

function getVariantGroupPrice(items){

  return prices.length===1?`$${prices[0]}`:`$${prices[0]}~$${prices[prices.length-1]}`;

  const p = String(price || "").trim();
  if (p.indexOf('-') !== -1) return "組合出售";
  if (p === "") return "詢問花花";
  if (/^[0-9]+$/.test(p)) return `$${p}`;
  return p;
}

function updateCartUI() {
  const list = document.getElementById('cart-list');
  const badge = document.getElementById('cart-badge');
  const totalEl = document.getElementById('cart-total');
  list.innerHTML = "";
  let total = 0;
  let hasInquiry = false;

  cart.forEach((item, index) => {
    const isNumeric = /^[0-9]+$/.test(String(item.price || "").trim());
    const priceVal = isNumeric ? parseInt(item.price) : 0;
    if (!isNumeric) hasInquiry = true;
    total += priceVal;

    const div = document.createElement('div');
    div.className = 'cart-item';
    const tagHtml = item.currentStatus ? `<div class="cart-tag" style="background-color:${item.tagBg}; color:${item.tagColor || 'white'};">${item.currentStatus}</div>` : "";
    
    div.innerHTML = `
      <img src="${fastImg(item.img)}" loading="lazy" decoding="async">
      <div class="cart-item-info">
        ${tagHtml}${getCartVariantTags(item)}
        <div style="font-weight:bold; margin-bottom:2px;">${item.name}</div>
        <div style="color:#e44d26; font-weight:bold; margin-top:2px;">${getDisplayPrice(item.price)}</div>
      </div>
      <span style="cursor:pointer; color:#ccc; padding:5px;" onclick="removeFromCart(${index})">✕</span>
    `;
    list.appendChild(div);
  });
  badge.textContent = cart.length;
  badge.style.display = cart.length > 0 ? "flex" : "none";
  totalEl.textContent = `$${total}${hasInquiry ? " + 詢問報價" : ""}`;
}

}

function generateLineMessage() {
  let msg="你好，我想購買以下酷東西(৹˙꒳​˙ฅ)：\n",total=0,hasInquiry=false;
  const groupedCart={},groupOrder=[];

  cart.forEach(item=>{
    const gName=getCartSourceName(item);
    if(!groupedCart[gName]){
      groupedCart[gName]=[];
      groupOrder.push(gName);
    }
    groupedCart[gName].push(item);
  });

  let index=1;
  groupOrder.forEach(gName=>{
    msg+=`\n【${gName}】\n`;
    groupedCart[gName].forEach(item=>{
      const p=String(item.price||"").trim();
      let priceText="",priceVal=0;

      if(/^[0-9]+$/.test(p)){
        priceVal=parseInt(p);
        priceText=`$${p}`;
      }else if(p.includes("-")){
        priceText="組合出售";
        hasInquiry=true;
      }else if(!p){
        priceText="詢問花花";
        hasInquiry=true;
      }else{
        priceText=p;
        hasInquiry=true;
      }

      total+=priceVal;

      let statusText="";
if(item.currentStatus==="S☹LD OUT") statusText="(補貨登記)";
else if(item.currentStatus==="最後一個") statusText="(現貨)";
else if(item.currentStatus) statusText=`(${item.currentStatus})`;

      const hiddenRoles=["三小隻","其他角色","綜合角色","水族","食物","動物","全角色"];
      const roleText=item.role&&!hiddenRoles.includes(item.role)?` ${item.role}`:"";

      const variantText=getVariantDisplay(item);
      msg+=`${index}.${statusText}${item.name}${roleText}${variantText ? " " + variantText : ""} ${priceText}\n`;
      index++;
    });
  });

  msg+=`\n總金額：$${total}${hasInquiry?" + 詢問報價":""}`;
  return msg;
}

function handleCheckoutEntry() {
  if (cart.length === 0) return alert("購物車是空的唷！");
  const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobileDevice) {
    const msg = generateLineMessage();
    window.location.href = CONFIG.LINE_MSG_URL + encodeURIComponent(msg);
    setTimeout(() => { 
      cart = []; saveCart(); updateCartUI(); toggleCart(false); 
    }, 1500);
  } else {
    openCheckoutModal();
  }
}

function openCheckoutModal() {
  toggleCart(false);
  document.getElementById('step-1').style.display = "block";
  document.getElementById('step-2').style.display = "none";
  renderCheckoutSummary();
  document.getElementById('checkout-modal').style.display = "flex";
}

function renderCheckoutSummary() {
  const summaryList = document.getElementById('modal-summary-list');
  const totalEl = document.getElementById('modal-total-price');
  summaryList.innerHTML = "";
  let total = 0;
  let hasInquiry = false;

  cart.forEach((item) => {
    const isNumeric = /^[0-9]+$/.test(String(item.price || "").trim());
    const priceVal = isNumeric ? parseInt(item.price) : 0;
    if (!isNumeric) hasInquiry = true;
    total += priceVal;

    const div = document.createElement('div');
    div.className = 'cart-item';
    const tagHtml = item.currentStatus ? `<div class="cart-tag" style="background-color:${item.tagBg}; color:${item.tagColor || 'white'};">${item.currentStatus}</div>` : "";
    div.innerHTML = `
      <img src="${fastImg(item.img)}" loading="lazy" decoding="async">
      <div class="cart-item-info">
        ${tagHtml}${getCartVariantTags(item)}
        <div style="font-weight:bold; margin-bottom:2px;">${item.name}</div>
        <div style="color:#e44d26; font-weight:bold; margin-top:2px;">${getDisplayPrice(item.price)}</div>
      </div>
    `;
    summaryList.appendChild(div);
  });
  totalEl.textContent = `$${total}${hasInquiry ? " + 詢問報價" : ""}`;
}

function closeModal() { document.getElementById('checkout-modal').style.display = "none"; }

function handleFinalCheckout() {
  const lineName = document.getElementById('user-line').value.trim();
  const igAcc = document.getElementById('user-ig').value.trim();

  if (!lineName) {
    alert("請輸入LINE名稱方便核對ι(｀･-･´)/");
    return;
  }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = "傳送中 ᓫ(๑º꒳º๑)ꜝꜝ";

  const cartData = cart.map(item => {
    const source = getCartSourceName(item);
    return {...item, ip:source, ipName:source, group:source, groupName:source};
  });

  const postData = {
    source: "電腦",
    lineName,
    igAccount: igAcc,
    cartItems: cartData
  };

  fetch(CONFIG.DEPLOY_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(postData)
  }).catch(e => console.error("GAS 傳送失敗", e));

  cart = [];
  saveCart();
  updateCartUI();

  document.getElementById('step-1').style.display = "none";
  document.getElementById('step-2').style.display = "block";
}

// 渲染導覽與篩選
function renderRoleNav() {
  const nav = document.getElementById('dynamic-nav');
  nav.innerHTML = allCategories.map(cat => {
    const isSelected = selectedRole === cat;
    return `<a class="${isSelected ? 'active-role' : ''}" onclick="toggleRole('${cat}')">${cat}</a>`;
  }).join('');
}

function toggleRole(cat) { 
  selectedRole = (selectedRole === cat) ? null : cat; 
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderRoleNav(); 
  renderItems(); 
}

function renderFilters() {
  const filterBar = document.getElementById('filter-bar');
  const typeHtml = allTypes.map(t => {
    const isActive = selectedTypes.includes(t);
    return `<label class="filter-item ${isActive ? 'active' : ''}"><input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleType('${t}')">${t}</label>`;
  }).join('');

  // 只顯示目前商品清單裡實際存在的貨況（例如沒有任何商品是「-」，就不顯示「補貨登記」勾選項）
  const availableStockKeys = new Set(allItems.map(i => getStockInfo(i).tagKey).filter(Boolean));
  const stockHtml = STOCK_FILTER_OPTIONS.filter(opt => availableStockKeys.has(opt.key)).map(opt => {
    const isActive = selectedStockFilters.includes(opt.key);
    return `<label class="filter-item ${isActive ? 'active' : ''}"><input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleStockFilter('${opt.key}')">${opt.label}</label>`;
  }).join('');

  filterBar.innerHTML = stockHtml + typeHtml;
}

function toggleType(type) {
  if (selectedTypes.includes(type)) { selectedTypes = selectedTypes.filter(t => t !== type); }
  else { selectedTypes.push(type); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderFilters(); renderItems();
}

function toggleStockFilter(key) {
  if (selectedStockFilters.includes(key)) { selectedStockFilters = selectedStockFilters.filter(k => k !== key); }
  else { selectedStockFilters.push(key); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderFilters(); renderItems();
}

// 渲染商品卡片
function renderItems() {
  const container = document.getElementById('items-wrapper');
  container.innerHTML = "";
  const isFilterMode = selectedTypes.length > 0 || selectedStockFilters.length > 0;
  let filteredItems = selectedTypes.length > 0 ? allItems.filter(i => selectedTypes.includes(i.type)) : allItems;
  if (selectedStockFilters.length > 0) {
    filteredItems = filteredItems.filter(i => selectedStockFilters.includes(getStockInfo(i).tagKey));
  }
  if (selectedRole) { filteredItems = filteredItems.filter(i => i.role === selectedRole); }
  
  if (filteredItems.length === 0) {
    container.innerHTML = "<div style='padding: 40px; color: #999;'>目前還沒有這類的酷東西(՞•̀ω•́՞)⸝ި ʕᦏ</div>";
    return;
  }

  if (!isFilterMode && !selectedRole) {
    allCategories.forEach(cat => {
      const catItems = filteredItems.filter(i => i.role === cat);
      if (catItems.length === 0) return;
      const div = document.createElement('div');
      div.className = 'type-divider'; div.id = cat; div.textContent = cat;
      container.appendChild(div);
      const grid = document.createElement('div');
      grid.className = 'group-grid';
      appendVariantCards(grid, catItems);
      container.appendChild(grid);
    });
  } else {
    const grid = document.createElement('div');
    grid.className = 'group-grid';
    grid.style.paddingTop = "10px";
    appendVariantCards(grid, filteredItems);
    container.appendChild(grid);
  }
}

// 依商品的庫存/店面/非現/欄位資料，計算這個商品目前的貨況狀態
// 回傳 { tagKey, tagText, tagBg, tagColor, tagClass }，tagKey 是給篩選/顯示設定用的識別字串
function getStockInfo(item) {
  let tagKey = "", tagText = "", tagBg = "#fab460", tagColor = "white", tagClass = "";

  const stockNum = parseFloat(item.colStock) || 0;
  const shopNum = parseFloat(item.colShop) || 0;
  const nonStockNum = parseFloat(item.colNonStock) || 0;
  const nonStockRaw = String(item.colNonStock).toLowerCase();

  if (item.colStock === "-") {
    tagKey = "SOLD OUT";
    tagText = "S☹LD OUT";
    tagBg = "#3a3a3a";
    tagColor = "#ffffff";
    tagClass = "sold-out";
  }
  else if (stockNum === 1) {
    tagKey = "現貨";
    tagText = "最後一個";
    tagBg = "#E24C60";
    tagColor = "#ffffff";
  }
  else if (stockNum > 0 || shopNum > 0) {
    tagKey = "現貨";
    tagText = "現貨";
    tagBg = "#FFF4BD";
    tagColor = "#333";
  }
  else if (nonStockNum > 0 && nonStockRaw.endsWith('v')) {
    tagKey = "受注";
    tagText = "受注";
    tagBg = "#B1DEC1";
  }
  else if (nonStockNum > 0) {
    tagKey = "現貨";
    tagText = "路上";
    tagBg = "#6C95B0";
  }
  else if (item.colStock === "0" && item.colShop === "") {
    tagKey = "預訂";
    tagText = "預訂";
    tagBg = "#C197D2";
  }
  return { tagKey, tagText, tagBg, tagColor, tagClass };
}

function createCard(variants,sectionColor=""){
  const usable=variants.filter(canAddItem);
  const item=usable.find(x=>String(x.colStock||"").trim()!=="-")||usable[0]||variants[0];
  const card=document.createElement('div');
  card.className='card';

  const borderColor=CONFIG.ROLE_BORDER_COLORS[item.role]||CONFIG.THEME_COLOR;
  if(borderColor){
    card.style.borderColor=borderColor.startsWith("#")?borderColor:"#"+borderColor;
  }

  const allSoldOut=variants.every(x=>String(x.colStock||"").trim()==='-');
  const info=allSoldOut?getItemOrderInfo(variants[0]):getItemOrderInfo(item);
  if(allSoldOut)card.classList.add('is-sold-out');

  const shouldShowTag=info.tagKey&&CONFIG.VISIBLE_STOCK_TAGS.includes(info.tagKey);
  const displayTagText=shouldShowTag?info.tagText:"";
  const finalTagClass=info.tagClass||(displayTagText.length>=2?"vertical":"");
  const tagHtml=displayTagText?`<div class="stock-tag ${finalTagClass}" style="background-color:${info.tagBg};color:${info.tagColor}">${displayTagText}</div>`:"";
  const addBtnHtml=usable.length?`<div class="add-btn-tag">＋</div>`:"";
  const priceHtml=usable.length?`<div class="price">${getVariantGroupPrice(usable)}</div>`:"";
  const colorDotsHtml=getColorDotsHtml(variants);

  const parsedItem=parseVariant(item.size);
  const isVariant=
    variants.length>1||
    parsedItem.sizes.length>0||
    !!parsedItem.colorCode;
  const sizeHtml=`<div class="size">${parsedItem.sharedRealSize?parsedItem.realSize:(isVariant?"":(item.size||""))}</div>`;
  const hiddenRoles=["三小隻","其他角色","綜合角色","水族","動物","食物"];
  const role=String(item.role||"").trim();
  const displayName=item.name;
  const fullImg=fastImg(item.img);

  card.innerHTML=`${tagHtml}${addBtnHtml}<img src="${fullImg}" data-full="${fullImg}" loading="lazy" decoding="async"><div class="name">${formatName(displayName)}</div>${priceHtml}${colorDotsHtml}${sizeHtml}`;

  const addBtn=card.querySelector('.add-btn-tag');
  if(addBtn){
    addBtn.onclick=e=>{
      e.stopPropagation();
      if(isVariant)openVariantPicker(e,variants);
      else{
        const i=getItemOrderInfo(item);
        addToCart(e,item,i.tagText||"預訂",i.tagBg,i.tagColor);
      }
    };
  }

  card.onclick=e=>{
    if(isVariant)openVariantPicker(e,variants);
    else zoomCard(card);
  };
  mountProductGallery(card.querySelector('img'),item.images||productPhotos(item.img));
  return card;
}

function formatName(n) {
  if (!n) return n;
  // 如果名稱中有空白鍵，直接在空白處換行
  if (n.indexOf(' ') !== -1) return n.split(' ').join('<br>');
  return n.length > 9 ? n.slice(0, 9) + "<br>" + n.slice(9) : n;
}

function zoomCard(c) {
  const ov = document.createElement('div'); ov.className = 'card-overlay';
  const clone = c.cloneNode(true);
  restoreProductGallery(clone);
  const img = clone.querySelector('img');
  if (img) { img.src = img.dataset.full || img.src; img.removeAttribute('loading'); img.decoding = 'async'; }
  ov.appendChild(clone);
  ov.onclick = () => ov.remove(); document.body.appendChild(ov);
}

// 懸浮購物車拖動邏輯
(function initDraggableCart() {
  const el = document.getElementById('cart-trigger');
  let isDragging = false;
  let startX, startY, initialX, initialY;
  const dragStart = (e) => {
    isDragging = false; el.style.transition = 'none';
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
    startX = clientX; startY = clientY;
    const rect = el.getBoundingClientRect();
    initialX = rect.left; initialY = rect.top;
    document.addEventListener('mousemove', dragMove); document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('mouseup', dragEnd); document.addEventListener('touchend', dragEnd);
  };
  const dragMove = (e) => {
    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    const dx = clientX - startX, dy = clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      isDragging = true; if (e.cancelable) e.preventDefault();
      el.style.left = (initialX + dx) + 'px'; el.style.top = (initialY + dy) + 'px';
      el.style.right = 'auto'; el.style.bottom = 'auto';
    }
  };
  const dragEnd = () => {
    document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
    if (isDragging) {
      el.style.transition = 'left 0.3s ease, right 0.3s ease, top 0.3s ease';
      const rect = el.getBoundingClientRect(), screenWidth = window.innerWidth;
      if (rect.left + rect.width / 2 < screenWidth / 2) el.style.left = '10px';
      else el.style.left = (screenWidth - rect.width - 10) + 'px';
      if (rect.top < 50) el.style.top = '50px';
      if (rect.top > window.innerHeight - 60) el.style.top = (window.innerHeight - 60) + 'px';
    }
  };
  el.addEventListener('click', (e) => { if (isDragging) e.preventDefault(); else toggleCart(true); });
  el.addEventListener('mousedown', dragStart);
  el.addEventListener('touchstart', dragStart, { passive: false });
})();
